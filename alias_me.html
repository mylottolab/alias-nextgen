<script>
/* ⚠ alias_common.js 를 못 읽으면 화면이 텅 빕니다. 글씨를 채우는 것이
   그 파일이기 때문입니다. 빈 화면만 보면 원인을 알 수가 없어서,
   여기서 잡아 사람 말로 알려줍니다.
   가장 흔한 원인은 anon 열쇠 줄이 두 줄로 나뉜 것입니다. */
document.addEventListener("DOMContentLoaded", function(){
  if (typeof AL === "undefined" || typeof AL.t !== "function") {
    document.body.innerHTML =
      '<div style="padding:26px;font-family:system-ui,sans-serif;line-height:1.8;' +
      'color:#DDE5F0;background:#0E1621;min-height:100vh">' +
      '<b style="font-size:17px">alias_common.js 를 못 읽었습니다.</b><br><br>' +
      '가장 흔한 원인은 anon 열쇠 줄이 두 줄로 나뉜 것입니다.<br>' +
      'alias_common.js 20번 줄이 한 줄인지 확인하세요.<br><br>' +
      '<span style="color:#7E8FA6">F12 → Console 에 진짜 원인이 찍힙니다.</span></div>';
    return;
  }
  AL.bootTheme();
});
</script>
<style>

#faceBg{display:none;position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6)}

/* 🔴 2026-09-13 — 별칭 목록의 얼굴표.

<script>
/* =====================================================================
   나 — 별칭 관리 + 계정
   ⚠ 여기 있는 별칭은 전부 내가 만든 것입니다. 남이 넣을 수 없습니다.
     personas 정책이 account_id = auth.uid() 로 막고 있습니다.
   ===================================================================== */

let me = null;
let aliases = [];

function showErr(msg){
  const el = document.getElementById('err');
  el.textContent = msg; el.classList.add('show');
  document.getElementById('ok').classList.remove('show');
}
function showOk(msg){
  const el = document.getElementById('ok');
  el.textContent = msg; el.classList.add('show');
  document.getElementById('err').classList.remove('show');
}
function clearMsg(){
  document.getElementById('err').classList.remove('show');
  document.getElementById('ok').classList.remove('show');
}

function paintList(){
  const ul = document.getElementById('list');
  if (!aliases.length) {
    ul.innerHTML = '<li class="empty">' + AL.esc(AL.t('aliasEmpty')) + '</li>';
    return;
  }
  ul.innerHTML = aliases.map(function(a){
    return '<li class="row">' +
      '<div class="row-main">' +
        /* 🔴 2026-09-13 — 별칭 앞에 얼굴표를 답니다.
           목록에서 색이 갈려 있어야 "여러 개의 나" 가 눈에 들어옵니다. */
        /* 🔴 2026-09-13 — 사진이 있으면 사진을, 없으면 색 얼굴표를.
           data-face 에 경로를 달아두면 AL.paintFaces() 가 찾아 칠합니다. */
        '<span class="facemark"' + AL.faceAttr(a.display_name) +
          (a.avatar_url ? ' data-face="' + AL.esc(a.avatar_url) + '"' : '') + '>' +
          AL.esc(AL.initial(a.display_name)) + '</span>' +
        '<span class="row-name">' + AL.esc(a.display_name) + '</span>' +
        (a.is_default ? '<span class="badge">' + AL.esc(AL.t('aliasDefault')) + '</span>' : '') +
      '</div>' +
      '<div class="row-acts">' +
        '<a class="rowlink" href="alias_invite.html?face=' + encodeURIComponent(a.id) + '">' +
          AL.esc(AL.t('aliasUseForInvite')) + '</a>' +
        /* 🔴 2026-09-13 — 단추 하나로 모읍니다.
           누르면 "지금 사진 · 바꾸기 · 지우기" 가 한 창에 다 나옵니다.
           줄에 단추를 셋 넷 늘어놓으면 좁은 폰에서 찌그러집니다(함정 81). */
        '<button data-face-btn="' + AL.esc(a.id) + '">' +
          AL.esc(AL.t(a.avatar_url ? 'faceChange' : 'faceAdd')) + '</button>' +
        /* 🔴 2026-09-15 — 이 별칭의 초대를 바로 뽑으러 갑니다.
           초대 화면까지 가서 다시 찾는 수고를 덜어줍니다. */
        '<button data-qr="' + AL.esc(a.id) + '">' +
          AL.esc(AL.t('qrPrint')) + '</button>' +
        /* 🔴 2026-09-18 — 이 별칭의 갤러리를 꾸미러 갑니다. */
        '<button data-gal="' + AL.esc(a.id) + '">' +
          AL.esc(AL.t('glTitle')) + '</button>' +
        (a.is_default ? '' :
          '<button data-def="' + AL.esc(a.id) + '">' + AL.esc(AL.t('aliasMakeDef')) + '</button>') +
      '</div>' +
    '</li>';
  }).join('');

  ul.querySelectorAll('[data-def]').forEach(function(b){
    b.addEventListener('click', function(){ makeDefault(b.getAttribute('data-def')); });
  });
  ul.querySelectorAll('[data-gal]').forEach(function(b){
    b.addEventListener('click', function(){
      location.href = 'alias_gallery.html?p=' +
        encodeURIComponent(b.getAttribute('data-gal')) + '&edit=1';
    });
  });
  ul.querySelectorAll('[data-qr]').forEach(function(b){
    b.addEventListener('click', function(){
      location.href = 'alias_invite.html?face=' +
        encodeURIComponent(b.getAttribute('data-qr')) + '&print=1';
    });
  });
  ul.querySelectorAll('[data-face-btn]').forEach(function(b){
    b.addEventListener('click', function(){ startFace(b.getAttribute('data-face-btn')); });
  });

  /* 🔴 2026-09-13 — 글자를 먼저 그려두고 사진은 오는 대로 덮어씁니다.
     서랍이 비공개라 주소를 받아오는 데 잠깐 걸립니다.
     기다렸다 그리면 화면이 비어 보입니다. */
  AL.paintFaces(ul);
}

/* =====================================================================
   🔴🔴 2026-09-13 신설 — 별칭 사진 넣기

   순서가 셋입니다. 한 번에 올리지 않습니다.
     ① 경고를 읽는다      — 얼굴 사진이 무엇을 뜻하는지
     ② 사진을 고른다
     ③ 몇 명이 보게 되는지 확인하고 올린다

   ⚠ ①을 건너뛰게 만들지 마세요. 이 앱은 얼굴을 감추려고 쓰는 앱인데,
     사진 한 장으로 그게 무너질 수 있습니다. 손님이 그걸 알고 고르셔야
     합니다. 막는 게 아니라 알려드리는 것입니다.
   ===================================================================== */
let facePersona = null;
let facePicked = null;

function faceSheet(on){
  document.getElementById('faceBg').style.display = on ? 'block' : 'none';
  document.getElementById('faceBox').style.display = on ? 'block' : 'none';
}
document.getElementById('faceBg').addEventListener('click', function(){ faceSheet(false); });

/* =====================================================================
   🔴🔴 2026-09-13 — 사진 넣기 · 교체 · 삭제를 한 창에

   무엇을 바꾸는지 안 보이면 손님이 손을 못 댑니다.
   "이게 맞나?" 싶은 순간 그만두게 됩니다.
   그래서 **지금 쓰는 사진을 경고문 위에 먼저 보여줍니다.**

   창은 하나인데 사진이 있느냐 없느냐로 단추가 달라집니다.

     사진 없음   [ 그만두기 ]  [ 알고 있습니다 ]
     사진 있음   [ 취소하기 ]  [ 삭제하기 ]  [ 교체하기 ]

   ⚠ 사진이 있어도 경고문은 그대로 보여줍니다. 교체도 결국 새로 올리는
     일이고, 그때마다 무게를 다시 느끼시는 편이 낫습니다.
   ===================================================================== */
async function startFace(personaId){
  facePersona = aliases.filter(function(a){ return a.id === personaId; })[0];
  if (!facePersona) return;
  facePicked = null;

  const has = !!facePersona.avatar_url;

  document.getElementById('faceBox').innerHTML =
    (has ? '<div class="fnow">' +
             '<div class="fp"><img id="faceNowImg" alt=""></div>' +
             '<p class="fn">' + AL.esc(AL.t('faceNow')) + '</p>' +
           '</div>' : '') +
    '<div class="fh">' + AL.esc(AL.t('faceWarnTtl')) + '</div>' +
    '<p class="fw">' + AL.esc(AL.t('faceWarn1')) + '</p>' +
    '<ul class="fl">' +
      '<li>' + AL.esc(AL.t('faceWarn2')) + '</li>' +
      '<li>' + AL.esc(AL.t('faceWarn3')) + '</li>' +
      '<li>' + AL.esc(AL.t('faceWarn4')) + '</li>' +
    '</ul>' +
    '<p class="fa">' + AL.esc(AL.t('faceWarnAlt')) + '</p>' +
    (has
      ? '<div class="fb">' +
          '<button id="faceNo">' + AL.esc(AL.t('faceCancel')) + '</button>' +
          '<button id="faceDel" class="bad">' + AL.esc(AL.t('faceDelBtn')) + '</button>' +
          '<button id="faceYes" class="go">' + AL.esc(AL.t('faceSwap')) + '</button>' +
        '</div>'
      : '<div class="fb">' +
          '<button id="faceNo">' + AL.esc(AL.t('faceWarnNo')) + '</button>' +
          '<button id="faceYes" class="go">' + AL.esc(AL.t('faceWarnYes')) + '</button>' +
        '</div>');
  faceSheet(true);

  document.getElementById('faceNo').addEventListener('click', function(){ faceSheet(false); });
  document.getElementById('faceYes').addEventListener('click', function(){
    document.getElementById('facePick').click();
  });
  if (has) {
    document.getElementById('faceDel').addEventListener('click', function(){
      faceSheet(false);
      dropFace(facePersona.id);
    });
    /* 서랍이 비공개라 주소를 받아와야 합니다. 창은 먼저 띄우고 사진은
       오는 대로 채웁니다. 기다렸다 띄우면 느려 보입니다. */
    AL.faceUrl(facePersona.avatar_url).then(function(url){
      const img = document.getElementById('faceNowImg');
      if (img && url) img.src = url;
    });
  }
}

/* ② 고르고 나면 ③ 확인 */
document.getElementById('facePick').addEventListener('change', async function(){
  const f = this.files && this.files[0];
  this.value = '';
  if (!f || !facePersona) return;
  facePicked = f;

  const n = await AL.faceAudience(facePersona.id);
  const url = URL.createObjectURL(f);

  document.getElementById('faceBox').innerHTML =
    '<div class="fh">' + AL.esc(AL.t('faceConfirm', { face: facePersona.display_name })) + '</div>' +
    '<div class="fp"><img src="' + url + '" alt=""></div>' +
    '<p class="fw">' + AL.esc(n > 0 ? AL.t('faceAudience', { n: n }) : AL.t('faceAudience0')) + '</p>' +
    '<div class="fb">' +
      '<button id="faceAgain">' + AL.esc(AL.t('faceRetry')) + '</button>' +
      '<button id="faceGo" class="go">' + AL.esc(AL.t('faceGo')) + '</button>' +
    '</div>';
  faceSheet(true);

  document.getElementById('faceAgain').addEventListener('click', function(){
    document.getElementById('facePick').click();
  });
  document.getElementById('faceGo').addEventListener('click', async function(){
    this.disabled = true;
    try {
      /* 🔴 2026-09-13 — 옛 경로를 함께 넘겨 지우게 합니다.
         안 넘기면 서랍에 옛 사진이 계속 쌓입니다. */
      await AL.uploadFace(facePersona.id, facePicked, facePersona.avatar_url);
      faceSheet(false);
      showOk(AL.t('faceDone') + ' ' + AL.t('faceNote'));
      await reload();
    } catch (e) {
      console.error(e);
      faceSheet(false);
      showErr(AL.t('errGeneric', { msg: e.message || String(e) }));
    }
  });
});

async function dropFace(personaId){
  const a = aliases.filter(function(x){ return x.id === personaId; })[0];
  if (!a) return;
  /* 🔴 2026-09-13 — 지우면 어떻게 되는지까지 말해줍니다.
     "지울까요?" 만으로는 사진이 사라지는 건지 별칭이 사라지는 건지
     헷갈립니다. */
  if (!confirm(AL.t('faceDelAsk', { face: a.display_name }))) return;
  try {
    await AL.removeFace(personaId, a.avatar_url);
    showOk(AL.t('faceGone'));
    await reload();
  } catch (e) {
    console.error(e);
    showErr(AL.t('errGeneric', { msg: e.message || String(e) }));
  }
}

async function reload(){
  try {
    aliases = await AL.loadAliases();
    paintList();
  } catch (e) {
    console.error(e);
    showErr(AL.t('errGeneric', { msg: e.message || String(e) }));
  }
}

async function makeAlias(){
  clearMsg();
  /* 🔴 2026-09-14 — 별칭 추가는 이용권이 필요합니다.
     이미 만든 별칭은 그대로 씁니다. 받기도 그대로 됩니다. */
  if (!await AL.requirePlan()) return;
  const name = document.getElementById('name').value;
  const btn = document.getElementById('make');
  btn.disabled = true;
  try {
    // ⚠ 만드는 규칙(길이·중복·첫 별칭은 기본)은 alias_common.js 한 곳에만 둡니다.
    //   고르개에서 만드는 것과 여기서 만드는 것이 갈리면 안 됩니다.
    await AL.createAlias(name, aliases);
    document.getElementById('name').value = '';
    showOk(AL.t('aliasCreated'));
    await reload();
  } catch (e) {
    console.error(e);
    showErr(AL.t('errGeneric', { msg: e.message || String(e) }));
  } finally {
    btn.disabled = false;
  }
}

async function makeDefault(id){
  clearMsg();
  try {
    // ⚠ "계정당 기본은 하나"라는 부분 유니크 인덱스가 걸려 있습니다.
    //   먼저 다 내리고 나서 하나를 올려야 합니다. 순서를 바꾸면 충돌합니다.
    const down = await AL.sb.from('personas')
      .update({ is_default: false }).eq('account_id', me.id).eq('is_default', true);
    if (down.error) throw down.error;
    const up = await AL.sb.from('personas').update({ is_default: true }).eq('id', id);
    if (up.error) throw up.error;
    await reload();
  } catch (e) {
    console.error(e);
    showErr(AL.t('errGeneric', { msg: e.message || String(e) }));
  }
}

document.getElementById('make').addEventListener('click', makeAlias);
document.getElementById('name').addEventListener('keydown', function(e){
  if (e.key === 'Enter') makeAlias();
});
/* ── 데이터 ─────────────────────────────────────────────────── */
const WARN_STEPS = [0, 200, 500, 1000, 2000];

async function paintUsage(){
  const box = document.getElementById('usage');
  const u = await AL.dataUsage(30);
  if (!u || !u.total_bytes) {
    box.innerHTML = '<div class="drow"><span class="dlab">' +
      AL.esc(AL.t('dtUsed30')) + '</span><span class="dval">' +
      AL.esc(AL.t('dtNone')) + '</span></div>';
    return;
  }
  const secs = Number(u.call_seconds || 0);
  const dur = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
  box.innerHTML =
    '<div class="drow"><span class="dlab">' + AL.esc(AL.t('dtUsed30')) + '</span>' +
      '<span class="dval">' + AL.esc(AL.t('dtTotal', { size: AL.fmtBytes(u.total_bytes) })) + '</span></div>' +
    '<div class="drow"><span class="dlab">' +
      AL.esc(AL.t('dtCalls', { n: u.n_calls, dur: dur })) + '</span>' +
      '<span class="dval">' + AL.esc(AL.fmtBytes(u.call_bytes)) + '</span></div>' +
    '<div class="drow"><span class="dlab">' +
      AL.esc(AL.t('dtMedia', { n: u.n_media })) + '</span>' +
      '<span class="dval">' + AL.esc(AL.fmtBytes(u.media_bytes)) + '</span></div>';
}

function paintData(){
  const p = AL.dataPrefs;
  [['pVideoWifi','video_wifi_only'], ['pLowRate','low_bitrate'],
   ['pMediaWifi','media_wifi_only']].forEach(function(o){
    const b = document.getElementById(o[0]);
    b.textContent = AL.t(p[o[1]] ? 'prefOn' : 'prefOff');
    b.classList.toggle('on', !!p[o[1]]);
  });
  const w = document.getElementById('pWarn');
  w.textContent = p.warn_mb ? (p.warn_mb + ' MB') : AL.t('dtWarnOff');
  w.classList.toggle('on', !!p.warn_mb);
}

[['pVideoWifi','video_wifi_only'], ['pLowRate','low_bitrate'],
 ['pMediaWifi','media_wifi_only']].forEach(function(o){
  document.getElementById(o[0]).addEventListener('click', async function(){
    try { await AL.saveDataPref(o[1], !AL.dataPrefs[o[1]]); paintData(); }
    catch (e) { console.error(e); showErr(AL.t('errGeneric', { msg: e.message || String(e) })); }
  });
});

document.getElementById('pWarn').addEventListener('click', async function(){
  const i = WARN_STEPS.indexOf(AL.dataPrefs.warn_mb);
  const next = WARN_STEPS[(i + 1) % WARN_STEPS.length];
  try { await AL.saveDataPref('warn_mb', next); paintData(); }
  catch (e) { console.error(e); showErr(AL.t('errGeneric', { msg: e.message || String(e) })); }
});

/* ── 언어 고르기 ─────────────────────────────────────────────── */
const LANGS = [['auto','lgAuto'], ['kr','lgKr'], ['en','lgEn']];

function paintLang(){
  const box = document.getElementById('swLang');
  box.innerHTML = LANGS.map(function(o){
    return '<button class="sw' + (AL.langPref === o[0] ? ' on' : '') +
           '" data-lang="' + AL.esc(o[0]) + '">' + AL.esc(AL.t(o[1])) + '</button>';
  }).join('');
  box.querySelectorAll('[data-lang]').forEach(function(b){
    b.addEventListener('click', async function(){
      try {
        await AL.setLang(b.getAttribute('data-lang'));
        // 화면 전체가 바뀌었으니 여기서 만든 것들도 다시 그립니다.
        paintLang(); paintTheme(); paintPrefs(); paintList();
        showOk(AL.t('thSaved'));
      } catch (e) {
        console.error(e);
        showErr(AL.t('errGeneric', { msg: e.message || String(e) }));
      }
    });
  });
}

/* ── 모양 고르기 ───────────────────────────────────────────────
   고르는 즉시 화면이 바뀝니다. 미리보기를 따로 안 봐도 됩니다. */
const TH = {
  mode:   [['dark','thDark'], ['light','thLight'], ['auto','thAuto']],
  /* 🔴 2026-09-19 — 또렷하게 읽히는 셋을 맨 앞에 */
  color:  [['crisp','thCrisp'], ['cream','thCream'], ['slate','thSlate'],
           ['midnight','thMidnight'], ['paper','thPaper'], ['forest','thForest'],
           ['dusk','thDusk'], ['ink','thInk'],
           ['pitch','thPitch'], ['abyss','thAbyss'],
           ['midnite','thMidnite'], ['charcoal','thCharcoal'],
           ['bluegrey','thBluegrey'], ['sage','thSage'],
           ['sand','thSand'], ['clay','thClay'],
           ['bluegrey2','thBluegrey2'], ['sage2','thSage2']],
  bubble: [['round','thRound'], ['square','thSquare'], ['tail','thTail'], ['outline','thOutline']],
  scene:  [['none','thNone'], ['snow','thSnow'], ['rain','thRain'],
           ['petals','thPetals'], ['stars','thStars']],
  /* 🔴 2026-09-19 — 글씨 크기와 굵기 */
  fs:     [['md','fsMd'], ['lg','fsLg'], ['xl','fsXl']],
  fw:     [['normal','fwNormal'], ['bold','fwBold']],
  ff:     [['system','ffSystem'], ['gothic','ffGothic'],
           ['myeongjo','ffMyeongjo'], ['dotum','ffDotum'], ['hand','ffHand']],
};
let theme = AL.readThemeCache();

function paintTheme(){
  Object.keys(TH).forEach(function(kind){
    const box = document.getElementById('sw' + kind.charAt(0).toUpperCase() + kind.slice(1));
    /* ⚠ 자리가 없으면 넘어갑니다. 없는 것에 손대면 그 자리에서 멈추고
       그 아래 전부가 안 돕니다(함정 111). */
    if (!box) return;
    box.innerHTML = TH[kind].map(function(o){
      const on = theme[kind] === o[0];
      const dot = kind === 'color' ? '<span class="dot"></span>' : '';
      return '<button class="sw sw-' + AL.esc(o[0]) + (on ? ' on' : '') +
             '" data-k="' + kind + '" data-v="' + AL.esc(o[0]) + '">' +
             dot + AL.esc(AL.t(o[1])) + '</button>';
    }).join('');
    box.querySelectorAll('[data-k]').forEach(function(b){
      b.addEventListener('click', async function(){
        theme[b.getAttribute('data-k')] = b.getAttribute('data-v');
        paintTheme();
        try { await AL.saveTheme(theme); showOk(AL.t('thSaved')); }
        catch (e) { console.error(e); showErr(AL.t('errGeneric', { msg: e.message || String(e) })); }
      });
    });
  });
}

/* ── 알림 설정 ─────────────────────────────────────────────── */
function paintPrefs(){
  const p = AL.prefs();
  const s1 = document.getElementById('pSound');
  const s2 = document.getElementById('pVib');
  s1.textContent = AL.t(p.sound ? 'prefOn' : 'prefOff');
  s1.classList.toggle('on', p.sound);
  s2.textContent = AL.t(p.vibrate ? 'prefOn' : 'prefOff');
  s2.classList.toggle('on', p.vibrate);
}
document.getElementById('pSound').addEventListener('click', function(){
  const p = AL.setPref('sound', !AL.prefs().sound);
  paintPrefs();
  if (p.sound) AL.ding();          // 켜면 바로 들려줍니다
});
document.getElementById('pVib').addEventListener('click', function(){
  const p = AL.setPref('vibrate', !AL.prefs().vibrate);
  paintPrefs();
  if (p.vibrate) AL.buzz();
});

document.getElementById('out').addEventListener('click', function(){
  // ⚠ 한 번 물어봅니다. 실수로 누르면 다시 로그인해야 합니다.
  if (confirm(AL.t('outAsk'))) AL.signOut();
});

/* 🔴🔴 2026-09-17 — 연락처에 최근 대화 보이기

   ⚠ 기본은 꺼져 있습니다. 이 앱은 번호를 감추려고 쓰는 앱이라,
     목록에 대화가 드러나면 버스나 사무실에서 옆 사람이 읽습니다.
     켜고 끄는 것을 손님이 정하게 합니다.

   ⚠ 암호화를 켠 관계는 켜도 내용이 안 보입니다. 서버가 못 읽으니까요.
     그런 줄에는 "🔒 잠긴 대화" 라고 나옵니다.

   ⚠ 관계마다 따로 가릴 수도 있습니다. 연락처의 ⋯ 메뉴에 있습니다. */
async function paintPrevBtn(){
  const on = await AL.previewOn();
  const b = document.getElementById('pPrev');
  if (!b) return;
  b.textContent = AL.t(on ? 'pvOn' : 'pvOff');
  b.classList.toggle('on', on);
}

document.getElementById('pPrev').addEventListener('click', async function(){
  const now = await AL.previewOn();
  const ok = await AL.setPreview(!now);
  if (!ok) { showErr(AL.t('errGeneric', { msg: '설정을 저장하지 못했습니다' })); return; }
  await paintPrevBtn();
  showOk(AL.t('thSaved'));
});

(async function(){
  AL.paintText();
  paintPrevBtn();
  me = await AL.requireLogin();
  if (!me) return;
  document.getElementById('uid').textContent = me.id.slice(0, 8);
  paintLang();
  paintPrefs();
  await AL.loadDataPrefs();
  paintData();
  paintUsage();
  theme = await AL.loadTheme();
  paintLang();          // 서버 값이 달랐으면 여기서 맞춰집니다
  paintTheme();
  await reload();
  AL.showPlanBar();   // 🔴 2026-09-14
  AL.showPushBar();   // 🔴 2026-09-15 — 전화를 못 받는 상태면 알립니다
  AL.showExpiringBar();   // 🔴 2026-09-19 — 곧 지워질 녹음
  AL.startAlerts();      // 어느 화면에 있든 새 메시지를 알려줍니다
})();
</script>
