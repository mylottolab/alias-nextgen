<script>
/* ⚠ alias_common.js 를 못 읽으면 화면이 텅 빕니다. 글씨를 채우는 것이
   그 파일이기 때문입니다. 빈 화면만 보면 원인을 알 수가 없어서,
   여기서 잡아 사람 말로 알려줍니다.
   가장 흔한 원인은 anon 열쇠 줄이 두 줄로 나뉜 것입니다. */
document.addEventListener("DOMContentLoaded", function(){
  if (typeof AL === "undefined" || typeof AL.t !== "function") {
    document.body.innerHTML =
      '<div style="padding:26px;font-family:system-ui,sans-serif;line-height:1.8;' +
      'color:#DDE5F0;background:#0E1621;min-height:100vh">' +
      '<b style="font-size:17px">alias_common.js 를 못 읽었습니다.</b><br><br>' +
      '가장 흔한 원인은 anon 열쇠 줄이 두 줄로 나뉜 것입니다.<br>' +
      'alias_common.js 20번 줄이 한 줄인지 확인하세요.<br><br>' +
      '<span style="color:#7E8FA6">F12 → Console 에 진짜 원인이 찍힙니다.</span></div>';
    return;
  }
  AL.bootTheme();
});
</script>
</head>
<body class="tabbed" data-t-title="ttMe">
<div class="wrap">

  <div class="tophead">
    <h1 class="h2" data-t="meTitle"></h1>
  </div>

  <div class="sect" data-t="meAliases"></div>
  <p class="lede" data-t="aliasIntro"></p>
  <ul class="list" id="list"></ul>

  <div class="sect" data-t="aliasNew"></div>
  <div class="field">
    <label for="name" data-t="aliasNameLbl"></label>
    <input id="name" type="text" maxlength="20" autocomplete="off">
    <p class="hint" data-t="aliasNameHint"></p>
  </div>
  <button class="btn" id="make" data-t="aliasNew"></button>

  <div id="err" class="err"></div>
  <div id="ok" class="ok"></div>

  <div class="dblock">
    <div class="drow">
      <span class="dlab" data-t="kpTitle"></span>
      <span class="dval"><a class="rowlink" href="alias_keep.html" data-t="mdOpenFile"></a></span>
    </div>
  </div>

  <div class="sect" data-t="lgTitle"></div>
  <div class="swatches" id="swLang"></div>
  <p class="hint" data-t="lgNote"></p>

  <div class="sect" data-t="thTitle"></div>

  <div class="field">
    <label data-t="thMode"></label>
    <div class="swatches" id="swMode"></div>
  </div>
  <div class="field">
    <label data-t="thColor"></label>
    <div class="swatches" id="swColor"></div>
  </div>
  <div class="field">
    <label data-t="thBubble"></label>

  </div>
  <div class="field">
    <label data-t="thScene"></label>
    <div class="swatches" id="swScene"></div>

  <div class="preview">
    <div class="msg in"><div class="bub" data-t="thSample1"></div></div>

  </div>

  <!-- 🔴 데이터를 얼마나 쓰는지 보여줍니다. 모르는 게 불안한 것입니다. -->
  <div class="sect" data-t="dtTitle"></div>
  <p class="lede" data-t="dtNote"></p>

  <div class="dblock" id="usage"></div>

  <div class="sect" data-t="dtSave"></div>
  <div class="dblock">
    <div class="prefrow">
      <span class="pl"><b data-t="dtVideoWifi"></b>
        <span class="ps" data-t="dtVideoWifiD"></span></span>
      <button id="pVideoWifi"></button>
    </div>
    <div class="prefrow">
      <span class="pl"><b data-t="dtLowRate"></b>
        <span class="ps" data-t="dtLowRateD"></span></span>
      <button id="pLowRate"></button>
    </div>
    <div class="prefrow">
      <span class="pl"><b data-t="dtMediaWifi"></b>
        <span class="ps" data-t="dtMediaWifiD"></span></span>
      <button id="pMediaWifi"></button>
    </div>
    <div class="prefrow">
      <span class="pl"><b data-t="dtWarn"></b>
        <span class="ps" data-t="dtWarnD"></span></span>
      <button id="pWarn"></button>
    </div>
  </div>

  <div class="sect" data-t="prefTitle"></div>
  <p class="lede" data-t="prefNote"></p>
  <div class="dblock">
    <div class="prefrow">
      <span class="pl" data-t="prefSound"></span>
      <button id="pSound"></button>

    <div class="prefrow">
      <span class="pl" data-t="prefVibrate"></span>

  <div class="sect" data-t="meAccount"></div>

  <!-- ⚠ 로그아웃은 맨 아래, 눈에 덜 띄게 둡니다.
       머리에 두면 헤매다 누르고, 다시 로그인해야 합니다. -->

<nav class="tabbar">
  <a href="alias_contacts.html" data-t="navContacts"></a>
  <a href="alias_calls.html" data-t="navCalls"></a>
  <a href="alias_me.html" class="on" data-t="navMe"></a>

<script>
/* =====================================================================
   나 — 별칭 관리 + 계정
   ⚠ 여기 있는 별칭은 전부 내가 만든 것입니다. 남이 넣을 수 없습니다.
     personas 정책이 account_id = auth.uid() 로 막고 있습니다.
   ===================================================================== */

let me = null;
let aliases = [];

function showErr(msg){
  const el = document.getElementById('err');
  el.textContent = msg; el.classList.add('show');
  document.getElementById('ok').classList.remove('show');
}
function showOk(msg){
  const el = document.getElementById('ok');
  el.textContent = msg; el.classList.add('show');
  document.getElementById('err').classList.remove('show');
}
function clearMsg(){
  document.getElementById('err').classList.remove('show');
  document.getElementById('ok').classList.remove('show');
}

function paintList(){
  const ul = document.getElementById('list');
  if (!aliases.length) {
    ul.innerHTML = '<li class="empty">' + AL.esc(AL.t('aliasEmpty')) + '</li>';
    return;
  }
  ul.innerHTML = aliases.map(function(a){
    return '<li class="row">' +
      '<div class="row-main">' +
        '<span class="row-name">' + AL.esc(a.display_name) + '</span>' +
        (a.is_default ? '<span class="badge">' + AL.esc(AL.t('aliasDefault')) + '</span>' : '') +
      '</div>' +
      '<div class="row-acts">' +
        '<a class="rowlink" href="alias_invite.html?face=' + encodeURIComponent(a.id) + '">' +
          AL.esc(AL.t('aliasUseForInvite')) + '</a>' +
        (a.is_default ? '' :
          '<button data-def="' + AL.esc(a.id) + '">' + AL.esc(AL.t('aliasMakeDef')) + '</button>') +
      '</div>' +
    '</li>';
  }).join('');

  ul.querySelectorAll('[data-def]').forEach(function(b){
    b.addEventListener('click', function(){ makeDefault(b.getAttribute('data-def')); });
  });
}

async function reload(){
  try {
    aliases = await AL.loadAliases();
    paintList();
  } catch (e) {
    console.error(e);
    showErr(AL.t('errGeneric', { msg: e.message || String(e) }));
  }
}

async function makeAlias(){
  clearMsg();
  const name = document.getElementById('name').value;
  const btn = document.getElementById('make');
  btn.disabled = true;
  try {
    // ⚠ 만드는 규칙(길이·중복·첫 별칭은 기본)은 alias_common.js 한 곳에만 둡니다.
    //   고르개에서 만드는 것과 여기서 만드는 것이 갈리면 안 됩니다.
    await AL.createAlias(name, aliases);
    document.getElementById('name').value = '';
    showOk(AL.t('aliasCreated'));
    await reload();
  } catch (e) {
    console.error(e);
    showErr(AL.t('errGeneric', { msg: e.message || String(e) }));
  } finally {
    btn.disabled = false;
  }
}

async function makeDefault(id){
  clearMsg();
  try {
    // ⚠ "계정당 기본은 하나"라는 부분 유니크 인덱스가 걸려 있습니다.
    //   먼저 다 내리고 나서 하나를 올려야 합니다. 순서를 바꾸면 충돌합니다.
    const down = await AL.sb.from('personas')
      .update({ is_default: false }).eq('account_id', me.id).eq('is_default', true);
    if (down.error) throw down.error;
    const up = await AL.sb.from('personas').update({ is_default: true }).eq('id', id);
    if (up.error) throw up.error;
    await reload();
  } catch (e) {
    console.error(e);
    showErr(AL.t('errGeneric', { msg: e.message || String(e) }));
  }
}

document.getElementById('make').addEventListener('click', makeAlias);
document.getElementById('name').addEventListener('keydown', function(e){
  if (e.key === 'Enter') makeAlias();
});
/* ── 데이터 ─────────────────────────────────────────────────── */
const WARN_STEPS = [0, 200, 500, 1000, 2000];

async function paintUsage(){
  const box = document.getElementById('usage');
  const u = await AL.dataUsage(30);
  if (!u || !u.total_bytes) {
    box.innerHTML = '<div class="drow"><span class="dlab">' +
      AL.esc(AL.t('dtUsed30')) + '</span><span class="dval">' +
      AL.esc(AL.t('dtNone')) + '</span></div>';
    return;
  }
  const secs = Number(u.call_seconds || 0);
  const dur = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
  box.innerHTML =
    '<div class="drow"><span class="dlab">' + AL.esc(AL.t('dtUsed30')) + '</span>' +
      '<span class="dval">' + AL.esc(AL.t('dtTotal', { size: AL.fmtBytes(u.total_bytes) })) + '</span></div>' +
    '<div class="drow"><span class="dlab">' +
      AL.esc(AL.t('dtCalls', { n: u.n_calls, dur: dur })) + '</span>' +
      '<span class="dval">' + AL.esc(AL.fmtBytes(u.call_bytes)) + '</span></div>' +
    '<div class="drow"><span class="dlab">' +
      AL.esc(AL.t('dtMedia', { n: u.n_media })) + '</span>' +
      '<span class="dval">' + AL.esc(AL.fmtBytes(u.media_bytes)) + '</span></div>';
}

function paintData(){
  const p = AL.dataPrefs;
  [['pVideoWifi','video_wifi_only'], ['pLowRate','low_bitrate'],
   ['pMediaWifi','media_wifi_only']].forEach(function(o){
    const b = document.getElementById(o[0]);
    b.textContent = AL.t(p[o[1]] ? 'prefOn' : 'prefOff');
    b.classList.toggle('on', !!p[o[1]]);
  });
  const w = document.getElementById('pWarn');
  w.textContent = p.warn_mb ? (p.warn_mb + ' MB') : AL.t('dtWarnOff');
  w.classList.toggle('on', !!p.warn_mb);
}

[['pVideoWifi','video_wifi_only'], ['pLowRate','low_bitrate'],
 ['pMediaWifi','media_wifi_only']].forEach(function(o){
  document.getElementById(o[0]).addEventListener('click', async function(){
    try { await AL.saveDataPref(o[1], !AL.dataPrefs[o[1]]); paintData(); }
    catch (e) { console.error(e); showErr(AL.t('errGeneric', { msg: e.message || String(e) })); }
  });
});

document.getElementById('pWarn').addEventListener('click', async function(){
  const i = WARN_STEPS.indexOf(AL.dataPrefs.warn_mb);
  const next = WARN_STEPS[(i + 1) % WARN_STEPS.length];
  try { await AL.saveDataPref('warn_mb', next); paintData(); }
  catch (e) { console.error(e); showErr(AL.t('errGeneric', { msg: e.message || String(e) })); }
});

/* ── 언어 고르기 ─────────────────────────────────────────────── */
const LANGS = [['auto','lgAuto'], ['kr','lgKr'], ['en','lgEn']];

function paintLang(){
  const box = document.getElementById('swLang');
  box.innerHTML = LANGS.map(function(o){
    return '<button class="sw' + (AL.langPref === o[0] ? ' on' : '') +
           '" data-lang="' + AL.esc(o[0]) + '">' + AL.esc(AL.t(o[1])) + '</button>';
  }).join('');
  box.querySelectorAll('[data-lang]').forEach(function(b){
    b.addEventListener('click', async function(){
      try {
        await AL.setLang(b.getAttribute('data-lang'));
        // 화면 전체가 바뀌었으니 여기서 만든 것들도 다시 그립니다.
        paintLang(); paintTheme(); paintPrefs(); paintList();
        showOk(AL.t('thSaved'));
      } catch (e) {
        console.error(e);
        showErr(AL.t('errGeneric', { msg: e.message || String(e) }));
      }
    });
  });
}

/* ── 모양 고르기 ───────────────────────────────────────────────
   고르는 즉시 화면이 바뀝니다. 미리보기를 따로 안 봐도 됩니다. */
const TH = {
  mode:   [['dark','thDark'], ['light','thLight'], ['auto','thAuto']],
  color:  [['midnight','thMidnight'], ['paper','thPaper'], ['forest','thForest'],
           ['dusk','thDusk'], ['ink','thInk'],
           ['pitch','thPitch'], ['abyss','thAbyss'],
           ['midnite','thMidnite'], ['charcoal','thCharcoal'],
           ['bluegrey','thBluegrey'], ['sage','thSage'],
           ['sand','thSand'], ['clay','thClay'],
           ['bluegrey2','thBluegrey2'], ['sage2','thSage2']],
  bubble: [['round','thRound'], ['square','thSquare'], ['tail','thTail'], ['outline','thOutline']],
  scene:  [['none','thNone'], ['snow','thSnow'], ['rain','thRain'],
           ['petals','thPetals'], ['stars','thStars']],
};
let theme = AL.readThemeCache();

function paintTheme(){
  Object.keys(TH).forEach(function(kind){
    const box = document.getElementById('sw' + kind.charAt(0).toUpperCase() + kind.slice(1));
    box.innerHTML = TH[kind].map(function(o){
      const on = theme[kind] === o[0];
      const dot = kind === 'color' ? '<span class="dot"></span>' : '';
      return '<button class="sw sw-' + AL.esc(o[0]) + (on ? ' on' : '') +
             '" data-k="' + kind + '" data-v="' + AL.esc(o[0]) + '">' +
             dot + AL.esc(AL.t(o[1])) + '</button>';
    }).join('');
    box.querySelectorAll('[data-k]').forEach(function(b){
      b.addEventListener('click', async function(){
        theme[b.getAttribute('data-k')] = b.getAttribute('data-v');
        paintTheme();
        try { await AL.saveTheme(theme); showOk(AL.t('thSaved')); }
        catch (e) { console.error(e); showErr(AL.t('errGeneric', { msg: e.message || String(e) })); }
      });
    });
  });
}

/* ── 알림 설정 ─────────────────────────────────────────────── */
function paintPrefs(){
  const p = AL.prefs();
  const s1 = document.getElementById('pSound');
  const s2 = document.getElementById('pVib');
  s1.textContent = AL.t(p.sound ? 'prefOn' : 'prefOff');
  s1.classList.toggle('on', p.sound);
  s2.textContent = AL.t(p.vibrate ? 'prefOn' : 'prefOff');
  s2.classList.toggle('on', p.vibrate);
}
document.getElementById('pSound').addEventListener('click', function(){
  const p = AL.setPref('sound', !AL.prefs().sound);
  paintPrefs();
  if (p.sound) AL.ding();          // 켜면 바로 들려줍니다
});
document.getElementById('pVib').addEventListener('click', function(){
  const p = AL.setPref('vibrate', !AL.prefs().vibrate);
  paintPrefs();
  if (p.vibrate) AL.buzz();
});

document.getElementById('out').addEventListener('click', function(){
  // ⚠ 한 번 물어봅니다. 실수로 누르면 다시 로그인해야 합니다.
  if (confirm(AL.t('outAsk'))) AL.signOut();
});

(async function(){
  AL.paintText();
  me = await AL.requireLogin();
  if (!me) return;
  document.getElementById('uid').textContent = me.id.slice(0, 8);
  paintLang();
  paintPrefs();
  await AL.loadDataPrefs();
  paintData();
  paintUsage();
  theme = await AL.loadTheme();
  paintLang();          // 서버 값이 달랐으면 여기서 맞춰집니다
  paintTheme();
  await reload();
  AL.startAlerts();      // 어느 화면에 있든 새 메시지를 알려줍니다
})();
</script>
</body>
</html>
