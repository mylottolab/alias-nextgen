<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alias</title>
<link rel="stylesheet" href="alias_common.css?v=20260912i">
<link rel="stylesheet" href="alias_theme.css?v=20260912i">
<script src="alias_config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="alias_common.js?v=20260912i"></script>
<script>
/* ⚠ alias_common.js 를 못 읽으면 화면이 텅 빕니다. 글씨를 채우는 것이
   그 파일이기 때문입니다. 빈 화면만 보면 원인을 알 수가 없어서,
   여기서 잡아 사람 말로 알려줍니다.
   가장 흔한 원인은 anon 열쇠 줄이 두 줄로 나뉜 것입니다. */
document.addEventListener("DOMContentLoaded", function(){
  if (typeof AL === "undefined" || typeof AL.t !== "function") {
    document.body.innerHTML =
      '<div style="padding:26px;font-family:system-ui,sans-serif;line-height:1.8;' +
      'color:#DDE5F0;background:#0E1621;min-height:100vh">' +
      '<b style="font-size:17px">alias_common.js 를 못 읽었습니다.</b><br><br>' +
      '가장 흔한 원인은 anon 열쇠 줄이 두 줄로 나뉜 것입니다.<br>' +
      'alias_common.js 20번 줄이 한 줄인지 확인하세요.<br><br>' +
      '<span style="color:#7E8FA6">F12 → Console 에 진짜 원인이 찍힙니다.</span></div>';
    return;
  }
  AL.bootTheme();
});
</script>
</head>
<body class="center" data-t-title="ttAuth">
<div class="wrap">

  <!-- ── 로그인 / 가입 ────────────────────────────────── -->
  <div id="stepAuth" class="step on">
    <div id="invited" style="display:none">
      <h1 class="h2" data-t="invLanding"></h1>
      <p class="lede" data-t="invWhat"></p>
      <div class="ok show" data-t="invKeep"></div>
    </div>

    <div id="plain">
      <h1 class="mark" data-t="appName"></h1>
      <p class="lede" data-t="tagline"></p>
    </div>

    <div class="field">
      <label for="nick" data-t="nickLabel"></label>
      <!-- ⚠ autocomplete="username" 을 쓰면 브라우저가 이메일 주소를 밀어넣습니다.
           여기 닉네임은 이메일이 아니라서 손님이 지우고 다시 써야 했습니다. -->
      <input id="nick" type="text" name="alias-nick" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false">
      <p class="hint" data-t="nickHint"></p>
    </div>

    <div class="field">
      <label for="pw" data-t="pwLabel"></label>
      <input id="pw" type="password" autocomplete="current-password">
      <p class="hint" data-t="pwHint"></p>
    </div>

    <button id="go" class="btn" data-t="goBtn"></button>
    <div id="authErr" class="err"></div>
    <p class="note" data-t="firstTime"></p>
  </div>

  <!-- ── 복구 코드 ────────────────────────────────────── -->
  <div id="stepCode" class="step">
    <h2 class="h2" data-t="madeTitle"></h2>
    <p class="lede" data-t="madeSub"></p>

    <div class="paper">
      <div class="cap" data-t="codeCap"></div>
      <div class="code" id="codeOut"></div>
      <div class="warns">
        <p data-t="warn1"></p>
        <p data-t="warn2"></p>
        <p data-t="warn3"></p>
      </div>
    </div>

    <div class="copybar">
      <button id="copyBtn" data-t="copy"></button>
    </div>

    <label class="ack">
      <input type="checkbox" id="ack">
      <span data-t="ackText"></span>
    </label>

    <button id="cont" class="btn" disabled data-t="contBtn"></button>
  </div>

</div>

<script>
/* =====================================================================
   Alias Next-Gen — 가입 · 로그인 · 복구 코드
   접속·문구·복구코드 만들기는 alias_common.js 에 있습니다.
   ===================================================================== */

let pendingCode = null;

/* 🔴 초대 QR 을 앱 없는 사람이 찍으면 여기로 옵니다.
   그때 초대 코드를 잃어버리면 안 됩니다. 가입 뒤 그 자리로 돌려보냅니다.
     alias_auth.html?next=alias_join.html%3Fc%3D... */
const NEXT = new URLSearchParams(location.search).get('next');

function goNext(fallback){
  // ⚠ 우리 화면으로만 보냅니다. 밖에서 준 주소로 튕기면 안 됩니다.
  if (NEXT && /^alias_[a-z_]+\.html(\?|$)/.test(NEXT)) { location.href = NEXT; return; }
  location.href = fallback;
}

function show(id){
  document.querySelectorAll('.step').forEach(function(el){ el.classList.remove('on'); });
  document.getElementById(id).classList.add('on');
}
function showErr(msg){
  const el = document.getElementById('authErr');
  el.textContent = msg; el.classList.add('show');
}
function clearErr(){ document.getElementById('authErr').classList.remove('show'); }

async function start(){
  clearErr();
  // 열쇠가 안 들어갔으면 여기서 잡습니다. 안 그러면 fetch 가 헤더에서 터지면서
  // "non ISO-8859-1 code point" 라는 알아보기 힘든 말이 나옵니다.
  if (AL.keyProblem) { showErr(AL.keyProblem); return; }

  const nickCheck = AL.checkNick(document.getElementById('nick').value);
  if (!nickCheck.ok) { showErr(nickCheck.msg); return; }

  const pw = document.getElementById('pw').value;
  if (pw.length < 8) { showErr(AL.t('errPwShort')); return; }

  const btn = document.getElementById('go');
  btn.disabled = true;

  try {
    const email = AL.nicknameToEmail(nickCheck.nick);
    const signUpRes = await AL.sb.auth.signUp({ email: email, password: pw });

    const msg = String((signUpRes.error && signUpRes.error.message) || '').toLowerCase();
    const taken = msg.includes('already registered') || msg.includes('already exists') || msg.includes('user already');

    if (signUpRes.error && !taken) throw signUpRes.error;

    if (taken) {
      const loginRes = await AL.sb.auth.signInWithPassword({ email: email, password: pw });
      if (loginRes.error) { showErr(AL.t('errWrongPw')); btn.disabled = false; return; }
      goNext('alias_contacts.html');
      return;
    }

    const sess = await AL.sb.auth.getSession();
    if (!sess.data.session) { showErr(AL.t('errNoSession')); btn.disabled = false; return; }

    // 복구 코드는 해시만 저장합니다. 코드 자체는 서버에 안 남습니다.
    pendingCode = AL.makeRecoveryCode();
    const codeHash = await AL.hashRecoveryCode(pendingCode);
    const ins = await AL.sb.from('recovery_codes').insert({
      account_id: sess.data.session.user.id,
      code_hash: codeHash,
    });
    if (ins.error) {
      // 복구 코드 없는 계정을 만들면 나중에 손쓸 방법이 없습니다. 여기서 멈춥니다.
      console.error('[recovery] 저장 실패', ins.error);
      showErr(AL.t('errSaveCode') + '\n(' + ins.error.message + ')');
      btn.disabled = false;
      return;
    }

    document.getElementById('codeOut').textContent = pendingCode;
    show('stepCode');

  } catch (e) {
    console.error(e);
    showErr(AL.t('errGeneric', { msg: (e && e.message) || String(e) }));
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('go').addEventListener('click', start);
document.getElementById('pw').addEventListener('keydown', function(e){
  if (e.key === 'Enter') start();
});

document.getElementById('copyBtn').addEventListener('click', function(){
  AL.copyText(pendingCode || '', this);
});

document.getElementById('ack').addEventListener('change', function(){
  document.getElementById('cont').disabled = !this.checked;
});

document.getElementById('cont').addEventListener('click', function(){
  pendingCode = null;                                   // 정말로 사라집니다
  document.getElementById('codeOut').textContent = '';
  goNext('alias_me.html');                        // 첫 별칭을 만들러 갑니다
});

/* ── 시작 ─────────────────────────────────────────────── */
AL.paintText();

// 초대를 받고 처음 온 사람이면 이 앱이 무엇인지부터 알려줍니다.
// ⚠ 모르는 앱에서 갑자기 "닉네임과 비밀번호" 를 만나면 아무도 안 씁니다.
if (NEXT && NEXT.indexOf('alias_join') === 0) {
  document.getElementById('invited').style.display = '';
  document.getElementById('plain').style.display = 'none';
}
if (AL.keyProblem) {
  showErr(AL.keyProblem);
} else {
  AL.sb.auth.getSession().then(function(res){
    if (res.data.session) goNext('alias_contacts.html');
  });
}
</script>
</body>
</html>
