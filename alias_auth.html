<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alias</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#0E1621;
  --raise:#182231;
  --line:#27344A;
  --text:#DDE5F0;
  --dim:#7E8FA6;
  --steel:#5B8FC7;
  --paper:#F2E9D6;
  --paper-ink:#2A2418;
  --warn:#D98E5A;
  --bad:#D96A6A;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--ink);}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
  display:flex; align-items:center; justify-content:center;
  padding:28px 20px;
}
.wrap{width:100%;max-width:400px;}

/* ── 표지 ───────────────────────────────────────────── */
.mark{font-size:31px;font-weight:600;letter-spacing:-0.02em;margin:0 0 6px;}
.tag{font-size:14px;color:var(--dim);margin:0 0 40px;line-height:1.6;white-space:pre-line;}

/* ── 입력 ───────────────────────────────────────────── */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:7px;}
.field input{
  width:100%;padding:14px 15px;font-size:16px;
  background:var(--raise);color:var(--text);
  border:1px solid var(--line);border-radius:10px;
  font-family:inherit;
}
.field input:focus{outline:2px solid var(--steel);outline-offset:1px;border-color:transparent;}
.field input::placeholder{color:#4E5D73;}
.hint{font-size:12px;color:var(--dim);margin-top:7px;line-height:1.55;white-space:pre-line;}

.btn{
  width:100%;padding:15px;margin-top:10px;
  font-size:15.5px;font-weight:600;font-family:inherit;
  background:var(--steel);color:#08101B;
  border:none;border-radius:10px;cursor:pointer;
}
.btn:disabled{opacity:.5;cursor:default;}
.btn:focus-visible{outline:2px solid var(--paper);outline-offset:2px;}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);}

.note{font-size:12.5px;color:var(--dim);margin-top:18px;line-height:1.65;text-align:center;}
.err{
  display:none;margin-top:14px;padding:12px 14px;
  background:rgba(217,106,106,.1);border:1px solid rgba(217,106,106,.35);
  border-radius:9px;font-size:13px;color:#EFAAAA;line-height:1.55;white-space:pre-line;
}
.err.show{display:block;}

/* ── 복구 코드: 이 화면에서 유일하게 밝은 것 ─────────── */
.done-title{font-size:21px;font-weight:600;margin:0 0 8px;}
.done-sub{font-size:13.5px;color:var(--dim);margin:0 0 26px;line-height:1.65;white-space:pre-line;}
.paper{
  background:var(--paper);color:var(--paper-ink);
  border-radius:12px;padding:26px 22px 22px;
  box-shadow:0 14px 40px rgba(0,0,0,.45);
}
.paper .cap{font-size:12px;color:#7A6E56;margin-bottom:14px;}
.code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:24px;font-weight:600;letter-spacing:.12em;
  line-height:1.55;word-break:break-all;
}
.paper .warns{margin-top:18px;padding-top:16px;border-top:1px solid rgba(42,36,24,.18);}
.paper .warns p{margin:0 0 7px;font-size:12.5px;line-height:1.6;color:#4A4030;}
.paper .warns p:last-child{margin-bottom:0;}

.copybar{display:flex;gap:9px;margin-top:16px;}
.copybar button{
  flex:1;padding:12px;font-size:13.5px;font-family:inherit;
  background:transparent;color:var(--text);
  border:1px solid var(--line);border-radius:9px;cursor:pointer;
}
.ack{
  display:flex;gap:11px;align-items:flex-start;
  margin-top:22px;padding:14px;
  border:1px solid var(--line);border-radius:10px;cursor:pointer;
}
.ack input{margin:2px 0 0;width:17px;height:17px;flex-shrink:0;accent-color:var(--steel);}
.ack span{font-size:13.5px;line-height:1.55;}

.step{display:none;}
.step.on{display:block;}
</style>
</head>
<body>
<div class="wrap">

  <!-- ── 1단계: 로그인 / 가입 ────────────────────────── -->
  <div id="stepAuth" class="step on">
    <h1 class="mark">Alias</h1>
    <p class="tag" data-t="tagline"></p>

    <div class="field">
      <label for="nick" data-t="nickLabel"></label>
      <input id="nick" type="text" autocomplete="username" autocapitalize="off" spellcheck="false">
      <p class="hint" data-t="nickHint"></p>
    </div>

    <div class="field">
      <label for="pw" data-t="pwLabel"></label>
      <input id="pw" type="password" autocomplete="current-password">
      <p class="hint" data-t="pwHint"></p>
    </div>

    <button id="go" class="btn" data-t="goBtn"></button>
    <div id="authErr" class="err"></div>
    <p class="note" data-t="firstTime"></p>
  </div>

  <!-- ── 2단계: 복구 코드 ───────────────────────────── -->
  <div id="stepCode" class="step">
    <h2 class="done-title" data-t="madeTitle"></h2>
    <p class="done-sub" data-t="madeSub"></p>

    <div class="paper">
      <div class="cap" data-t="codeCap"></div>
      <div class="code" id="codeOut"></div>
      <div class="warns">
        <p data-t="warn1"></p>
        <p data-t="warn2"></p>
        <p data-t="warn3"></p>
      </div>
    </div>

    <div class="copybar">
      <button id="copyBtn" data-t="copyBtn"></button>
    </div>

    <label class="ack">
      <input type="checkbox" id="ack">
      <span data-t="ackText"></span>
    </label>

    <button id="cont" class="btn" disabled data-t="contBtn"></button>
    <div id="codeErr" class="err"></div>
  </div>

  <!-- ── 3단계: 들어온 뒤 ───────────────────────────── -->
  <div id="stepIn" class="step">
    <h2 class="done-title" data-t="inTitle"></h2>
    <p class="done-sub" id="whoAmI"></p>
    <button id="out" class="btn ghost" data-t="signOut"></button>
  </div>

</div>

<script>
/* =====================================================================
   Alias Next-Gen — 가입 · 로그인 · 복구 코드
   2026-09-03

   ⚠ 설정 두 가지를 먼저 하셔야 아래가 돕니다. 아래 [설정] 참고.
   ===================================================================== */

/* ── [설정 1] 프로젝트 주소와 열쇠 ───────────────────────────────────
   Settings → API Keys 에서 가져오세요.

   ⚠ 함정 ㉑ — Supabase가 열쇠 체계를 바꿨습니다.
     sb_publishable_... 이 아니라 eyJ 로 시작하는 legacy anon 열쇠를
     쓰시길 권합니다. 새 열쇠는 권한이 달라 조용히 막히는 곳이 있습니다.
     화면에 legacy 가 안 보이면 sb_publishable 로 시험해보시고,
     안 되면 알려주세요.
------------------------------------------------------------------- */
const SUPABASE_URL  = 'https://azredlrnvsssfjytaotb.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF6cmVkbHJudnNzc2ZqeXRhb3RiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MDg1MjgsImV4cCI6MjEwMzk4NDUyOH0.2gTxzr54vRSZzFnyhLSd1Imv3OnwRBQs925CYeXdonI';

/* ── [설정 2] 🔴 이메일 확인을 꺼야 합니다 ──────────────────────────
   Authentication → Sign In / Providers → Email → "Confirm email" 끄기

   닉네임을 가짜 이메일(@u.alias.internal)로 바꿔 쓰기 때문에
   확인 메일이 갈 곳이 없습니다. 켜져 있으면 가입은 되는데
   세션이 안 생겨서, 복구 코드를 저장하는 데서 조용히 실패합니다.
   Aliascall도 이걸 꺼두셨을 겁니다.
------------------------------------------------------------------- */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

/* ── 문구 ────────────────────────────────────────────────────────
   ⚠ 함정 ⑱ — 한쪽 사전에만 넣으면 undefined 가 되어 빈 글자가 됩니다.
     아래 setText()는 문구가 없으면 열쇠 이름을 그대로 보여줍니다.
     화면에 [[nickLabel]] 같은 게 보이면 사전에 빠진 것입니다.
------------------------------------------------------------------- */
const STR = {
  tagline:   { kr:'번호가 없는 전화입니다.\n초대를 받은 사람만 연결됩니다.',
               en:'A phone without numbers.\nOnly people you invite can reach you.' },
  nickLabel: { kr:'닉네임', en:'Nickname' },
  nickHint:  { kr:'2~20자. 영문 소문자, 숫자, 한글, - _ 만 씁니다.\n상대에게는 보이지 않습니다.',
               en:'2-20 characters. Lowercase letters, numbers, Korean, - and _ only.\nNobody else sees this.' },
  pwLabel:   { kr:'비밀번호', en:'Password' },
  pwHint:    { kr:'8자 이상', en:'At least 8 characters' },
  goBtn:     { kr:'시작하기', en:'Continue' },
  firstTime: { kr:'처음 쓰는 닉네임이면 계정이 새로 만들어집니다.',
               en:'A new nickname creates a new account.' },

  madeTitle: { kr:'계정이 만들어졌습니다', en:'Your account is ready' },
  madeSub:   { kr:'아래 복구 코드를 지금 적어두세요.\n이 화면을 벗어나면 다시 볼 수 없습니다.',
               en:'Write down the recovery code below.\nYou cannot see it again after leaving this screen.' },
  codeCap:   { kr:'복구 코드', en:'Recovery code' },
  warn1:     { kr:'비밀번호를 잊으면 이 코드로만 되찾을 수 있습니다.',
               en:'This code is the only way to recover a forgotten password.' },
  warn2:     { kr:'저희는 이 코드를 다시 보여드릴 수 없습니다.',
               en:'We cannot show you this code again.' },
  warn3:     { kr:'이 코드를 잃으면 연락처가 모두 사라집니다.',
               en:'If you lose it, all your contacts are gone.' },
  copyBtn:   { kr:'복사', en:'Copy' },
  copied:    { kr:'복사했습니다', en:'Copied' },
  ackText:   { kr:'적어뒀습니다. 다시 볼 수 없다는 것을 이해합니다.',
               en:'I wrote it down. I understand it cannot be shown again.' },
  contBtn:   { kr:'계속', en:'Continue' },

  inTitle:   { kr:'들어왔습니다', en:'You are in' },
  signOut:   { kr:'로그아웃', en:'Sign out' },
  loggedInAs:{ kr:'계정 {id}', en:'Account {id}' },

  errNickShort:{ kr:'닉네임은 2자 이상이어야 합니다.', en:'Nickname must be at least 2 characters.' },
  errNickLong: { kr:'닉네임은 20자를 넘을 수 없습니다.', en:'Nickname cannot exceed 20 characters.' },
  errNickChar: { kr:'쓸 수 없는 글자가 있습니다: {bad}\n영문 소문자, 숫자, 한글, - _ 만 씁니다.',
                 en:'These characters cannot be used: {bad}\nOnly lowercase letters, numbers, Korean, - and _.' },
  errPwShort:  { kr:'비밀번호는 8자 이상이어야 합니다.', en:'Password must be at least 8 characters.' },
  errWrongPw:  { kr:'이미 쓰이는 닉네임인데 비밀번호가 맞지 않습니다.',
                 en:'That nickname is taken and the password does not match.' },
  errNoSession:{ kr:'계정은 만들어졌는데 로그인이 안 됐습니다.\nAuthentication → Email → Confirm email 이 꺼져 있는지 확인하세요.',
                 en:'The account was created but sign-in did not complete.\nCheck that Confirm email is turned off.' },
  errSaveCode: { kr:'복구 코드를 저장하지 못했습니다. 계속하지 마시고 알려주세요.',
                 en:'Could not save the recovery code. Please stop and report this.' },
  errGeneric:  { kr:'문제가 생겼습니다: {msg}', en:'Something went wrong: {msg}' },
};

let lang = (navigator.language || 'ko').toLowerCase().startsWith('ko') ? 'kr' : 'en';

function t(key, vars){
  const row = STR[key];
  if (!row || !row[lang]) return '[[' + key + ']]';   // 빠진 문구를 눈에 보이게
  let s = row[lang];
  if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  return s;
}
function paintText(){
  document.querySelectorAll('[data-t]').forEach(function(el){
    el.textContent = t(el.getAttribute('data-t'));
  });
}

/* ── 닉네임 → 가짜 이메일 ───────────────────────────────────────────
   ⚠ Aliascall과 다릅니다. Aliascall은 못 쓰는 글자를 조용히 지웁니다.
     그러면 "김철수"와 "김.철.수"가 같은 계정이 됩니다.
     여기서는 지우지 않고 거부합니다. 손님이 알아야 하니까요.
------------------------------------------------------------------- */
const NICK_OK = /^[a-z0-9가-힣_-]+$/;

function checkNick(raw){
  const n = (raw || '').trim().toLowerCase();
  if (n.length < 2)  return { ok:false, msg:t('errNickShort') };
  if (n.length > 20) return { ok:false, msg:t('errNickLong') };
  if (!NICK_OK.test(n)) {
    const bad = Array.from(new Set(n.split('').filter(function(c){ return !NICK_OK.test(c); }))).join(' ');
    return { ok:false, msg:t('errNickChar', { bad: bad }) };
  }
  return { ok:true, nick:n };
}
function nicknameToEmail(nick){
  return encodeURIComponent(nick) + '@u.alias.internal';
}

/* ── 복구 코드 ──────────────────────────────────────────────────────
   헷갈리는 글자(0 O 1 I L)를 뺀 31글자에서 16자를 뽑습니다.
   31^16 ≈ 2^79 이라 찍어서 맞힐 수 없습니다.
------------------------------------------------------------------- */
const CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';

function makeRecoveryCode(){
  const buf = new Uint8Array(16);
  crypto.getRandomValues(buf);
  let out = '';
  for (let i = 0; i < 16; i++) {
    out += CODE_ALPHABET[buf[i] % CODE_ALPHABET.length];
    if (i % 4 === 3 && i !== 15) out += '-';
  }
  return out; // 예: K7M2-P9XR-4TQB-1WZN
}
async function hashCode(code){
  const flat = code.replace(/-/g, '').toUpperCase();
  const bytes = new TextEncoder().encode('alias-recovery-v1:' + flat);
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return Array.from(new Uint8Array(digest))
    .map(function(b){ return b.toString(16).padStart(2, '0'); }).join('');
}

/* ── 화면 전환 ─────────────────────────────────────────────────── */
function show(id){
  document.querySelectorAll('.step').forEach(function(el){ el.classList.remove('on'); });
  document.getElementById(id).classList.add('on');
}
function showErr(elId, msg){
  const el = document.getElementById(elId);
  el.textContent = msg;
  el.classList.add('show');
}
function clearErr(elId){
  const el = document.getElementById(elId);
  el.textContent = '';
  el.classList.remove('show');
}

/* ── 가입 · 로그인 ─────────────────────────────────────────────── */
let pendingCode = null;

async function start(){
  clearErr('authErr');
  const nickCheck = checkNick(document.getElementById('nick').value);
  if (!nickCheck.ok) { showErr('authErr', nickCheck.msg); return; }

  const pw = document.getElementById('pw').value;
  if (pw.length < 8) { showErr('authErr', t('errPwShort')); return; }

  const btn = document.getElementById('go');
  btn.disabled = true;

  try {
    const email = nicknameToEmail(nickCheck.nick);
    const signUpRes = await sb.auth.signUp({ email: email, password: pw });

    // 이미 있는 닉네임이면 signUp이 실패합니다 → 로그인으로 넘어갑니다.
    const msg = String((signUpRes.error && signUpRes.error.message) || '').toLowerCase();
    const taken = msg.includes('already registered') || msg.includes('already exists') || msg.includes('user already');

    if (signUpRes.error && !taken) throw signUpRes.error;

    if (taken) {
      const loginRes = await sb.auth.signInWithPassword({ email: email, password: pw });
      if (loginRes.error) { showErr('authErr', t('errWrongPw')); btn.disabled = false; return; }
      await enterApp();
      return;
    }

    // 새 계정입니다. 세션이 잡혔는지 반드시 확인합니다.
    const sess = await sb.auth.getSession();
    if (!sess.data.session) { showErr('authErr', t('errNoSession')); btn.disabled = false; return; }

    // 복구 코드를 만들어 해시만 저장합니다. 코드 자체는 서버에 안 남습니다.
    pendingCode = makeRecoveryCode();
    const codeHash = await hashCode(pendingCode);
    const ins = await sb.from('recovery_codes').insert({
      account_id: sess.data.session.user.id,
      code_hash: codeHash,
    });
    if (ins.error) {
      // 여기서 멈추는 게 맞습니다. 복구 코드 없는 계정을 만들면 안 됩니다.
      console.error('[recovery] 저장 실패', ins.error);
      showErr('authErr', t('errSaveCode') + '\n(' + ins.error.message + ')');
      btn.disabled = false;
      return;
    }

    document.getElementById('codeOut').textContent = pendingCode;
    show('stepCode');

  } catch (e) {
    console.error(e);
    showErr('authErr', t('errGeneric', { msg: (e && e.message) || String(e) }));
  } finally {
    btn.disabled = false;
  }
}

async function enterApp(){
  const sess = await sb.auth.getSession();
  const uid = sess.data.session ? sess.data.session.user.id : '?';
  document.getElementById('whoAmI').textContent = t('loggedInAs', { id: uid.slice(0, 8) });
  show('stepIn');
}

/* ── 붙이기 ────────────────────────────────────────────────────── */
document.getElementById('go').addEventListener('click', start);
document.getElementById('pw').addEventListener('keydown', function(e){
  if (e.key === 'Enter') start();
});

document.getElementById('copyBtn').addEventListener('click', async function(){
  try {
    await navigator.clipboard.writeText(pendingCode || '');
    this.textContent = t('copied');
    setTimeout(function(){ document.getElementById('copyBtn').textContent = t('copyBtn'); }, 1600);
  } catch (e) { /* 클립보드가 막힌 환경 — 손으로 적으면 됩니다 */ }
});

document.getElementById('ack').addEventListener('change', function(){
  document.getElementById('cont').disabled = !this.checked;
});

document.getElementById('cont').addEventListener('click', function(){
  pendingCode = null;               // 화면을 벗어나면 정말로 사라집니다
  document.getElementById('codeOut').textContent = '';
  enterApp();
});

document.getElementById('out').addEventListener('click', async function(){
  await sb.auth.signOut();
  document.getElementById('pw').value = '';
  show('stepAuth');
});

/* ── 시작 ──────────────────────────────────────────────────────── */
paintText();
sb.auth.getSession().then(function(res){
  if (res.data.session) enterApp();
});
</script>
</body>
</html>
