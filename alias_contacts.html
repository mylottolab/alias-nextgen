<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>연락처 — Alias</title>
<link rel="stylesheet" href="alias_common.css?v=20260904b">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="alias_common.js?v=20260904b"></script>
</head>
<body class="tabbed">
<div class="wrap">

  <div class="tophead">
    <h1 class="h2" data-t="cntTitle"></h1>
    <button class="plusbtn" id="plus" aria-label="연락처 늘리기">+</button>
  </div>

  <details class="legend">
    <summary data-t="cntLegendOpen"></summary>
    <p data-t="cntLegend"></p>
  </details>

  <div id="twin" class="ok" data-t="cntSamePeer"></div>
  <div id="list"></div>
  <div id="err" class="err"></div>

</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" style="display:none">
  <div class="grip"></div>
  <a href="alias_invite.html">
    <span data-t="addInvite"></span>
    <small data-t="addInviteSub"></small>
  </a>
  <a href="alias_join.html">
    <span data-t="addJoin"></span>
    <small data-t="addJoinSub"></small>
  </a>
</div>

<nav class="tabbar">
  <a href="alias_contacts.html" class="on" data-t="navContacts"></a>
  <a href="alias_calls.html" data-t="navCalls"></a>
  <a href="alias_me.html" data-t="navMe"></a>
</nav>

<script>
/* =====================================================================
   연락처 (홈)
   ⚠ 목록은 짧게 둡니다. 설명은 관계 상세(alias_link.html)가 합니다.
     한 줄에 다 담았더니 시끄러워서 아무도 안 읽었습니다.
   ===================================================================== */

let rows = [];

function showErr(msg){
  const el = document.getElementById('err');
  el.textContent = msg; el.classList.add('show');
}

function paint(){
  const box = document.getElementById('list');
  if (!rows.length) {
    box.innerHTML = '<div class="empty">' + AL.esc(AL.t('cntEmpty')) + '</div>';
    document.getElementById('twin').classList.remove('show');
    return;
  }

  // 같은 상대가 여러 줄이면 안내를 띄웁니다. 버그가 아니라 설계입니다.
  const seen = {};
  let twin = false;
  rows.forEach(function(r){
    const k = (r.peer_label || '') + '\u0000' + (r.peer_display || '');
    if (seen[k]) twin = true;
    seen[k] = 1;
  });
  document.getElementById('twin').classList.toggle('show', twin);

  box.innerHTML = rows.map(function(r){
    // 큰 글씨 = 내가 부르는 이름. 없으면 상대 별칭.
    // 동그라미 = 내가 이 사람에게 쓰는 얼굴의 첫 글자.
    const shown = r.peer_label || r.peer_display || AL.t('cntUnnamed');
    const sub = r.peer_label ? (r.peer_display || '') : '';
    return '<div class="crow" data-go="' + AL.esc(r.link_id) + '">' +
      '<div class="cav">' + AL.esc(AL.initial(r.my_face)) + '</div>' +
      '<div class="cmid">' +
        '<div class="cname">' + AL.esc(shown) + '</div>' +
        (sub ? '<div class="csub">' + AL.esc(sub) + '</div>' : '') +
      '</div>' +
      '<div class="ctime">' + AL.esc(AL.fmtShort(r.last_activity_at)) + '</div>' +
    '</div>';
  }).join('');

  box.querySelectorAll('[data-go]').forEach(function(el){
    el.addEventListener('click', function(){
      location.href = 'alias_link.html?link=' + encodeURIComponent(el.getAttribute('data-go'));
    });
  });
}

async function reload(){
  try {
    const res = await AL.sb.rpc('my_contacts');
    if (res.error) throw res.error;
    rows = res.data || [];
    paint();
  } catch (e) {
    console.error(e);
    showErr(AL.t('errGeneric', { msg: e.message || String(e) }));
  }
}

function openSheet(on){
  document.getElementById('sheetBg').classList.toggle('show', on);
  document.getElementById('sheet').style.display = on ? '' : 'none';
}
document.getElementById('plus').addEventListener('click', function(){ openSheet(true); });
document.getElementById('sheetBg').addEventListener('click', function(){ openSheet(false); });

(async function(){
  AL.paintText();
  if (!await AL.requireLogin()) return;
  await reload();
})();
</script>
</body>
</html>
