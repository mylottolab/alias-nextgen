    return;
  }

<script>
/* =====================================================================
   연락처 (홈)
   ⚠ 목록은 짧게. 설명은 관계 상세가 합니다.
   ⚠ 위로 올리기·알림은 목록의 ⋯ 안에 둡니다. 상세 화면 안에서는
     "위로 올린다"가 어디로 가는 건지 알 수가 없습니다(옆줄이 안 보이니까요).
   ===================================================================== */

let rows = [];
let grouped = false;   // 별칭별로 묶어 볼지
let closedGroups = {}; // 접힌 묶음
let menuRow = null;    // ⋯ 를 누른 줄

/* 🔴🔴 2026-09-12 신설 — 별표 · 단축번호 · 고정순서

   왜 따로 읽는가
     연락처 목록은 my_contacts() 함수가 만들어 줍니다. 거기에 칸을 더하려면
     함수의 반환 모양을 바꿔야 하는데, 그러면 함수를 지웠다 다시 만들어야
     하고 다른 화면까지 영향을 받습니다.
     그래서 link_sides 에서 **필요한 세 칸만 따로 읽어** 붙입니다.
     서버에 한 번 더 다녀오지만 연락처가 수백 개가 아니면 차이가 없습니다.
     나중에 느려지면 그때 함수로 옮기면 됩니다.

   ⚠ my_contacts 가 돌려주는 my_side_id 가 link_sides.id 입니다.
     그것으로 짝을 맞춥니다. */
let extra = {};        // my_side_id → { starred, speed_dial, pin_order }

const SORT_KEY = 'alias_contacts_sort_v1';
let sortBy = 'recent'; // recent · name · star · speed
try { sortBy = localStorage.getItem(SORT_KEY) || 'recent'; } catch (e) {}

/* 줄 하나의 별표·단축번호를 꺼냅니다. 없으면 기본값입니다. */
function ex(r){
  return extra[r.my_side_id] || { starred: false, speed_dial: null, pin_order: null };
}

function showErr(msg){
  const el = document.getElementById('err');
  el.textContent = msg; el.classList.add('show');
}

/* ── 걸러내기 ────────────────────────────────────────────────────
   내가 부른 이름, 상대 별칭, 내 별칭 셋 다에서 찾습니다.
   "업무용으로 만난 사람"을 찾을 수 있어야 하니까요. */
function visible(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  if (!q) return rows;
  return rows.filter(function(r){
    return [r.peer_label, r.peer_display, r.my_face]
      .some(function(v){ return v && v.toLowerCase().indexOf(q) >= 0; });
  });
}

/* 목록에 보일 이름. 그룹이면 방 이름입니다. */
function nameOf(r){
  return (r.kind === 'group')
    ? (r.room_name || AL.t('grNoName'))
    : (r.peer_label || r.peer_display || AL.t('cntUnnamed'));
}

/* ── 정렬 ────────────────────────────────────────────────────────
   ⚠ 어느 정렬이든 "위로 올린 것" 은 항상 맨 위입니다.
     손님이 일부러 올려둔 것이니, 정렬을 바꿨다고 내려가면 안 됩니다.
   ⚠ 위로 올린 것들끼리는 pin_order 로 순서를 매깁니다(⋯ 의 ▲▼). */
function sorted(list){
  const byName = function(a, b){
    return nameOf(a).localeCompare(nameOf(b), AL.lang === 'kr' ? 'ko' : 'en');
  };
  const byRecent = function(a, b){
    return String(b.last_activity_at || '').localeCompare(String(a.last_activity_at || ''));
  };

  const rest = function(a, b){
    if (sortBy === 'name') return byName(a, b);
    if (sortBy === 'star') {
      const sa = ex(a).starred ? 0 : 1, sb = ex(b).starred ? 0 : 1;
      if (sa !== sb) return sa - sb;
      return byRecent(a, b);
    }
    if (sortBy === 'speed') {
      // 단축번호가 있는 것이 먼저, 번호 순. 없는 것은 뒤에 최근 순.
      const na = ex(a).speed_dial, nb = ex(b).speed_dial;
      if (na && nb) return na - nb;
      if (na) return -1;
      if (nb) return 1;
      return byRecent(a, b);
    }
    return byRecent(a, b);
  };

  return list.slice().sort(function(a, b){
    if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;   // 올린 것이 항상 위
    if (a.pinned && b.pinned) {
      const oa = ex(a).pin_order, ob = ex(b).pin_order;
      if (oa != null && ob != null && oa !== ob) return oa - ob;
      if (oa != null) return -1;
      if (ob != null) return 1;
    }
    return rest(a, b);
  });
}

function rowHtml(r){
  // ⚠ 그룹은 상대가 여럿이라 방 이름으로 부릅니다.
  const shown = nameOf(r);
  const sub = r.peer_label ? (r.peer_display || '') : '';
  const e = ex(r);   // 🔴 2026-09-12 — 별표 · 단축번호
  const n = r.unread || 0;
  const isRoom = r.kind === 'group';
  return '<div class="crow' + (n ? ' hasnew' : '') + (isRoom ? ' room' : '') + '">' +
    '<div class="cav" data-go="' + AL.esc(r.link_id) + '">' +
      AL.esc(isRoom ? '👥' : AL.initial(r.my_face)) + '</div>' +
    '<div class="cmid" data-go="' + AL.esc(r.link_id) + '">' +
      '<div class="cname">' +
        (e.speed_dial ? '<span class="spd">' + AL.esc(e.speed_dial) + '</span>' : '') +
        (e.starred ? '<span class="star">★</span>' : '') +
        (r.pinned ? '▲ ' : '') + AL.esc(shown) +
        (n ? '<span class="unread">' + AL.esc(n > 99 ? '99+' : n) + '</span>' : '') +
      '</div>' +
      (sub ? '<div class="csub">' + AL.esc(sub) + '</div>' : '') +
    '</div>' +
    /* 🔴 2026-09-12 — "어제" 가 아니라 월일 시분까지 보여줍니다.
       같은 상대가 여러 줄일 때 시각으로 구별하라고 안내하면서
       정작 시각을 안 보여주고 있었습니다. */
    '<div class="ctime">' + AL.esc(AL.fmtWhen(r.last_activity_at)) + '</div>' +
    '<button class="cdots" data-menu="' + AL.esc(r.link_id) + '" aria-label="' + AL.esc(AL.t('ariaMore')) + '">⋯</button>' +
  '</div>';
}

function paint(){
  const box = document.getElementById('list');
  const list = visible();

  if (!rows.length) {
    box.innerHTML = '<div class="empty">' + AL.esc(AL.t('cntEmpty')) + '</div>';
    document.getElementById('twin').classList.remove('show');
    return;
  }

  // 같은 상대가 여러 줄이면 안내. 버그가 아니라 설계입니다.
  const seen = {}; let twin = false;
  rows.forEach(function(r){
    const k = (r.peer_label || '') + '\u0000' + (r.peer_display || '');
    if (seen[k]) twin = true;
    seen[k] = 1;
  });
  document.getElementById('twin').classList.toggle('show', twin);

  // 하단 탭에도 총합을 띄웁니다. 다른 탭에 있어도 눈에 띄게.
  const total = rows.reduce(function(a, r){ return a + (r.unread || 0); }, 0);
  const tab = document.getElementById('tabContacts');
  tab.innerHTML = AL.esc(AL.t('navContacts')) +
    (total ? '<span class="tb-badge">' + AL.esc(total > 99 ? '99+' : total) + '</span>' : '');

  if (!list.length) {
    box.innerHTML = '<div class="nores">' + AL.esc(AL.t('cntNoMatch')) + '</div>';
    return;
  }

  if (!grouped) {
    box.innerHTML = sorted(list).map(rowHtml).join('');
  } else {
    // 내가 쓰는 별칭으로 묶습니다. "업무용으로 만난 사람들"이 한 덩어리가 됩니다.
    const order = [];
    const bag = {};
    list.forEach(function(r){
      const k = r.my_face || '';
      if (!bag[k]) { bag[k] = []; order.push(k); }
      bag[k].push(r);
    });
    box.innerHTML = order.map(function(k){
      const closed = !!closedGroups[k];
      return '<div class="grp' + (closed ? ' closed' : '') + '" data-grp="' + AL.esc(k) + '">' +
          '<span class="gav">' + AL.esc(AL.initial(k)) + '</span>' +
          '<span class="gname">' + AL.esc(k) + '</span>' +
          '<span class="gcount">' + AL.esc(AL.t('cntCount', { n: bag[k].length })) + '</span>' +
          '<span class="gcaret">▼</span>' +
        '</div>' +
        (closed ? '' : sorted(bag[k]).map(rowHtml).join(''));
    }).join('');
  }

  box.querySelectorAll('[data-go]').forEach(function(el){
    el.addEventListener('click', function(){
      location.href = 'alias_chat.html?link=' + encodeURIComponent(el.getAttribute('data-go'));
    });
  });
  box.querySelectorAll('[data-menu]').forEach(function(el){
    el.addEventListener('click', function(e){
      e.stopPropagation();
      openRowMenu(el.getAttribute('data-menu'));
    });
  });
  box.querySelectorAll('[data-grp]').forEach(function(el){
    el.addEventListener('click', function(){
      const k = el.getAttribute('data-grp');
      closedGroups[k] = !closedGroups[k];
      paint();
    });
  });
}

/* ── 줄 메뉴 ─────────────────────────────────────────────────── */
function openRowMenu(linkId){
  menuRow = rows.filter(function(r){ return r.link_id === linkId; })[0];
  if (!menuRow) return;
  const e = ex(menuRow);

  document.getElementById('rowWho').textContent = nameOf(menuRow);
  document.getElementById('mStar').textContent =
    e.starred ? AL.t('cntStarOff') : AL.t('cntStarOn');
  document.getElementById('mSpeed').textContent =
    AL.t('cntSpeedSet') + (e.speed_dial ? ' (' + e.speed_dial + ')' : '');
  document.getElementById('mPin').textContent =
    menuRow.pinned ? AL.t('dtlPinOff') : AL.t('dtlPinOn');
  document.getElementById('mMute').textContent =
    menuRow.muted ? AL.t('dtlMuteOff') : AL.t('dtlMuteOn');

  /* ▲▼ 는 위로 올린 것에만 씁니다. 안 올린 것에는 옮길 자리가 없습니다. */
  const canMove = !!menuRow.pinned;
  document.getElementById('mUp').style.display = canMove ? '' : 'none';
  document.getElementById('mDown').style.display = canMove ? '' : 'none';

  /* 그룹은 1:1 통화 화면으로 못 갑니다. 방 통화는 다른 화면입니다. */
  document.getElementById('mCall').style.display =
    (menuRow.kind === 'group') ? 'none' : '';

  showRowSheet(true);
}
function showRowSheet(on){
  document.getElementById('rowBg').classList.toggle('show', on);
  document.getElementById('rowSheet').style.display = on ? '' : 'none';
}

async function patchSide(patch){
  // ⚠ RLS가 막으면 오류 없이 0줄이 바뀝니다(함정 ⑦). select 로 확인합니다.
  const res = await AL.sb.from('link_sides')
    .update(patch).eq('id', menuRow.my_side_id).select('id');
  if (res.error) throw res.error;
  if (!res.data || !res.data.length) throw new Error(AL.t('errNoRows'));
  await reload();
}

document.getElementById('mPin').addEventListener('click', async function(){
  showRowSheet(false);
  try { await patchSide({ pinned: !menuRow.pinned }); }
  catch (e) { console.error(e); showErr(AL.t('errGeneric', { msg: e.message || String(e) })); }
});
document.getElementById('mMute').addEventListener('click', async function(){
  showRowSheet(false);
  try { await patchSide({ muted: !menuRow.muted }); }
  catch (e) { console.error(e); showErr(AL.t('errGeneric', { msg: e.message || String(e) })); }
});
document.getElementById('mOpen').addEventListener('click', function(){
  location.href = 'alias_link.html?link=' + encodeURIComponent(menuRow.link_id);
});
document.getElementById('rowBg').addEventListener('click', function(){ showRowSheet(false); });

/* ── 🔴 2026-09-12 신설 — 바로 걸기 · 바로 메시지 ─────────────────
   ⚠ 표(once)를 반드시 붙입니다. 없으면 통화 화면이 그냥 나가버립니다.
     alias_chat.html 이 만드는 것과 같은 방식입니다. */
function newTicket(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
document.getElementById('mCall').addEventListener('click', function(){
  const id = menuRow.link_id;
  showRowSheet(false);
  location.href = 'alias_call.html?link=' + encodeURIComponent(id) +
    '&type=voice&once=' + newTicket();
});
document.getElementById('mMsg').addEventListener('click', function(){
  const id = menuRow.link_id;
  showRowSheet(false);
  location.href = 'alias_chat.html?link=' + encodeURIComponent(id);
});

/* ── 🔴 2026-09-12 신설 — 별표 ───────────────────────────────── */
document.getElementById('mStar').addEventListener('click', async function(){
  const on = !ex(menuRow).starred;
  showRowSheet(false);
  try { await patchSide({ starred: on }); }
  catch (e) { console.error(e); showErr(AL.t('errGeneric', { msg: e.message || String(e) })); }
});

/* ── 🔴 2026-09-12 신설 — 위로 올린 것들의 순서 ────────────────────
   손가락으로 끌어 옮기는 방식(드래그)은 폰에서 잘 안 눌립니다.
   ▲▼ 단추가 훨씬 확실합니다.

   ⚠ pin_order 가 비어 있는 줄이 섞여 있을 수 있어, 옮길 때마다
     올린 것 전체에 1,2,3... 을 다시 매깁니다. 몇 개 안 되니 괜찮습니다. */
async function movePinned(delta){
  const pins = sorted(rows.filter(function(r){ return r.pinned; }));
  const i = pins.findIndex(function(r){ return r.link_id === menuRow.link_id; });
  if (i < 0) return;
  const j = i + delta;
  if (j < 0 || j >= pins.length) return;           // 맨 끝이면 그대로

  const t = pins[i]; pins[i] = pins[j]; pins[j] = t;

  for (let k = 0; k < pins.length; k++) {
    const res = await AL.sb.from('link_sides')
      .update({ pin_order: k + 1 }).eq('id', pins[k].my_side_id).select('id');
    if (res.error) throw res.error;
  }
  await reload();
}
document.getElementById('mUp').addEventListener('click', async function(){
  showRowSheet(false);
  try { await movePinned(-1); }
  catch (e) { console.error(e); showErr(AL.t('errGeneric', { msg: e.message || String(e) })); }
});
document.getElementById('mDown').addEventListener('click', async function(){
  showRowSheet(false);
  try { await movePinned(1); }
  catch (e) { console.error(e); showErr(AL.t('errGeneric', { msg: e.message || String(e) })); }
});

/* ── 🔴 2026-09-12 신설 — 단축번호 ─────────────────────────────── */
function showSpdSheet(on){
  document.getElementById('spdBg').classList.toggle('show', on);
  document.getElementById('spdSheet').style.display = on ? '' : 'none';
}
document.getElementById('spdBg').addEventListener('click', function(){ showSpdSheet(false); });

document.getElementById('mSpeed').addEventListener('click', function(){
  showRowSheet(false);
  document.getElementById('spdAsk').textContent =
    nameOf(menuRow) + ' — ' + AL.t('cntSpeedAsk');

  /* 이미 다른 사람이 쓰는 번호는 그 사람 이름을 같이 보여줍니다.
     모르고 눌렀다가 남의 번호를 빼앗으면 곤란합니다. */
  const owner = {};
  rows.forEach(function(r){
    const n = ex(r).speed_dial;
    if (n) owner[n] = r;
  });

  let html = '';
  for (let n = 1; n <= 9; n++) {
    const o = owner[n];
    const mine = o && o.link_id === menuRow.link_id;
    html += '<button data-spd="' + n + '" class="' + (o && !mine ? 'used' : '') + '">' +
      n + (o ? '<small>' + AL.esc(nameOf(o)) + '</small>' : '') + '</button>';
  }
  const grid = document.getElementById('spdGrid');
  grid.innerHTML = html;
  grid.querySelectorAll('[data-spd]').forEach(function(el){
    el.addEventListener('click', function(){ setSpeed(parseInt(el.getAttribute('data-spd'), 10), owner); });
  });
  showSpdSheet(true);
});

document.getElementById('spdNone').addEventListener('click', function(){ setSpeed(null, {}); });

async function setSpeed(n, owner){
  try {
    /* ⚠ 한 사람이 같은 번호를 둘 가질 수 없게 DB 에 막아뒀습니다.
       그러니 남이 쓰던 번호면 **먼저 비우고** 나서 넣어야 합니다.
       순서를 바꾸면 "이미 있다" 는 오류가 납니다. */
    if (n && owner[n] && owner[n].link_id !== menuRow.link_id) {
      if (!confirm(AL.t('cntSpeedTaken', { n: n, who: nameOf(owner[n]) }))) return;
      const c = await AL.sb.from('link_sides')
        .update({ speed_dial: null }).eq('id', owner[n].my_side_id).select('id');
      if (c.error) throw c.error;
    }
    showSpdSheet(false);
    await patchSide({ speed_dial: n });
  } catch (e) {
    console.error(e);
    showSpdSheet(false);
    showErr(AL.t('errGeneric', { msg: e.message || String(e) }));
  }
}

/* ── 🔴 2026-09-12 신설 — 정렬 고르기 ──────────────────────────── */
function sortLabel(){
  return AL.t('cntSort') + ' · ' + AL.t({
    recent: 'cntSortRecent', name: 'cntSortName',
    star: 'cntSortStar', speed: 'cntSortSpeed',
  }[sortBy]);
}
function showSortSheet(on){
  document.getElementById('sortBg').classList.toggle('show', on);
  document.getElementById('sortSheet').style.display = on ? '' : 'none';
}
document.getElementById('sortBtn').addEventListener('click', function(){ showSortSheet(true); });
document.getElementById('sortBg').addEventListener('click', function(){ showSortSheet(false); });
document.querySelectorAll('[data-sort]').forEach(function(el){
  el.addEventListener('click', function(){
    sortBy = el.getAttribute('data-sort');
    try { localStorage.setItem(SORT_KEY, sortBy); } catch (e) {}
    document.getElementById('sortBtn').textContent = sortLabel();
    showSortSheet(false);
    paint();
  });
});

/* ── 읽어오기 ───────────────────────────────────────────────── */
async function reload(){
  try {
    const res = await AL.sb.rpc('my_contacts');
    if (res.error) throw res.error;
    rows = res.data || [];

    /* 🔴 2026-09-12 — 별표 · 단축번호 · 고정순서를 따로 읽어 붙입니다.
       my_contacts 함수를 안 건드리려는 것입니다. 위 설명 참고.
       ⚠ 못 읽어도 목록은 그려야 합니다. 별표만 안 보일 뿐입니다. */
    try {
      const e2 = await AL.sb.from('link_sides')
        .select('id, starred, speed_dial, pin_order');
      if (!e2.error) {
        extra = {};
        (e2.data || []).forEach(function(x){ extra[x.id] = x; });
      } else {
        console.warn('[contacts] 별표를 못 읽었습니다', e2.error);
      }
    } catch (e) { console.warn('[contacts] 별표를 못 읽었습니다', e); }

    paint();
  } catch (e) {
    console.error(e);
    showErr(AL.t('errGeneric', { msg: e.message || String(e) }));
  }
}

/* ── 도구 ───────────────────────────────────────────────────── */
document.getElementById('q').addEventListener('input', paint);
document.getElementById('grpBtn').addEventListener('click', function(){
  grouped = !grouped;
  this.classList.toggle('on', grouped);
  paint();
});

function showAdd(on){
  document.getElementById('addBg').classList.toggle('show', on);
  document.getElementById('addSheet').style.display = on ? '' : 'none';
}
document.getElementById('plus').addEventListener('click', function(){ showAdd(true); });
document.getElementById('addBg').addEventListener('click', function(){ showAdd(false); });

/* 알림은 공용(AL.startAlerts)이 냅니다. 여기서는 목록만 다시 그립니다. */

(async function(){
  AL.paintText();
  document.getElementById('sortBtn').textContent = sortLabel();   // 🔴 2026-09-12
  if (!await AL.requireLogin()) return;
  await reload();

  AL.startAlerts({
    onMessage: function(){ reload(); return false; },  // 소리는 공용이 냅니다
    onPoll: function(){ reload(); },
    pollMs: 15000,
  });

  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') reload();
  });

  // 어느 화면에 있든 걸려온 전화를 받습니다.
  // ⚠ 앱이 켜져 있을 때만 됩니다. 잠금화면은 3단계(FCM)의 일입니다.
  AL.watchIncoming(function(c){
    AL.alertNew();
    location.href = 'alias_call.html?call=' + encodeURIComponent(c.call_id) +
      '&token=' + encodeURIComponent(c.session_token) +
      '&link=' + encodeURIComponent(c.link_id) +
      '&type=' + encodeURIComponent(c.call_type) +
      '&once=' + encodeURIComponent(c.call_id);
  });
})();
</script>
