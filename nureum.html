<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E4572E">
<title>누름</title>
<link rel="stylesheet" href="nureum.css?v=20261030a">
<script src="alias_config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="alias_common.js?v=20261030p"></script>
<script src="nureum.js?v=20261030c"></script>
</head>
<body>
<!-- 누름 첫 화면: 내 라인들. 라인 아이콘을 누르면 그 라인 화면, + 를 누르면 새 라인 -->
<div class="nu">
  <div class="nu-top">
    <svg width="40" height="40" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="14" fill="none" stroke="#E4572E" stroke-width="3"></circle><circle cx="17" cy="17" r="6.5" fill="#E4572E"></circle></svg>
    <h1>누름</h1>
    <a class="nu-back" href="alias_contacts.html" aria-label="부름으로" title="부름으로" style="width:auto;padding:0 12px;font-size:13px">부름</a>
  </div>
  <p class="nu-sub">한 사람과만, 누르면 바로. 라인마다 바탕화면 아이콘이 하나씩 생겨요.</p>

  <div id="err" class="nu-err" role="alert"></div>
  <div id="grid" class="nu-grid" aria-live="polite"></div>
  <p id="empty" class="nu-sub nu-hidden" style="text-align:center;padding:18px 0">아직 라인이 없습니다.<br>아래 [새 라인 만들기]로 시작하세요.</p>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
    <a class="nu-btn" href="nureum_new.html">＋ 새 라인 만들기</a>
    <a class="nu-btn ghost" href="nureum_join.html">받은 코드 · QR로 짝 맺기</a>
  </div>
</div>

<script>
(async function(){
  if (!await NU.session()) {
    document.querySelectorAll('.nu > *:not(.nu-top)').forEach(function(e){ e.classList.add('nu-hidden'); });
    var w = document.createElement('div'); w.style.cssText = 'display:flex;flex-direction:column;gap:12px';
    document.querySelector('.nu').appendChild(w); NU.welcome(w);
    return;
  }
  var grid = document.getElementById('grid');
  try {
    var lines = await NU.rpc('nureum_my_lines');
    if (!lines.length) { document.getElementById('empty').classList.remove('nu-hidden'); return; }
    grid.innerHTML = lines.map(function(l){
      var state = !l.link_id ? '짝 기다리는 중' : (!l.active ? (l.is_owner ? '이용권 필요' : '연장 필요') : '');
      var href = !l.link_id ? 'nureum_new.html?line=' + l.id : 'nureum_line.html?line=' + l.id;
      return '<a class="nu-tile" href="' + href + '">' +
        '<span class="nu-ico" style="background:' + NU.esc(l.color) + '">' + NU.esc(NU.glyph(l)) +
        (state ? '<span class="tag">!</span>' : '') + '</span>' +
        '<b>' + NU.esc(l.name) + '</b>' + (state ? '<small>' + state + '</small>' : '') + '</a>';
    }).join('');
  } catch (e) {
    console.error(e);
    NU.showErr('err', '라인을 불러오지 못했습니다. ' + (e.message || e));
  }
})();
</script>
</body>
</html>
