     보통 폰은 초록 전화 아이콘 하나가 키패드·최근기록·연락처를 다 갖고

let extra = {};        // my_side_id → { starred, speed_dial, pin_order }
let myFaces = {};      // 🔴 2026-09-13 — 내 별칭 이름 → 사진 경로

const KR = (AL.lang !== 'en');
const BT = KR ? {

} : {
  title: 'Phone book', save: '+ Save number', num: '🔢 Burum number', no: 'Burum number (10 digits)', name: 'Name', slot: 'Speed dial',
  none: 'None', ok: 'Save', del: 'Delete this number', edit: 'Edit saved number', add: 'Save a Burum number',

function fmtNo(n){ n = String(n || ''); return n.length === 10 ? n.slice(0, 4) + '-' + n.slice(4, 7) + '-' + n.slice(7) : n; }
function info(msg){ const el = document.getElementById('info'); el.textContent = msg || ''; el.classList.toggle('show', !!msg); }
/* 이미 연락처에 있는 사이면 그 줄과 합치고, 아니면 따로 한 줄 */
function bookLinked(b){ return b.link_id && rows.some(function(r){ return r.link_id === b.link_id; }); }
function bookFor(linkId){ return book.filter(function(b){ return b.link_id === linkId; })[0] || null; }
function bookOnly(){ return book.filter(function(b){ return !bookLinked(b); }); }

/* 저장한 번호로 걸기 — 이어진 사이면 바로, 아니면 연결 요청(부름번호 다이얼과 같음) */
async function dialNo(b, kind){
  if (b.link_id) { if (kind === 'chat') return chatTo(b.link_id); return callTo(b.link_id, kind); }
  if (kind === 'chat') { location.href = 'alias_number.html?dial=' + b.number + '&msg=1'; return; }
  if (!await AL.requirePlan()) return;
  const r = await AL.sb.rpc('bn_dial', { p_number: b.number, p_persona: null, p_note: null });
  const d = r.data || {};
  if (r.error || !d.ok) {
    if (d.error === 'need_plan') { AL.needPlan(); return; }
    info(d.error === 'slow_down' ? BT.slow : d.error === 'own' ? BT.own : BT.notFound); return;
  }
  if (d.state === 'linked' && d.link_id) { await reload(); return callTo(d.link_id, kind); }
  info(d.again ? BT.again : BT.requested);
}

function showErr(msg){
  const el = document.getElementById('err');
  el.textContent = msg; el.classList.add('show');
}

function ex(r){
  return extra[r.my_side_id] || { starred: false, speed_dial: null, pin_order: null };
}
function nameOf(r){
  return (r.kind === 'group')
    ? (r.room_name || AL.t('grNoName'))
    : (r.peer_label || r.peer_display || AL.t('cntUnnamed'));
}
function isRoom(r){ return r.kind === 'group'; }

/* 통화 화면은 한 번만 쓰는 표를 요구합니다. 없으면 그냥 나가버립니다. */
function newTicket(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
async function callTo(linkId, kind){
  if (!await AL.requirePlan()) return;   // 🔴 2026-09-14 이용권
  /* 🔴 2026-09-12 — 기본은 늘 음성입니다. 영상은 따로 골라야 합니다. */
  location.href = 'alias_call.html?link=' + encodeURIComponent(linkId) +
    '&type=' + (kind === 'video' ? 'video' : 'voice') + '&once=' + newTicket();
}
async function chatTo(linkId){
  location.href = 'alias_chat.html?link=' + encodeURIComponent(linkId);
}

/* ── 단축번호 판 ──────────────────────────────────────────────────
   아홉 칸을 **전부** 보여줍니다. 빈 칸이 곧 "여기에 넣으세요" 라는
   안내가 됩니다. 정해진 것만 보이면 이 기능이 있는 줄도 모릅니다. */
function bySpeed(){
  const map = {};
  rows.forEach(function(r){
    const n = ex(r).speed_dial;
    if (n) map[n] = r;
  });
  /* 🔴 2026-10-18 — 저장한 부름번호도 같은 아홉 칸을 씁니다 */
  book.forEach(function(b){ if (b.speed_dial && !map[b.speed_dial]) map[b.speed_dial] = { _book: b }; });
  return map;
}

function paintPad(){
  const map = bySpeed();
  let html = '';
  for (let n = 1; n <= 9; n++) {
    const r = map[n];
    html += '<button class="slot ' + (r ? 'set' : 'blank') + '" data-slot="' + n + '">' +
      '<span class="num">' + n + '</span>' +
      '<span class="who">' + AL.esc(r ? (r._book ? '🔢 ' + r._book.label : nameOf(r)) : AL.t('phEmptySlot')) + '</span>' +
    '</button>';
  }
  const pad = document.getElementById('pad');
  pad.innerHTML = html;
  pad.classList.toggle('editing', editing);
  paintDial();   // 🔴 2026-10-23 번호판의 숫자 밑 이름도 같이

  pad.querySelectorAll('[data-slot]').forEach(function(el){
    el.addEventListener('click', function(){
      const n = parseInt(el.getAttribute('data-slot'), 10);
      const r = map[n];
      /* 번호를 바꾸는 중에는 전화가 걸리면 안 됩니다.
         고치려다 엉뚱한 사람에게 거는 사고를 막습니다. */
      if (editing || !r) { openPicker(n, r); return; }
      if (r._book) { dialNo(r._book, 'voice'); return; }
      callTo(r.link_id);
    });
  });

  const eb = document.getElementById('editBtn');
  eb.textContent = editing ? AL.t('phEditOff') : AL.t('phEditOn');
  eb.classList.toggle('on', editing);
  document.getElementById('editHint').style.display = editing ? '' : 'none';
}

/* ── 명부 ─────────────────────────────────────────────────────────
   별표부터, 그다음 최근 순. 줄마다 ☏ 와 💬 가 바로 있습니다.
   ⋯ 를 거치지 않고 한 번에 끝냅니다. */
function visible(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = q ? rows.filter(function(r){
    return [r.peer_label, r.peer_display, r.room_name, r.my_face]
      .some(function(v){ return v && v.toLowerCase().indexOf(q) >= 0; });
  }) : rows.slice();

  return list.sort(function(a, b){
    const sa = ex(a).starred ? 0 : 1, sb = ex(b).starred ? 0 : 1;
    if (sa !== sb) return sa - sb;
    return String(b.last_activity_at || '').localeCompare(String(a.last_activity_at || ''));
  });
}

function paintList(){
  const box = document.getElementById('list');
  const q = document.getElementById('q').value.trim().toLowerCase();
  const bl = bookOnly().filter(function(b){
    return !q || b.label.toLowerCase().indexOf(q) >= 0 || b.number.indexOf(q.replace(/\D/g, '') || '@') >= 0;
  });
  if (!rows.length && !book.length) {
    box.innerHTML = '<div class="phnote">' + AL.esc(AL.t('phEmpty')) + '</div>';
    return;
  }
  const list = visible();
  if (!list.length && !bl.length) {
    box.innerHTML = '<div class="phnote">' + AL.esc(AL.t('phNoMatch')) + '</div>';
    return;
  }

  box.innerHTML = list.map(function(r){
    const e = ex(r);
    const room = isRoom(r);
    return '<div class="prow">' +
      /* 🔴🔴 2026-09-16 — 큰 것은 **상대**, 작은 것은 **나**.
         여기도 상대를 고르는 자리입니다. 상대 얼굴이 보여야 고릅니다.
         (연락처와 같은 이유 — 그쪽 주석을 읽어주세요) */
      '<div class="pav"' + AL.faceAttr(room ? (r.room_name || '') : (nameOf(r) || ''), room ? '30%' : '50%') +
        (!room && r.peer_avatar
          ? ' data-face="' + AL.esc(r.peer_avatar) + '"' : '') + '>' +
        AL.esc(room ? '👥' : AL.initial(nameOf(r))) + '</div>' +
      '<div class="pmid" data-go="' + AL.esc(r.link_id) + '">' +
        '<div class="pname">' +
          (e.speed_dial ? '<span class="spd">' + AL.esc(e.speed_dial) + '</span>' : '') +
          (e.starred ? '<span class="star">★</span>' : '') +
          AL.esc(nameOf(r)) +
        '</div>' +
        /* 🔴 2026-10-21 — 연락처와 같게: 이름 아래 내 별칭(작게) */
        (r.my_face ? '<div class="pmine">' + AL.esc(r.my_face) + '</div>' : '') +
        '<div class="psub">' + AL.esc(AL.fmtWhen(r.last_activity_at)) +
          (room ? ' · ' + AL.esc(AL.t('phRoomOnly')) : '') +
          (bookFor(r.link_id) ? ' · <span class="bnno">🔢 ' + AL.esc(fmtNo(bookFor(r.link_id).number)) + '</span>' : '') + '</div>' +
      '</div>' +
      /* 🔴 2026-10-21 — 내 별칭 그림은 단추 바로 앞, 늘 같은 자리 */
      (r.my_face
        ? '<span class="mymark" data-go="' + AL.esc(r.link_id) + '"' + AL.faceAttr(r.my_face || '', '50%') +
          (myFaces[r.my_face] ? ' data-face="' + AL.esc(myFaces[r.my_face]) + '"' : '') +
          ' title="' + AL.esc(r.my_face || '') + '">' + AL.esc(AL.initial(r.my_face)) + '</span>'
        : '') +
      '<button class="act call' + (room ? ' off' : '') + '" data-call="' + AL.esc(r.link_id) +
        '" aria-label="' + AL.esc(AL.t('ariaCall')) + '">☏</button>' +
      /* 🔴 2026-09-12 — 영상. 방은 1:1 영상이 안 되므로 흐리게 꺼둡니다. */
      '<button class="act' + (room ? ' off' : '') + '" data-vcall="' + AL.esc(r.link_id) +
        '" aria-label="' + AL.esc(AL.t('clVideoCall')) + '">📹</button>' +
      '<button class="act" data-msg="' + AL.esc(r.link_id) +
        '" aria-label="' + AL.esc(AL.t('ariaMsg')) + '">💬</button>' +
    '</div>';
  }).join('') + bl.map(function(b){
    /* 🔴 2026-10-18 — 부름번호로만 저장한 사람. 이름을 누르면 고치기 */
    return '<div class="prow">' +
      '<div class="pav bn">🔢</div>' +
      '<div class="pmid" data-bedit="' + b.number + '">' +
        '<div class="pname">' + (b.speed_dial ? '<span class="spd">' + b.speed_dial + '</span>' : '') + AL.esc(b.label) + '</div>' +
        '<div class="psub"><span class="bnno">' + AL.esc(fmtNo(b.number)) + '</span>' +
          (b.link_id ? '' : ' · <span class="wait">' + AL.esc(BT.wait) + '</span>') + '</div>' +
      '</div>' +
      '<button class="act call" data-bcall="' + b.number + '" aria-label="call">☏</button>' +
      '<button class="act" data-bvcall="' + b.number + '" aria-label="video">📹</button>' +
      '<button class="act" data-bmsg="' + b.number + '" aria-label="message">💬</button>' +
    '</div>';
  }).join('');

  const bk = function(n){ return book.filter(function(b){ return b.number === n; })[0]; };
  box.querySelectorAll('[data-bedit]').forEach(function(el){ el.addEventListener('click', function(){ openSave(bk(el.getAttribute('data-bedit'))); }); });
  box.querySelectorAll('[data-bcall]').forEach(function(el){ el.addEventListener('click', function(){ dialNo(bk(el.getAttribute('data-bcall')), 'voice'); }); });
  box.querySelectorAll('[data-bvcall]').forEach(function(el){ el.addEventListener('click', function(){ dialNo(bk(el.getAttribute('data-bvcall')), 'video'); }); });
  box.querySelectorAll('[data-bmsg]').forEach(function(el){ el.addEventListener('click', function(){ dialNo(bk(el.getAttribute('data-bmsg')), 'chat'); }); });

  AL.paintFaces(box);   // 🔴 2026-09-13

  box.querySelectorAll('[data-go]').forEach(function(el){
    el.addEventListener('click', function(){ chatTo(el.getAttribute('data-go')); });
  });
  box.querySelectorAll('[data-call]').forEach(function(el){
    el.addEventListener('click', function(){ callTo(el.getAttribute('data-call'), 'voice'); });
  });
  box.querySelectorAll('[data-vcall]').forEach(function(el){
    el.addEventListener('click', function(){ callTo(el.getAttribute('data-vcall'), 'video'); });
  });
  box.querySelectorAll('[data-msg]').forEach(function(el){
    el.addEventListener('click', function(){ chatTo(el.getAttribute('data-msg')); });
  });
}


/* =====================================================================
   🔴 2026-10-23 부름 번호판
   ===================================================================== */
const FIRST_KEY = 'burum_first_screen';          // 'dial' | 'contacts' (이 폰에만)
function firstPref(){ try { return localStorage.getItem(FIRST_KEY) || ''; } catch (e) { return ''; } }
const DIALMODE = (function(){
  const m = new URLSearchParams(location.search).get('mode');
  if (m === 'book') return false;
  return m === 'dial' || firstPref() === 'dial';
})();
const DT = KR ? {
  title: '부름 전화', disp: '부름번호 10자리 · 1~9 꾸욱 누르면 단축다이얼', v: '📞 음성', vv: '🎥 영상', m: '💬 문자',
  hint: '처음 거는 번호면 연결 요청이 먼저 가고, 상대가 수락하면 바로 연결됩니다. 긴급전화(112 · 119)는 폰의 전화 앱으로 거세요.',
  need: '부름번호 10자리를 눌러 주세요. (단축다이얼은 1~9를 꾸욱)', edit: '단축번호 바꾸기', editOn: '다 됐습니다 — 숫자를 눌러 사람을 넣으세요',
  save: '💾 이 번호 저장', mine: '🔢 내 부름번호', linking: '연결하는 중…', emptySlot: '번은 비어 있습니다. 누구를 넣을까요?'
} : {
  title: 'Burum phone', disp: '10-digit Burum number · hold 1–9 for speed dial', v: '📞 Voice', vv: '🎥 Video', m: '💬 Text',
  hint: 'A first call to a number sends a connection request; once accepted you are connected right away. For emergencies (112 · 119) use your phone app.',
  need: 'Enter all 10 digits. (Hold 1–9 for speed dial)', edit: 'Edit speed dial', editOn: 'Done — tap a digit to set it',
  save: '💾 Save this number', mine: '🔢 My Burum numbers', linking: 'Connecting…', emptySlot: ' is empty. Who goes there?'
};
let typed = '';
function dlSay(t){ document.getElementById('dlMsg').textContent = t || ''; }
function paintDisp(){
  const d = document.getElementById('dlDisp');
  d.innerHTML = (typed ? AL.esc(fmtNo(typed.length === 10 ? typed : typed.replace(/^(\d{4})(\d{0,3})(\d{0,3}).*$/, function(_, a, b, c){ return [a, b, c].filter(Boolean).join('-'); }))) : '&nbsp;') +
    '<small>' + AL.esc(DT.disp) + '</small>';
  document.getElementById('dlSave').style.display = typed.length === 10 ? '' : 'none';
}
function paintDial(){
  if (!DIALMODE) return;
  const map = bySpeed();
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  const pad = document.getElementById('dlPad');
  pad.innerHTML = keys.map(function(k){
    if (!k) return '<span class="dl-k blank"></span>';
    const r = /[1-9]/.test(k) ? map[+k] : null;
    const who = r ? (r._book ? r._book.label : nameOf(r)) : '';
    return '<button type="button" class="dl-k' + (editing && /[1-9]/.test(k) ? ' edit' : '') + '" data-k="' + k + '">' +
      '<span class="d">' + k + '</span>' + (who ? '<span class="w">' + AL.esc(who) + '</span>' : '') + '</button>';
  }).join('');
  const ed = document.getElementById('dlEdit');
  ed.textContent = editing ? DT.editOn : DT.edit; ed.classList.toggle('on', editing);
  pad.querySelectorAll('[data-k]').forEach(bindKey);
}
/* 짧게 = 숫자 넣기 · 꾸욱(0.6초, 번호 칸이 비어 있을 때 1~9) = 단축다이얼 */
function bindKey(el){
  const k = el.getAttribute('data-k');
  let timer = null, long = false;
  const start = function(){
    long = false; el.classList.add('press');
    if (!/[1-9]/.test(k) || typed || editing) return;
    timer = setTimeout(function(){
      long = true; el.classList.remove('press');
      try { navigator.vibrate && navigator.vibrate(35); } catch (e) {}
      speedGo(+k);
    }, 600);
  };
  const stop = function(){ clearTimeout(timer); el.classList.remove('press'); };
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', stop); el.addEventListener('pointerleave', stop); el.addEventListener('pointercancel', stop);
  el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  el.addEventListener('click', function(){
    if (long) { long = false; return; }
    if (editing && /[1-9]/.test(k)) { openPicker(+k, bySpeed()[+k]); return; }
    dlSay('');
    if (k === '⌫') typed = typed.slice(0, -1);
    else if (typed.length < 10 && !(typed === '' && k === '0')) typed += k;
    paintDisp();
  });
}
function speedGo(n){
  const r = bySpeed()[n];
  if (!r) { dlSay(n + (KR ? DT.emptySlot : DT.emptySlot)); openPicker(n, null); return; }
  dlSay(DT.linking);
  if (r._book) { dialNo(r._book, 'voice'); return; }
  callTo(r.link_id, 'voice');
}
async function dialTyped(kind){
  dlSay('');
  if (typed.length !== 10) { dlSay(DT.need); return; }
  /* 저장해 둔 번호이고 이미 이어진 사이면 바로 */
  const b = book.filter(function(x){ return x.number === typed; })[0];
  if (b && b.link_id) { if (kind === 'chat') return chatTo(b.link_id); return callTo(b.link_id, kind); }
  /* 문자는 부름번호 화면의 "메시지와 함께 연결 요청" 으로 (모르는 사이일 때 첫 인사를 함께 보냄) */
  if (kind === 'chat') {
    if (!await AL.requirePlan()) return;
    const r = await AL.sb.rpc('bn_dial', { p_number: typed, p_persona: null, p_note: null });
    const d = r.data || {};
    if (!r.error && d.ok && d.state === 'linked' && d.link_id) return chatTo(d.link_id);
    if (r.error || !d.ok) {
      if (d.error === 'need_plan') { AL.needPlan(); return; }
      dlSay(d.error === 'slow_down' ? BT.slow : d.error === 'own' ? BT.own : BT.notFound); return;
    }
    dlSay(d.again ? BT.again : BT.requested); return;
  }
  if (!await AL.requirePlan()) return;
  dlSay(DT.linking);
  const r = await AL.sb.rpc('bn_dial', { p_number: typed, p_persona: null, p_note: null });
  const d = r.data || {};
  if (r.error || !d.ok) {
    if (d.error === 'need_plan') { dlSay(''); AL.needPlan(); return; }
    dlSay(d.error === 'slow_down' ? BT.slow : d.error === 'own' ? BT.own : BT.notFound); return;
  }
  if (d.state === 'linked' && d.link_id) return callTo(d.link_id, kind);
  dlSay(d.again ? BT.again : BT.requested);
}
/* 🔴 2026-10-23 — 안드로이드 앱은 아이콘으로 켤 때 스스로 연락처 화면으로 옮깁니다(MainActivity 의 "아이콘마다 제 집으로").
   번호판을 첫 화면으로 고른 분은 그때 연락처가 번호판으로 다시 돌려보냅니다. 그 판단에 쓰는 표:
   · burum_dial_shown_at — 번호판이 화면에 보인 때
   · burum_user_tap      — 손님이 이 화면에서 무엇이든 누른 때(직접 [연락처로] 간 것은 돌려보내지 않게) */
function markDialShown(){ try { sessionStorage.setItem('burum_dial_shown_at', String(Date.now())); } catch (e) {} }
document.addEventListener('click', function(){ try { sessionStorage.setItem('burum_user_tap', String(Date.now())); } catch (e) {} }, true);
window.addEventListener('popstate', function(){ try { sessionStorage.setItem('burum_user_tap', String(Date.now())); } catch (e) {} });
function initDial(){
  if (!DIALMODE) return;
  markDialShown();
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') markDialShown(); });
  document.body.classList.add('dialmode');
  document.getElementById('phH').textContent = DT.title;
  document.getElementById('dlV').textContent = DT.v;
  document.getElementById('dlVV').textContent = DT.vv;
  document.getElementById('dlM').textContent = DT.m;
  document.getElementById('dlHint').textContent = DT.hint;
  document.getElementById('dlSave').textContent = DT.save;
  document.getElementById('dlMine').textContent = DT.mine;
  document.getElementById('dlV').onclick = function(){ dialTyped('voice'); };
  document.getElementById('dlVV').onclick = function(){ dialTyped('video'); };
  document.getElementById('dlM').onclick = function(){ dialTyped('chat'); };
  document.getElementById('dlSave').onclick = function(){ openSave(null, typed); };
  document.getElementById('dlEdit').onclick = function(){ editing = !editing; paintPad(); };
  const q = new URLSearchParams(location.search).get('dial');
  if (q) typed = q.replace(/\D/g, '').slice(0, 10);
  paintDisp(); paintDial();
  /* 첫 화면으로 아직 안 정했으면 작은 단추 하나 */
  if (firstPref() !== 'dial') {
    const pin = document.createElement('button');
    pin.type = 'button';
    pin.textContent = KR ? '📌 이 화면을 첫 화면으로' : '📌 Make this my first screen';
    pin.onclick = function(){ try { localStorage.setItem(FIRST_KEY, 'dial'); } catch (e) {} pin.remove(); info(KR ? '다음부터 로그인하면 이 번호판이 먼저 나옵니다. MyPage 에서 바꿀 수 있어요. (이 휴대폰에 저장 — 앱을 다시 설치하거나 휴대폰을 바꾸면 한 번 다시 정해 주세요)' : 'This dial pad will now open first after login. Change it in MyPage. (Saved on this phone — choose again after reinstalling or changing phones)'); };
    document.querySelector('.dl-row').appendChild(pin);
  }
}

/* ── 첫 화면 고르기 — 별칭을 만든 분께 한 번만 묻습니다. MyPage 에서 언제든 바꿀 수 있습니다 ── */
async function askFirst(){
  try { if (localStorage.getItem(FIRST_KEY)) return; } catch (e) { return; }
  let al = [];
  try { al = await AL.loadAliases(); } catch (e) { return; }
  if (!al || !al.length) return;           // 기초 설정(별칭)부터
  const box = document.getElementById('firstAsk');
  const A = KR ? { t: '📞 첫 화면을 부름 번호판으로 할까요?', p: '로그인하면 이 번호판(부름번호 · 단축다이얼 · 음성 · 영상 · 문자)이 먼저 나옵니다. 연락처는 아래에 그대로 있습니다. MyPage 에서 언제든 바꿀 수 있어요.', y: '번호판으로 할게요', n: '지금처럼 연락처로' }
                 : { t: '📞 Start with the Burum dial pad?', p: 'After you log in, this dial pad (Burum number · speed dial · voice · video · text) comes first, with your contacts below. You can change this any time in MyPage.', y: 'Yes, dial pad', n: 'Keep contacts first' };
  box.innerHTML = '<b>' + AL.esc(A.t) + '</b><p>' + AL.esc(A.p) + '</p><div class="bt"><button type="button" class="go" id="faY">' + AL.esc(A.y) + '</button><button type="button" id="faN">' + AL.esc(A.n) + '</button></div>';
  box.style.display = 'block';
  document.getElementById('faY').onclick = function(){ try { localStorage.setItem(FIRST_KEY, 'dial'); } catch (e) {} location.href = 'alias_phone.html?mode=dial'; };
  document.getElementById('faN').onclick = function(){ try { localStorage.setItem(FIRST_KEY, 'contacts'); } catch (e) {} box.style.display = 'none'; };
}

function paint(){ paintPad(); paintList(); }

/* ── 누구를 넣을지 고르기 ─────────────────────────────────────────
   빈 칸을 누르면 바로 여기가 열립니다. 연락처까지 가서 ⋯ 를 누를
   필요가 없습니다.
   ⚠ 방은 1:1 통화가 안 되므로 고르는 목록에 안 냅니다. */
function showPick(on){
  document.getElementById('pickbg').style.display = on ? 'block' : 'none';
  document.getElementById('pickbox').style.display = on ? 'block' : 'none';
}
document.getElementById('pickbg').addEventListener('click', function(){ showPick(false); });

function openPicker(n, cur){
  pickSlot = n;
  const pairs = rows.filter(function(r){ return !isRoom(r); });

  let html = '<div class="ttl">' + AL.esc(AL.t('phPickWho', { n: n })) + '</div>';
  if (!pairs.length) {
    html += '<div class="phnote">' + AL.esc(AL.t('phNoPair')) + '</div>';
  } else {
    html += pairs.map(function(r){
      const e = ex(r);
      const tag = e.speed_dial ? ' (' + e.speed_dial + ')' : '';
      return '<button data-pick="' + AL.esc(r.link_id) + '">' +
        AL.esc(nameOf(r)) + AL.esc(tag) + '</button>';
    }).join('');
  }
  const bo = bookOnly();
  if (bo.length) {
    html += '<div class="sep"></div><div class="ttl">' + AL.esc(BT.pickNo) + '</div>' + bo.map(function(b){
      return '<button data-pickbook="' + b.number + '">🔢 ' + AL.esc(b.label) + (b.speed_dial ? ' (' + b.speed_dial + ')' : '') + '</button>';
    }).join('');
  }
  if (cur) {
    html += '<div class="sep"></div>' +
      '<button class="warn" data-clear="1">' + AL.esc(AL.t('phClear')) + '</button>';
  }

  const box = document.getElementById('pickbox');
  box.innerHTML = html;
  box.scrollTop = 0;
  showPick(true);

  box.querySelectorAll('[data-pick]').forEach(function(el){
    el.addEventListener('click', function(){ setSpeed(el.getAttribute('data-pick')); });
  });
  box.querySelectorAll('[data-pickbook]').forEach(function(el){
    el.addEventListener('click', function(){ setSpeed(null, el.getAttribute('data-pickbook')); });
  });
  box.querySelectorAll('[data-clear]').forEach(function(el){
    el.addEventListener('click', function(){ setSpeed(null); });
  });
}

async function setSpeed(linkId, bookNo){
  const n = pickSlot;
  try {
    const map = bySpeed();
    const cur = map[n];                                   // 지금 이 번호를 쓰는 사람

    /* 🔴 2026-10-18 — 저장한 부름번호에 주기: 서버가 그 칸을 쓰던 연락처를 비웁니다 */
    if (bookNo) {
      const b = book.filter(function(x){ return x.number === bookNo; })[0];
      const r = await AL.sb.rpc('bn_book_save', { p_number: bookNo, p_label: b ? b.label : '', p_speed: n });
      if (r.error || !(r.data || {}).ok) throw (r.error || new Error((r.data || {}).error || 'save'));
      showPick(false); await reload(); return;
    }
    /* 칸을 저장한 번호가 쓰고 있었으면 그 번호의 칸을 비웁니다 */
    if (cur && cur._book) {
      const r = await AL.sb.rpc('bn_book_save', { p_number: cur._book.number, p_label: cur._book.label, p_speed: null });
      if (r.error) throw r.error;
    }

    /* ⚠ 한 사람이 같은 번호를 둘 가질 수 없게 DB 에 막아뒀습니다.
       그러니 쓰던 사람을 **먼저 비우고** 나서 넣어야 합니다.
       순서를 바꾸면 "이미 있다" 는 오류가 납니다. */
    if (cur && !cur._book) {
      const c = await AL.sb.from('link_sides')
        .update({ speed_dial: null }).eq('id', cur.my_side_id).select('id');
      if (c.error) throw c.error;
    }

    if (linkId) {
      const r = rows.filter(function(x){ return x.link_id === linkId; })[0];
      if (r) {
        /* 그 사람이 다른 번호를 갖고 있었으면 그건 비워집니다. 한 사람에 한 번호. */
        try { await AL.sb.rpc('bn_book_free_slot', { p_speed: n }); } catch (e) {}
        const u = await AL.sb.from('link_sides')
          .update({ speed_dial: n }).eq('id', r.my_side_id).select('id');
        if (u.error) throw u.error;
        if (!u.data || !u.data.length) throw new Error(AL.t('errNoRows'));
      }
    }

    showPick(false);
    await reload();
  } catch (e) {
    console.error(e);
    showPick(false);
    showErr(AL.t('errGeneric', { msg: e.message || String(e) }));
  }
}

/* ── 부름번호 저장 · 고치기 창 ───────────────────────────────────── */
function openSave(b, preset){
  const isNew = !b;
  b = b || { number: preset || '', label: '', speed_dial: null };
  let opts = '<option value="">' + AL.esc(BT.none) + '</option>';
  for (let i = 1; i <= 9; i++) opts += '<option value="' + i + '"' + (b.speed_dial === i ? ' selected' : '') + '>' + i + '</option>';
  const box = document.getElementById('pickbox');
  box.innerHTML = '<div class="ttl">' + AL.esc(isNew ? BT.add : BT.edit) + '</div><div class="frm">' +
    '<label>' + AL.esc(BT.no) + '</label><input id="fNo" type="tel" inputmode="numeric" maxlength="12" value="' + AL.esc(fmtNo(b.number)) + '"' + (isNew ? '' : ' readonly') + '>' +
    '<label>' + AL.esc(BT.name) + '</label><input id="fName" maxlength="30" value="' + AL.esc(b.label) + '">' +
    '<label>' + AL.esc(BT.slot) + '</label><select id="fSlot">' + opts + '</select>' +
    '<button class="go" id="fGo">' + AL.esc(BT.ok) + '</button><div class="msg" id="fMsg"></div></div>' +
    (isNew ? '' : '<div class="sep"></div><button class="warn" id="fDel">' + AL.esc(BT.del) + '</button>');
  box.scrollTop = 0; showPick(true);
  document.getElementById('fGo').onclick = async function(){
    const no = document.getElementById('fNo').value.replace(/\D/g, '');
    if (!/^[1-9][0-9]{9}$/.test(no)) { document.getElementById('fMsg').textContent = BT.needNo; return; }
    const sl = document.getElementById('fSlot').value;
    const r = await AL.sb.rpc('bn_book_save', { p_number: no, p_label: document.getElementById('fName').value, p_speed: sl ? parseInt(sl, 10) : null });
    if (r.error || !(r.data || {}).ok) { document.getElementById('fMsg').textContent = r.error ? BT.noSql : BT.needNo; return; }
    showPick(false); await reload();
  };
  const del = document.getElementById('fDel');
  if (del) del.onclick = async function(){
    if (!confirm(BT.delAsk)) return;
    await AL.sb.rpc('bn_book_delete', { p_number: b.number }); showPick(false); await reload();
  };
}

/* ── 읽어오기 ───────────────────────────────────────────────────── */
async function reload(){
  try {
    const res = await AL.sb.rpc('my_contacts');
    if (res.error) throw res.error;
    rows = res.data || [];

    /* 별표·단축번호는 link_sides 에서 따로 읽습니다.
       my_contacts 함수를 안 건드리려는 것입니다. 연락처 화면과 같은 방식입니다.
       ⚠ 못 읽어도 명부는 그려야 합니다. 번호만 안 보일 뿐입니다. */
    try {
      const e2 = await AL.sb.from('link_sides')
        .select('id, starred, speed_dial, pin_order');
      if (!e2.error) {
        extra = {};
        (e2.data || []).forEach(function(x){ extra[x.id] = x; });
      } else {
        console.warn('[phone] 별표를 못 읽었습니다', e2.error);
      }
    } catch (e) { console.warn('[phone] 별표를 못 읽었습니다', e); }

    myFaces = await AL.myFaceMap();   // 🔴 2026-09-13

    /* 🔴 2026-10-18 — 저장한 부름번호. 못 읽어도 연락처는 그립니다 */
    try { const bb = await AL.sb.rpc('bn_book'); book = bb.error ? [] : (bb.data || []); } catch (e) { book = []; }

    paint();
  } catch (e) {
    console.error(e);
    showErr(AL.t('errGeneric', { msg: e.message || String(e) }));
  }
}

document.getElementById('q').addEventListener('input', paintList);
document.getElementById('editBtn').addEventListener('click', function(){
  editing = !editing;
  paintPad();
});

/* 🔴 2026-09-12 — 안내 화면으로 가는 줄. 글씨를 여기서 넣습니다. */
document.getElementById('setupLink').textContent =
  (AL.lang === 'kr') ? '전화가 안 울리나요?' : "Phone not ringing?";

(async function(){
  AL.paintText();
  document.getElementById('phH').textContent = BT.title;
  document.getElementById('bnSave').textContent = BT.save;
  document.getElementById('bnLink').textContent = BT.num;
  document.getElementById('bnSave').addEventListener('click', function(){ openSave(null); });
  initDial();   // 🔴 2026-10-23
  /* 🔴 2026-09-18 — 폰의 ◁ 를 누르면 앱이 나가지 않고 돌아갑니다. */
  AL.setBack('alias_contacts.html');
  if (!await AL.requireLogin()) return;
  await reload();
  /* 부름번호 다이얼에서 [저장] 으로 온 경우 (alias_phone.html?save=4829051317) */
  const sv = new URLSearchParams(location.search).get('save');
  if (sv) { const ex0 = book.filter(function(b){ return b.number === sv; })[0]; openSave(ex0 || null, ex0 ? '' : sv); }

  AL.showPlanBar();   // 🔴 2026-09-14
  AL.showPushBar();   // 🔴 2026-09-15 — 전화를 못 받는 상태면 알립니다

  AL.startAlerts({
    onMessage: function(){ reload(); return false; },   // 소리는 공용이 냅니다
    onPoll: function(){ reload(); },
    pollMs: 15000,
  });

  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') reload();
  });

  /* 어느 화면에 있든 걸려온 전화를 받습니다.
     ⚠ 이 화면이 첫 화면이 될 수 있으므로 여기에도 꼭 있어야 합니다. */
  AL.watchIncoming(function(c){
    AL.alertNew();
    location.href = 'alias_call.html?call=' + encodeURIComponent(c.call_id) +
      '&token=' + encodeURIComponent(c.session_token) +
      '&link=' + encodeURIComponent(c.link_id) +
      '&type=' + encodeURIComponent(c.call_type) +
      '&once=' + encodeURIComponent(c.call_id);
  });
})();
</script>
