<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>부름번호 회사 보유분</title>
<script src="alias_config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="alias_common.js"></script>
<style>
/* 🔴 2026-10-19 — 회사 보유 좋은 번호(플래티넘 · 골드 · 실버 각 1,002개)를 가입자에게 부여 · 회수하는 관리자 화면 */
:root{ --bg:#F4F6F8; --card:#FFFFFF; --ink:#16212E; --soft:#5A6878; --line:#DDE3EA; --acc:#2F5E92; --tint:#EEF3FA; --bad:#B4412F; --ok:#2E7D4F; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif; }
header{ background:var(--acc); color:#fff; padding:16px 20px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
header h1{ margin:0; font-size:19px; }
header a{ color:#fff; font-size:13px; margin-left:auto; }
main{ max-width:1000px; margin:0 auto; padding:18px 16px 60px; }
.bar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
.bar button{ border:1px solid var(--line); background:var(--card); border-radius:999px; padding:8px 14px; font-size:13.5px; font-weight:600; cursor:pointer; color:var(--ink); }
.bar button.on{ background:var(--acc); color:#fff; border-color:var(--acc); }
.bar input{ border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; font-size:14px; width:150px; }
.sum{ font-size:13px; color:var(--soft); margin:0 0 10px; }
section{ overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:6px 10px; }
table{ width:100%; border-collapse:collapse; font-size:14px; }
th, td{ padding:10px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
th{ font-size:12.5px; color:var(--soft); font-weight:700; white-space:nowrap; }
td{ word-break:keep-all; } .g, td button, .st-free, .st-given{ white-space:nowrap; }
td.n{ font-weight:800; font-size:15px; letter-spacing:.5px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.g{ display:inline-block; font-size:11px; font-weight:800; padding:2px 8px; border-radius:999px; }
.g.platinum{ background:#DDE3F7; color:#1b2240; } .g.gold{ background:#F4E3B5; color:#4a3505; } .g.silver{ background:#E3E7EC; color:#26303b; }
.st-free{ color:var(--ok); font-weight:700; } .st-given{ color:var(--acc); font-weight:700; }
td button{ border:none; border-radius:8px; padding:7px 12px; font-size:13px; font-weight:700; cursor:pointer; }
.give{ background:var(--acc); color:#fff; } .back{ background:#FBE9E6; color:var(--bad); }
.more{ display:block; margin:12px auto; border:1px solid var(--line); background:var(--card); border-radius:10px; padding:10px 18px; cursor:pointer; font-weight:600; }
.err{ background:#FDECEA; color:var(--bad); border-radius:10px; padding:12px 14px; margin-bottom:14px; display:none; font-size:13.5px; }
#dlgBg{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); }
#dlg{ display:none; position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:min(400px,92vw); background:#fff; border-radius:16px; padding:20px; box-shadow:0 18px 44px rgba(0,0,0,.3); }
#dlg h3{ margin:0 0 6px; font-size:17px; } #dlg .num{ font-size:22px; font-weight:800; margin:4px 0 12px; }
#dlg label{ display:block; font-size:12.5px; color:var(--soft); margin:10px 0 5px; }
#dlg input[type=text]{ width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 12px; font:inherit; }
#dlg .row{ display:flex; gap:8px; margin-top:16px; } #dlg .row button{ flex:1; border:none; border-radius:10px; padding:12px; font-weight:700; cursor:pointer; }
#dlg .msg{ min-height:1.2em; margin-top:8px; font-size:13px; color:var(--bad); }
</style>
</head>
<body>
<header>
  <h1>🔢 부름번호 회사 보유분</h1>
  <a href="burum_admin_stats.html">← 일일 통계</a>
</header>
<main>
  <div class="err" id="err"></div>
  <div class="bar" id="grades">
    <button type="button" data-g="" class="on">전체</button>
    <button type="button" data-g="platinum">플래티넘</button>
    <button type="button" data-g="gold">골드</button>
    <button type="button" data-g="silver">실버</button>
  </div>
  <div class="bar" id="states">
    <button type="button" data-s="" class="on">모두</button>
    <button type="button" data-s="free">부여 전 (보유 중)</button>
    <button type="button" data-s="given">부여함</button>
    <input id="q" type="tel" inputmode="numeric" placeholder="숫자로 찾기 (예: 7777)">
  </div>
  <p class="sum" id="sum"></p>
  <section>
    <table>
      <thead><tr><th>순위</th><th>번호 · 등급</th><th>상태</th><th></th></tr></thead>
      <tbody id="list"><tr><td colspan="4">불러오는 중…</td></tr></tbody>
    </table>
  </section>
  <button type="button" class="more" id="more" style="display:none">더 보기</button>
  <p class="sum">보유분은 일반 판매에서 빠져 있고, "좋은 번호" 목록에는 몇 개씩 SOLD OUT 으로 보입니다.
     부여하면 그 가입자의 "내 번호"에 바로 생깁니다. "영구 보관"이면 이용권이 끝나도 번호가 쉬지 않습니다.</p>
</main>

<div id="dlgBg"></div>
<div id="dlg">
  <h3>가입자에게 부여</h3>
  <div class="num" id="dNum"></div>
  <label>받을 가입자의 로그인 닉네임</label>
  <input type="text" id="dNick" autocomplete="off" placeholder="예: 방장">
  <label>메모 (선택 — 왜 드렸는지)</label>
  <input type="text" id="dNote" autocomplete="off" placeholder="예: 협력사 대표 · 이벤트 당첨">
  <label style="display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px"><input type="checkbox" id="dForever" checked> 영구 보관 (이용권이 끝나도 번호 유지)</label>
  <div class="row"><button type="button" id="dCancel" style="background:#EEF1F4">취소</button><button type="button" id="dGo" style="background:var(--acc);color:#fff">부여하기</button></div>
  <div class="msg" id="dMsg"></div>
</div>

<script>
const el = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const GN = { platinum: '플래티넘', gold: '골드', silver: '실버' };
const ERR = { not_reserved: '보유분 번호가 아닙니다.', already_given: '이미 다른 분께 부여된 번호입니다.', no_user: '그 닉네임으로 가입한 분이 없습니다. 닉네임을 다시 확인해 주세요.' };
let grade = '', state = '', offset = 0, cur = null;
function showErr(t){ el('err').textContent = t; el('err').style.display = t ? 'block' : 'none'; }
function nick(x){ try { return decodeURIComponent(x || ''); } catch (e) { return x || ''; } }

async function load(reset){
  if (reset) { offset = 0; el('list').innerHTML = '<tr><td colspan="4">불러오는 중…</td></tr>'; }
  const { data, error } = await AL.sb.rpc('admin_reserved_list', { p_grade: grade || null, p_q: el('q').value || null, p_state: state || null, p_limit: 100, p_offset: offset });
  if (error) { showErr(/not_admin/.test(error.message || '') ? '관리자 권한이 없는 계정입니다.' : '불러오지 못했습니다: ' + (error.message || error)); el('list').innerHTML = ''; return; }
  showErr('');
  const rows = (data || []).map((r) => '<tr><td>' + r.rank + '</td><td class="n">' + esc(r.shown) + '<br><span class="g ' + r.grade + '">' + GN[r.grade] + '</span></td>' +
    (r.assigned_to
      ? '<td><span class="st-given">부여함</span> · ' + esc(nick(r.nickname)) + '<br><small style="color:var(--soft)">' + esc(String(r.assigned_at || '').slice(0, 10)) + (r.note ? ' · ' + esc(r.note) : '') + '</small></td><td><button class="back" data-back="' + r.number + '" data-shown="' + esc(r.shown) + '">회수</button></td>'
      : '<td><span class="st-free">보유 중</span></td><td><button class="give" data-give="' + r.number + '" data-shown="' + esc(r.shown) + '">부여</button></td>') + '</tr>').join('');
  const total = (data && data[0]) ? Number(data[0].total) : 0;
  el('list').innerHTML = reset ? (rows || '<tr><td colspan="4">해당하는 번호가 없습니다.</td></tr>') : el('list').innerHTML + rows;
  offset += (data || []).length;
  el('sum').textContent = '조건에 맞는 번호 ' + total.toLocaleString() + '개 중 ' + offset.toLocaleString() + '개 표시';
  el('more').style.display = offset < total ? 'block' : 'none';
}

function openDlg(number, shown){
  cur = number; el('dNum').textContent = shown; el('dNick').value = ''; el('dNote').value = ''; el('dForever').checked = true; el('dMsg').textContent = '';
  el('dlgBg').style.display = el('dlg').style.display = 'block'; el('dNick').focus();
}
function closeDlg(){ el('dlgBg').style.display = el('dlg').style.display = 'none'; cur = null; }

el('list').addEventListener('click', async (e) => {
  const g = e.target.closest('[data-give]'), b = e.target.closest('[data-back]');
  if (g) openDlg(g.dataset.give, g.dataset.shown);
  if (b) {
    if (!confirm(b.dataset.shown + ' 번호를 회수할까요?\n가입자의 "내 번호"에서 바로 사라지고 다시 보유분이 됩니다.')) return;
    const { data, error } = await AL.sb.rpc('admin_reserved_revoke', { p_number: b.dataset.back });
    if (error || !(data || {}).ok) { alert('회수하지 못했습니다: ' + (error ? error.message : (ERR[data.error] || data.error))); return; }
    load(true);
  }
});
el('dCancel').onclick = closeDlg; el('dlgBg').onclick = closeDlg;
el('dGo').onclick = async () => {
  const n = el('dNick').value.trim();
  if (!n) { el('dMsg').textContent = '닉네임을 넣어 주세요.'; return; }
  el('dGo').disabled = true;
  const { data, error } = await AL.sb.rpc('admin_reserved_assign', { p_number: cur, p_email: AL.nicknameToEmail(n), p_note: el('dNote').value, p_forever: el('dForever').checked });
  el('dGo').disabled = false;
  if (error || !(data || {}).ok) { el('dMsg').textContent = error ? error.message : (ERR[data.error] || data.error); return; }
  closeDlg(); alert(data.shown + ' 번호를 ' + n + ' 님께 부여했습니다.'); load(true);
};
el('grades').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; grade = b.dataset.g; el('grades').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); load(true); };
el('states').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; state = b.dataset.s; el('states').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); load(true); };
let t; el('q').oninput = () => { clearTimeout(t); t = setTimeout(() => load(true), 350); };
el('more').onclick = () => load(false);

(async function(){
  if (!window.AL || !AL.sb) { showErr('alias_common.js 를 읽지 못했습니다.'); return; }
  const { data: { session } } = await AL.sb.auth.getSession();
  if (!session) { location.href = 'alias_auth.html?next=' + encodeURIComponent('burum_admin_numbers.html'); return; }
  load(true);
})();
</script>
</body>
</html>
