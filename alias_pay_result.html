<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alias</title>
<link rel="stylesheet" href="alias_common.css?v=20260917e">
<link rel="stylesheet" href="alias_theme.css?v=20260917e">
<script src="alias_config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="alias_common.js?v=20260917e"></script>
<script>
document.addEventListener("DOMContentLoaded", function(){
  if (typeof AL === "undefined" || typeof AL.t !== "function") {
    document.body.innerHTML =
      '<div style="padding:26px;font-family:system-ui,sans-serif;line-height:1.8;' +
      'color:#DDE5F0;background:#0E1621;min-height:100vh">' +
      '<b style="font-size:17px">alias_common.js 를 못 읽었습니다.</b></div>';
    return;
  }
  AL.bootTheme();
});
</script>

<style>
/* 🔴 2026-09-14 신설 — 결제 결과 */
.rwrap{padding:60px 22px;max-width:460px;margin:0 auto;text-align:center}
.rmark{font-size:56px;line-height:1;margin:0 0 18px}
.rttl{font-size:23px;font-weight:800;margin:0 0 12px;line-height:1.4}
.rsub{font-size:15px;line-height:1.8;color:#94A3B8;margin:0 0 8px}
.runtil{margin:20px 0 0;padding:15px 18px;border-radius:14px;font-size:15.5px;
  font-weight:700;line-height:1.7;word-break:keep-all;
  background:rgba(143,227,176,.15);color:#8FE3B0;
  border:1px solid rgba(143,227,176,.38)}
.rmsg{margin:18px 0 0;padding:13px 16px;border-radius:12px;font-size:13.5px;
  line-height:1.7;background:rgba(255,90,90,.13);color:#FFB4B4}
.rbtns{display:flex;flex-direction:column;gap:11px;margin-top:32px}
.rbtns a{display:block;padding:16px 0;border-radius:14px;font-size:16px;font-weight:800;
  text-decoration:none;background:rgba(255,255,255,.08);color:#DDE5F0;
  border:1px solid rgba(255,255,255,.18)}
.rbtns a.main{background:rgba(143,227,176,.2);color:#8FE3B0;
  border-color:rgba(143,227,176,.45)}
.rorder{margin-top:26px;font-size:11.5px;color:#5C6B7E;word-break:break-all}
</style>
</head>

<body data-t-title="plResultTitle">
<div class="rwrap">
  <div class="rmark" id="mark"></div>
  <h1 class="rttl" id="ttl"></h1>
  <p class="rsub" id="sub"></p>
  <div class="runtil" id="until" style="display:none"></div>
  <div class="rmsg" id="msg" style="display:none"></div>

  <div class="rbtns">
    <a class="main" href="alias_contacts.html" id="go"></a>
    <a href="alias_buy.html" id="again" style="display:none"></a>
  </div>

  <div class="rorder" id="order"></div>
</div>

<script>
/* =====================================================================
   결제 결과
   2026-09-14

   ⚠ 이 화면은 **알리기만** 합니다. 기한을 늘리는 일은 서버(Edge Function)가
     이미 끝냈습니다. 화면이 늘리면 새로고침할 때마다 늘어납니다.

   ⚠ 성공했으면 my_plan() 을 **다시 읽어** 언제까지인지 보여줍니다.
     "결제됐습니다" 만으로는 손님이 못 믿습니다. 날짜가 보여야 안심합니다.
   ===================================================================== */
const P = new URLSearchParams(location.search);
const status  = P.get('status') || 'fail';
const orderId = P.get('orderId') || '';
const rawMsg  = P.get('msg') || '';

function el(id){ return document.getElementById(id); }

(async function(){
  AL.paintText();
  el('go').textContent = AL.t('plGoHome');
  el('again').textContent = AL.t('plTryAgain');
  if (orderId) el('order').textContent = AL.t('plOrderNo', { id: orderId });

  if (status !== 'success') {
    el('mark').textContent = '✕';
    el('ttl').textContent = AL.t('plFailTtl');
    el('sub').textContent = AL.t('plFailSub');
    if (rawMsg) { el('msg').style.display = ''; el('msg').textContent = rawMsg; }
    el('again').style.display = '';
    return;
  }

  el('mark').textContent = '✓';
  el('ttl').textContent = AL.t('plOkTtl');
  el('sub').textContent = AL.t('plOkSub');

  /* 서버가 기한을 늘렸는지 확인해서 날짜를 보여줍니다.
     ⚠ 이니시스 착지 함수가 방금 돌았을 수 있어 잠깐 기다렸다 읽습니다. */
  if (!await AL.requireLogin()) return;
  for (let i = 0; i < 3; i++) {
    const p = await AL.myPlan(true);
    if (p && p.state === 'paid') {
      el('until').style.display = '';
      el('until').textContent = AL.t('plUntil', { when: AL.fmtDate(p.until) });
      return;
    }
    await new Promise(function(r){ setTimeout(r, 1500); });
  }

  /* 세 번 봐도 안 늘어났으면 알려드립니다. 조용히 넘어가면 손님이
     돈만 내고 못 쓰는 줄도 모릅니다. */
  el('msg').style.display = '';
  el('msg').textContent = AL.t('plSlow');
})();
</script>
</body>
</html>
