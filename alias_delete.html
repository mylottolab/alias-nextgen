<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>부름</title>
<link rel="stylesheet" href="alias_common.css?v=20260922d">
<link rel="stylesheet" href="alias_theme.css?v=20260922d">
<script src="alias_config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="alias_common.js?v=20260922d"></script>
<script>
document.addEventListener("DOMContentLoaded", function(){
  if (typeof AL === "undefined" || typeof AL.t !== "function") {
    document.body.innerHTML =
      '<div style="padding:26px;font-family:system-ui,sans-serif;line-height:1.8;' +
      'color:#DDE5F0;background:#0E1621;min-height:100vh">' +
      '<b style="font-size:17px">alias_common.js 를 못 읽었습니다.</b></div>';
    return;
  }
  AL.bootTheme();
});
</script>

<style>
/* =====================================================================
   🔴 2026-09-22 신설 — 계정 삭제

   ⚠ 앱과 웹이 이 화면 하나를 같이 씁니다. 구글은 **앱을 지운 사람도**
     삭제를 요청할 수 있는 웹 주소를 요구하는데, 이 화면 주소가 그것입니다.

   ⚠ 겁주지 않되 분명하게 씁니다. 무엇이 사라지고 무엇이 남는지를
     먼저 보여주고, 그다음에 단추를 둡니다.
   ===================================================================== */
.dwrap{padding:18px 16px 60px;max-width:560px;margin:0 auto}
.dhead{font-size:22px;font-weight:800;margin:0 0 8px}
.dsub{font-size:14px;line-height:1.75;opacity:.75;margin:0 0 20px;word-break:keep-all}

.dbox{padding:15px 16px;border-radius:14px;margin:0 0 12px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12)}
.dbox h3{margin:0 0 9px;font-size:14.5px;font-weight:800}
.dbox ul{margin:0;padding-left:19px;font-size:13.5px;line-height:1.9;
  word-break:keep-all}
.dbox.gone h3{color:#FFB4B4}
.dbox.stay h3{color:#8FE3B0}

.dfield{margin:20px 0 0}
.dfield label{display:block;font-size:13.5px;line-height:1.7;margin:0 0 8px;
  word-break:keep-all}
.dfield input{width:100%;box-sizing:border-box;padding:13px 14px;border-radius:12px;
  font-size:16px;background:rgba(255,255,255,.06);color:inherit;
  border:1px solid rgba(255,255,255,.16)}

.dbtn{width:100%;margin:16px 0 0;padding:16px 0;border-radius:14px;cursor:pointer;
  font-size:15.5px;font-weight:800;border:1px solid}
.dbtn.bad{background:rgba(255,90,90,.15);color:#FFB4B4;border-color:rgba(255,90,90,.45)}
.dbtn.good{background:rgba(143,227,176,.2);color:#8FE3B0;border-color:rgba(143,227,176,.45)}
.dbtn:disabled{opacity:.4;cursor:default}

.dwait{padding:18px 16px;border-radius:14px;margin:0 0 14px;
  background:rgba(242,201,76,.14);color:#F2C94C;border:1px solid rgba(242,201,76,.4);
  font-size:14.5px;line-height:1.8;word-break:keep-all}
.dwait b{font-size:16px}

.err{display:none;margin:14px 0 0;padding:12px 14px;border-radius:11px;
  background:rgba(255,90,90,.14);color:#FFB4B4;font-size:13.5px;line-height:1.6}
.err.show{display:block}
.back{display:inline-block;margin:0 0 12px;font-size:14px;color:#94A3B8;
  text-decoration:none}
</style>
</head>

<body>
<div class="dwrap">
  <a class="back" href="alias_me.html" id="back"></a>
  <h1 class="dhead" data-t="dlTitle"></h1>

  <!-- 이미 신청한 경우 -->
  <div id="waiting" style="display:none">
    <div class="dwait" id="waitText"></div>
    <button class="dbtn good" id="cancelBtn" data-t="dlCancel"></button>
  </div>

  <!-- 아직 신청 전 -->
  <div id="form" style="display:none">
    <p class="dsub" data-t="dlSub"></p>

    <div class="dbox gone">
      <h3 data-t="dlGoneTtl"></h3>
      <ul>
        <li data-t="dlGone1"></li>
        <li data-t="dlGone2"></li>
        <li data-t="dlGone3"></li>
        <li data-t="dlGone4"></li>
      </ul>
    </div>

    <div class="dbox stay">
      <h3 data-t="dlStayTtl"></h3>
      <ul>
        <li data-t="dlStay1"></li>
        <li data-t="dlStay2"></li>
      </ul>
    </div>

    <div class="dfield">
      <label id="typeLabel"></label>
      <input id="typed" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <button class="dbtn bad" id="goBtn" data-t="dlGo" disabled></button>
  </div>

  <div id="err" class="err"></div>
</div>

<script>
/* =====================================================================
   계정 삭제
   2026-09-22

   ⚠ 곧바로 지우지 않습니다. 7일 뒤 새벽 청소 때 지웁니다(alias-sweep).
     그 사이 [삭제 취소] 를 누르면 아무 일 없던 것처럼 돌아옵니다.

   ⚠ 확인으로 **닉네임을 직접 적게** 합니다. 단추 한 번으로 모든 것이
     사라지면 안 됩니다.
   ===================================================================== */
function el(id){ return document.getElementById(id); }
function showErr(m){ const e = el('err'); e.textContent = m; e.classList.add('show'); }
function clearErr(){ el('err').classList.remove('show'); }

let myNick = '';

async function load(){
  clearErr();
  const res = await AL.sb.from('account_deletions')
    .select('purge_at').maybeSingle();

  if (res.data && res.data.purge_at) {
    el('form').style.display = 'none';
    el('waiting').style.display = '';
    el('waitText').innerHTML = AL.esc(AL.t('dlWaiting', { when: AL.fmtDate(res.data.purge_at) }))
      .replace(/\n/g, '<br>');
  } else {
    el('waiting').style.display = 'none';
    el('form').style.display = '';
  }
}

el('typed').addEventListener('input', function(){
  el('goBtn').disabled = (this.value.trim() !== myNick);
});

el('goBtn').addEventListener('click', async function(){
  if (el('typed').value.trim() !== myNick) return;
  if (!confirm(AL.t('dlAsk'))) return;
  this.disabled = true;
  clearErr();
  try {
    const r = await AL.sb.rpc('request_account_deletion');
    if (r.error) throw r.error;
    await load();
    window.scrollTo(0, 0);
  } catch (e) {
    showErr(AL.t('errGeneric', { msg: e.message || String(e) }));
    this.disabled = false;
  }
});

el('cancelBtn').addEventListener('click', async function(){
  this.disabled = true;
  clearErr();
  try {
    const r = await AL.sb.rpc('cancel_account_deletion');
    if (r.error) throw r.error;
    alert(AL.t('dlCancelled'));
    location.replace('alias_me.html');
  } catch (e) {
    showErr(AL.t('errGeneric', { msg: e.message || String(e) }));
    this.disabled = false;
  }
});

(async function(){
  AL.paintText();
  el('back').textContent = '‹ ' + AL.t('navMe');
  AL.setBack('alias_me.html');
  if (!await AL.requireLogin()) return;

  /* 닉네임은 로그인 주소 앞부분입니다 (nick@u.alias.internal). */
  try {
    const s = await AL.sb.auth.getSession();
    const email = (s.data.session && s.data.session.user.email) || '';
    myNick = email.split('@')[0];
  } catch (e) {}
  el('typeLabel').textContent = AL.t('dlType', { nick: myNick });

  await load();
})();
</script>
</body>
</html>
