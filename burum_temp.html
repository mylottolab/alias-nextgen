const link = (tok) => 'https://burum.kr/burum_t.html?t=' + encodeURIComponent(tok);
const alive = (c) => !c.ended_at && new Date(c.expires_at) > new Date();
function toast(m){ const t = el('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 3200); }
function leftText(c){
  if (!alive(c)) return T('ended');
  const ms = new Date(c.expires_at) - new Date();
  return ms < 86400000 ? T('leftH', { n: Math.max(1, Math.ceil(ms / 3600000)) }) : T('left', { n: Math.ceil(ms / 86400000), d: fmtD(c.expires_at) });
}
function paintText(){
  document.querySelectorAll('[data-x]').forEach((n) => { n.textContent = T(n.dataset.x); });
  el('label').placeholder = T('phLabel');
  document.querySelectorAll('#days .tmp-pill').forEach((b) => { b.textContent = T('d', { n: b.dataset.d }); });
}
function show(v){ ['vList', 'vNew', 'vOne'].forEach((x) => el(x).classList.toggle('show', x === v)); window.scrollTo(0, 0); }

let cards = [], cur = null, days = 7, single = true, face = null;

async function loadCards(){ const r = await AL.sb.rpc('my_temp_cards'); if (r.error) throw r.error; cards = r.data || []; }

function paintList(){
  if (!cards.length) { el('list').innerHTML = '<div class="tmp-empty" style="white-space:pre-line">' + esc(T('empty')) + '</div>'; return; }
  el('list').innerHTML = cards.map((c, i) => {
    const pct = alive(c) ? Math.max(3, Math.min(100, Math.round((new Date(c.expires_at) - new Date()) / (new Date(c.expires_at) - new Date(c.created_at)) * 100))) : 100;
    return '<button type="button" class="tmp-row' + (alive(c) ? '' : ' dead') + '" data-i="' + i + '"><div class="t"><span class="n">' + esc(c.label || T('noLabel')) + '</span>' +
      (c.unread ? '<span class="tmp-badge">' + c.unread + '</span>' : '') + '<span class="c">' + esc(fmtCode(c.code)) + '</span></div>' +
      '<div class="m">' + esc((c.single_person ? T('one') : T('many')) + ' · ' + T('people', { n: c.people || 0 }) + ' · ' + leftText(c)) + '</div>' +
      '<div class="tmp-bar"><i style="width:' + pct + '%"></i></div></button>';
  }).join('');
}
el('list').addEventListener('click', (e) => { const b = e.target.closest('.tmp-row'); if (!b) return; const c = cards[+b.dataset.i]; history.pushState(null, '', '?id=' + c.id); openOne(c); });
el('goNew').addEventListener('click', () => { history.pushState(null, '', '?new=1'); openNew(); });

/* ── 만들기 ── */
function paintNew(){
  document.querySelectorAll('#days .tmp-pill').forEach((b) => b.classList.toggle('on', +b.dataset.d === days));
  document.querySelectorAll('#who button').forEach((b) => b.classList.toggle('on', (b.dataset.s === '1') === single));
  el('face').textContent = face ? face.display_name + ' ›' : T('errFace');
}
async function openNew(){
  el('makeErr').classList.remove('show');
  if (!face) { try { const a = await AL.loadAliases(); face = a.filter((x) => x.is_default)[0] || a[0] || null; } catch (e) {} }
  paintNew(); show('vNew');
}
el('days').addEventListener('click', (e) => { const b = e.target.closest('.tmp-pill'); if (!b) return; days = +b.dataset.d; paintNew(); });
el('who').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; single = b.dataset.s === '1'; paintNew(); });
el('face').addEventListener('click', async () => { const p = await AL.pickAlias({ currentId: face ? face.id : null }); if (p) { face = p; paintNew(); } });
el('makeBtn').addEventListener('click', async () => {
  const er = el('makeErr'); er.classList.remove('show');
  if (!face) { er.textContent = T('errFace'); er.classList.add('show'); return; }
  const b = el('makeBtn'); b.disabled = true; b.textContent = T('making');
  try {
    const r = await AL.sb.rpc('create_temp_card', { p_label: el('label').value.trim(), p_days: days, p_single: single, p_persona: face.id });
    if (r.error) throw r.error;
    el('label').value = '';
    await loadCards();
    const c = cards.find((x) => x.id === r.data.id);
    history.replaceState(null, '', '?id=' + r.data.id);
    if (c) openOne(c);
  } catch (e) {
    const s = String(e.message || e), n = (s.match(/:(\d+)/) || [])[1];
    if (s.indexOf('plan_required') >= 0 && AL.needPlan) { AL.needPlan(); }
    er.textContent = s.indexOf('plan_required') >= 0 ? T('errPlan') : s.indexOf('limit_live') >= 0 ? T('errLive', { n })
                   : s.indexOf('limit_day') >= 0 ? T('errDay', { n }) : T('errGen');
    er.classList.add('show');
  } finally { b.disabled = false; b.textContent = T('bMake'); }
});

/* ── 한 장 ── */
function drawQr(box, text, size){ box.innerHTML = ''; new QRCode(box, { text, width: size, height: size, correctLevel: QRCode.CorrectLevel.M }); }
async function openOne(c){
  cur = c;
  el('oTag').textContent = c.single_person ? T('one') : T('many');
  el('oName').textContent = c.label || T('noLabel');
  el('oCode').textContent = fmtCode(c.code);
  el('oLeft').textContent = leftText(c);
  const live = alive(c);
  el('liveActs').style.display = live ? '' : 'none';
  el('endedBox').style.display = live ? 'none' : '';
  el('cutBtn').style.display = live ? '' : 'none';
  el('qr').style.opacity = live ? '1' : '.25';
  drawQr(el('qr'), link(c.token), 200);
  el('oneErr').classList.remove('show');
  show('vOne');
  await loadConvs(c);
  clearInterval(openOne._t);
  if (live) openOne._t = setInterval(() => { if (el('vOne').classList.contains('show') && cur && cur.id === c.id && !document.hidden) loadConvs(c); }, 10000);
}
async function loadConvs(c){
  try {
    const { data } = await AL.sb.from('temp_threads').select('id, visitor_name, status, last_activity_at, owner_read_at')
      .eq('card_id', c.id).order('last_activity_at', { ascending: false });
    const list = data || [];
    el('convs').innerHTML = list.length ? list.map((t) =>
      '<a class="tmp-conv" href="burum_temp_chat.html?thread=' + encodeURIComponent(t.id) + '"><span>💬</span><span class="x"><b>' + esc(t.visitor_name || T('unnamed')) +
      '</b><span>' + esc((t.status === 'open' ? T('open') : T('closed')) + ' · ' + AL.fmtDateTime(t.last_activity_at)) + '</span></span><span>›</span></a>').join('')
      : '<div class="tmp-empty">' + esc(T('noConv')) + '</div>';
  } catch (e) { console.warn('[temp] 연락 온 분을 못 읽었습니다', e); }
}
el('aSend').addEventListener('click', async () => {
  if (!cur) return;
  const text = T('shareText', { d: fmtD(cur.expires_at), url: link(cur.token), c: fmtCode(cur.code) });
  if (window.AliasNative && typeof AliasNative.shareText === 'function') { AliasNative.shareText(text, T('tList')); return; }
  if (navigator.share) { try { await navigator.share({ text }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(text); toast(T('copied')); } catch (e) { prompt('', text); }
});
el('aBig').addEventListener('click', () => { if (!cur) return; drawQr(el('bigQr'), link(cur.token), Math.min(340, innerWidth - 60)); el('bigCode').textContent = fmtCode(cur.code); el('big').classList.add('show'); });
el('bigX').addEventListener('click', () => el('big').classList.remove('show'));
el('aPrint').addEventListener('click', () => { if (cur) el('pick').classList.add('show'); });
el('pickNo').addEventListener('click', () => el('pick').classList.remove('show'));
el('pick').addEventListener('click', (e) => {
  if (e.target === el('pick')) { el('pick').classList.remove('show'); return; }
  const o = e.target.closest('.opt'); if (!o || !cur) return;
  el('pick').classList.remove('show');
  const n = +o.dataset.n;
  drawQr(el('qrTmp'), link(cur.token), 480);
  const cv = el('qrTmp').querySelector('canvas');
  const src = cv ? cv.toDataURL('image/png') : ((el('qrTmp').querySelector('img') || {}).src || '');
  const one = '<div class="pc"><div class="q"><img alt="" src="' + src + '"></div><div class="t"><span class="d">' + esc(T('pDate', { d: fmtD(cur.expires_at) })) +
    '</span><div class="h">' + T('pHead') + '</div><div class="s">' + esc(T('pDesc')) + '</div><div class="u">' + esc(T('pUrl')) + '</div><div class="c">' + esc(fmtCode(cur.code)) + '</div></div></div>';
  el('sheet').className = 'tmp-sheet' + (n === 15 ? ' n15' : '');
  el('sheet').innerHTML = one.repeat(n) + '<div class="pnote">' + esc(T('pCut', { n })) + '</div>';
  setTimeout(() => { if (window.AliasNative && typeof AliasNative.printPage === 'function') AliasNative.printPage('Burum ' + cur.code); else window.print(); }, 300);
});
el('cutBtn').addEventListener('click', async () => {
  if (!cur || !confirm(T('cutAsk'))) return;
  const r = await AL.sb.rpc('end_temp_card', { p_id: cur.id });
  if (r.error || !r.data) { el('oneErr').textContent = T('cutFail'); el('oneErr').classList.add('show'); return; }
  toast(T('cutDone')); await loadCards(); const c = cards.find((x) => x.id === cur.id); if (c) openOne(c);
});

function route(){
  const p = new URLSearchParams(location.search);
  if (p.get('thread')) { location.replace('burum_temp_chat.html?thread=' + encodeURIComponent(p.get('thread'))); return; }
  if (p.get('new')) return openNew();
  const c = p.get('id') ? cards.find((x) => x.id === p.get('id')) : null;
  if (c) return openOne(c);
  paintList(); show('vList');
}
window.addEventListener('popstate', route);
el('backLink').addEventListener('click', (e) => {
  if (el('vList').classList.contains('show')) return;
  e.preventDefault(); history.pushState(null, '', location.pathname); loadCards().then(() => { paintList(); show('vList'); });
});

(async function(){
  paintText();
  if (AL.setBack) AL.setBack('alias_contacts.html');
  const me = await AL.requireLogin(); if (!me) return;
  try { await loadCards(); } catch (e) { console.warn('[temp] 목록을 못 읽었습니다', e); }
  route();
  if (AL.startAlerts) AL.startAlerts();
})();
</script>
</body>
</html>
