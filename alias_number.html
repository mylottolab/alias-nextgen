  el('dispHint').textContent = T.dispHint; el('sosTxt').textContent = T.sos;
  el('digits').placeholder = T.digits; el('shopNote').textContent = T.shopNote;
  const keys = ['1','2','3','4','5','6','7','8','9','*','0','⌫'];
  el('pad').innerHTML = keys.map((k) => '<button type="button" data-k="' + k + '"' + (k === '*' ? ' style="visibility:hidden"' : '') + '>' + k + '</button>').join('');
  el('chips').innerHTML = [['', T.all], ['silver', T.g_silver + ' ' + won(5500)], ['gold', T.g_gold + ' ' + won(33000)], ['platinum', T.g_platinum + ' ' + won(99000)]]
    .map((c) => '<button type="button" data-g="' + c[0] + '"' + (c[0] === shopGrade ? ' class="on"' : '') + '>' + esc(c[1]) + '</button>').join('');
}
function paintDisp(){
  el('disp').innerHTML = (typed ? esc(fmt(typed)) : '&nbsp;') + '<small>' + esc(T.dispHint) + '</small>';
}

/* ── 탭 ──────────────────────────────────────────────────── */
function tab(name){
  document.querySelectorAll('.bn-tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === name));
  ['dial', 'mine', 'shop'].forEach((t) => el('p' + t[0].toUpperCase() + t.slice(1)).classList.toggle('on', t === name));
  say('');
  if (name === 'mine') loadMine();
  if (name === 'shop') loadShop(true);
  try { history.replaceState(null, '', '#' + name); } catch (e) {}
}

/* ── ① 다이얼 ─────────────────────────────────────────────── */
async function dial(kind){
  el('dialMsg').textContent = '';
  if (typed.length !== 10) { el('dialMsg').textContent = T.needDigits; return; }
  if (!await AL.requirePlan()) return;
  el('dialMsg').textContent = T.linked;
  const note = kind === 'chat' ? el('noteTx').value.trim() : '';
  const r = await AL.sb.rpc('bn_dial', { p_number: typed, p_persona: null, p_note: note || null });
  const d = r.data || {};
  if (r.error || !d.ok) {
    if (d.error === 'need_plan') { el('dialMsg').textContent = ''; AL.needPlan(); return; }
    el('dialMsg').textContent = errText(d.error); return;
  }
  if (d.state === 'linked' && d.link_id && kind === 'chat') {
    location.href = 'alias_chat.html?link=' + encodeURIComponent(d.link_id);
    return;
  }
  if (d.state === 'linked' && d.link_id) {
    location.href = 'alias_call.html?link=' + encodeURIComponent(d.link_id) + '&type=' + kind +
      '&once=' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    return;
  }
  el('dialMsg').textContent = d.again ? T.again : (kind === 'chat' ? T.requestedM : T.requested);
  if (kind === 'chat' && !d.again) { el('noteTx').value = ''; el('noteBox').classList.remove('on'); }
}

/* ── ② 내 번호 ────────────────────────────────────────────── */
async function loadMine(){
  const [a, b] = await Promise.all([AL.sb.rpc('my_numbers'), AL.sb.rpc('my_number_wallet')]);
  mineList = a.data || []; wallet = b.data || { free_first: true, credits: [] };
  const opt = (sel) => aliases.map((x) => '<option value="' + x.id + '"' + (x.id === sel ? ' selected' : '') + '>' + esc(x.display_name) + '</option>').join('');
  const modes = (m) => ['request', 'all', 'off'].map((k) => '<option value="' + k + '"' + (k === m ? ' selected' : '') + '>' + esc(T['m_' + k]) + '</option>').join('');
  el('mine').innerHTML = mineList.map((n) =>
    '<div class="bn-card" data-n="' + n.number + '">' +
      '<div class="no">' + esc(n.shown) + badge(n.grade) + (n.resting ? ' <span class="bn-g" style="background:rgba(255,120,120,.2);color:#FFB4B4">' + esc(T.resting) + '</span>' : '') + '</div>' +
      (n.keep_to ? '<div style="font-size:12.5px;opacity:.7;margin-top:4px">' + esc(T.keepTo) + ' ' + esc(String(n.keep_to).slice(0, 10)) + '</div>' : '') +
      '<div class="row"><span style="font-size:12.5px;opacity:.7;min-width:72px">' + esc(T.persona) + '</span><select data-p>' + opt(n.persona_id) + '</select></div>' +
      '<div class="row"><span style="font-size:12.5px;opacity:.7;min-width:72px">' + esc(T.mode) + '</span><select data-m>' + modes(n.mode) + '</select></div>' +
      '<div class="row"><button type="button" data-copy>📋</button><button type="button" data-change>' + esc(T.change) + '</button>' +
      '<button type="button" class="go" data-keep>' + esc(T.keep) + '</button>' +
      '<button type="button" class="bad" data-off>' + esc(T.off) + '</button></div>' +
    '</div>').join('');
  el('mine').querySelectorAll('.bn-card').forEach((c) => {
    const n = c.dataset.n;
    c.querySelector('[data-p]').onchange = (e) => AL.sb.rpc('bn_set', { p_number: n, p_persona: e.target.value, p_mode: null });
    c.querySelector('[data-m]').onchange = (e) => AL.sb.rpc('bn_set', { p_number: n, p_persona: null, p_mode: e.target.value });
    c.querySelector('[data-copy]').onclick = () => { try { navigator.clipboard.writeText('부름 ' + fmt(n)); say('📋 ' + fmt(n), true); } catch (e) {} };
    c.querySelector('[data-change]').onclick = () => { changing = n; tab('shop'); };
    c.querySelector('[data-keep]').onclick = () => keepMore(n);
    c.querySelector('[data-off]').onclick = async () => {
      if (!confirm(T.offConfirm)) return;
      await AL.sb.rpc('bn_release', { p_number: n }); loadMine();
    };
  });
  el('hold').innerHTML = wallet.hold ? '<div class="bn-banner">' + esc(T.holdNow) + esc(wallet.hold.shown) + '</div>' : '';
  el('credits').innerHTML = (wallet.credits || []).length
    ? '<div class="bn-banner">' + esc(T.credit) + wallet.credits.map((c) => esc(T['g_' + c.kind] || (c.kind === 'extra' ? T.extra.split(' (')[0] : c.kind === 'keep' ? T.keep : T.change))).join(', ') + '<br>' + esc(T.creditPick) + '</div>' : '';
  await loadOffers();
}
async function loadOffers(){
  const r = await AL.sb.rpc('bn_offer');
  const list = r.data || [];
  const head = wallet.free_first ? T.free : T.extra;
  el('newBox').innerHTML = '<p class="bn-note">' + esc(head) + '</p><div class="bn-list">' +
    list.map((x) => '<div class="item"><span class="n">' + esc(x.shown) + '</span><span class="p">' +
      esc(wallet.free_first ? T.priceFree : T.priceExtra) + '</span><button type="button" data-pick="' + x.number + '">' + esc(T.pick) + '</button></div>').join('') + '</div>' +
    '<p class="bn-note" style="opacity:.75">' + esc(T.rerollHint) + '</p>' +
    (wallet.free_first ? '<p class="bn-note" style="opacity:.95;padding:11px 13px;border-radius:12px;background:rgba(143,227,176,.10);border:1px solid rgba(143,227,176,.3)">' + esc(T.moreHow) + '</p>' : '');
  el('newBox').querySelectorAll('[data-pick]').forEach((b) => { b.onclick = () => choose(b.dataset.pick, 'normal'); });
}

/* ── 고르기 · 사기 — 무료 / 크레딧 / 결제 ────────────────────── */
/* 번호 하나 더 · 바꾸기는 값이 같아 서로 바꿔 씁니다(서버도 같은 규칙) */
function creditFor(kind){
  const ok = (kind === 'extra' || kind === 'change') ? ['extra', 'change'] : [kind];
  return (wallet.credits || []).filter((c) => ok.indexOf(c.kind) >= 0)[0] || null;
}
async function choose(number, grade){
  say('');
  if (!await AL.requirePlan()) return;
  const persona = (aliases[0] || {}).id || null;
  let kind = grade;
  if (grade === 'normal') {
    if (wallet.free_first && !changing) {
      const r = await AL.sb.rpc('bn_claim_free', { p_number: number, p_persona: persona });
      return after(r);
    }
    kind = changing ? 'change' : 'extra';
  }
  /* 이미 산 것(크레딧)이 있으면 결제 없이 그것으로 */
  const c = creditFor(kind);
  if (c) {
    const r = await AL.sb.rpc('bn_use_credit', { p_credit: c.id, p_number: number, p_replace: changing, p_persona: persona });
    return after(r);
  }
  const h = await AL.sb.rpc('bn_hold', { p_number: number, p_kind: kind, p_replace: changing, p_persona: persona });
  const d = h.data || {};
  if (h.error || !d.ok) { if (d.error === 'need_plan') return AL.needPlan(); return say(errText(d.error)); }
  if (!(window.AliasNative && typeof AliasNative.storeBuy === 'function')) return say(T.appOnly);
  AliasNative.storeBuy(d.sku);     // 결과는 AL.onStoreDone 으로 옵니다
}
/* 1년 더 잡아 두기 (1,100원) — 이용권을 쉬는 분도 살 수 있습니다(이용권 검사 없음) */
async function keepMore(number){
  say('');
  const c = (wallet.credits || []).filter((x) => x.kind === 'keep')[0];
  if (c) return after(await AL.sb.rpc('bn_use_credit', { p_credit: c.id, p_number: number, p_replace: null, p_persona: null }), true);
  const h = await AL.sb.rpc('bn_hold', { p_number: number, p_kind: 'keep', p_replace: null, p_persona: null });
  const d = h.data || {};
  if (h.error || !d.ok) return say(errText(d.error));
  if (!(window.AliasNative && typeof AliasNative.storeBuy === 'function')) return say(T.appOnly);
  AliasNative.storeBuy(d.sku);
}
function after(r){
  const d = r.data || {};
  if (r.error || !d.ok) { if (d.error === 'need_plan') return AL.needPlan(); return say(errText(d.error)); }
  changing = null; say(d.kept ? T.kept + (d.shown || '') : T.done + (d.shown || ''), true); tab('mine');
}
AL.onStoreDone = function(res){
  if (!res || !res.ok) {
    if (!res || res.canceled) return;
    if (res.pending) return say(T.pending, true);
    if (res.owned || res.cleared) { say(T.owned); return loadMine(); }
    return say(res.error || T.e_fail);
  }
  changing = null;
  say(T.bought, true);
  tab('mine');
};

/* ── ③ 좋은 번호 ──────────────────────────────────────────── */
async function loadShop(reset){
  el('changeBanner').style.display = changing ? '' : 'none';
  if (changing) {
    el('changeBanner').innerHTML = esc(T.changeFor) + '<b>' + esc(fmt(changing)) + '</b> <button type="button" id="cc" style="margin:0 0 0 8px;padding:4px 10px;border-radius:8px">' + esc(T.cancelChange) + '</button>';
    el('cc').onclick = () => { changing = null; loadShop(true); };
  }
  const dg = el('digits').value.replace(/\D/g, '');
  const r = await AL.sb.rpc('bn_search', { p_digits: dg || null, p_grade: shopGrade || null, p_limit: 30 });
  const list = r.data || [];
  const html = list.map((x) => {
    const price = x.grade === 'normal' ? ((wallet.free_first && !changing) ? T.priceFree : T.priceExtra) : won(x.price);
    /* 🔴 2026-10-19 — 회사 보유분은 SOLD OUT (고를 수 없음) */
    if (x.sold) return '<div class="item" style="opacity:.55"><span class="n" style="text-decoration:line-through;text-decoration-thickness:1px">' + esc(x.shown) + badge(x.grade) +
      '</span><span class="p">' + esc(won(x.price)) + '</span><span style="padding:8px 10px;border-radius:10px;font-size:12px;font-weight:900;letter-spacing:.5px;color:#FFB4B4;border:1px solid rgba(255,140,140,.5)">SOLD OUT</span></div>';
    return '<div class="item"><span class="n">' + esc(x.shown) + badge(x.grade) + '</span><span class="p">' + esc(price) +
      '</span><button type="button" data-n="' + x.number + '" data-g="' + x.grade + '">' + esc(x.grade === 'normal' ? T.pick : T.buy) + '</button></div>';
  }).join('');
  el('shopList').innerHTML = reset ? html : el('shopList').innerHTML + html;
  el('shopList').querySelectorAll('[data-n]').forEach((b) => { b.onclick = () => choose(b.dataset.n, b.dataset.g); });
}

/* ── 시작 ─────────────────────────────────────────────────── */
(async function(){
  paintText(); paintDisp();
  if (AL.setBack) AL.setBack('alias_phone.html');
  document.querySelectorAll('.bn-tabs button').forEach((b) => { b.onclick = () => tab(b.dataset.tab); });
  el('pad').onclick = (e) => {
    const k = e.target && e.target.dataset && e.target.dataset.k; if (!k) return;
    if (k === '⌫') typed = typed.slice(0, -1); else if (/\d/.test(k) && typed.length < 10 && !(typed === '' && k === '0')) typed += k;
    paintDisp(); el('dialMsg').textContent = '';
  };
  el('callV').onclick = () => dial('voice'); el('callVV').onclick = () => dial('video');
  el('noteTx').placeholder = T.notePh;
  el('callM').onclick = () => { el('dialMsg').textContent = ''; if (typed.length !== 10) { el('dialMsg').textContent = T.needDigits; return; } el('noteBox').classList.toggle('on'); if (el('noteBox').classList.contains('on')) el('noteTx').focus(); };
  el('noteGo').onclick = () => dial('chat');
  el('rerollT').textContent = T.reroll;
  let spin = 0;
  el('reroll').onclick = async () => { spin += 360; el('rerollIc').style.transform = 'rotate(' + spin + 'deg)'; await loadOffers(); };
  el('saveNo').onclick = (e) => { e.preventDefault(); if (typed.length !== 10) { el('dialMsg').textContent = T.needDigits; return; } location.href = 'alias_phone.html?save=' + typed; };
  el('chips').onclick = (e) => { const g = e.target && e.target.dataset && e.target.dataset.g; if (g === undefined) return; shopGrade = g; paintText(); loadShop(true); };
  let tmr = null; el('digits').oninput = () => { clearTimeout(tmr); tmr = setTimeout(() => loadShop(true), 350); };
  el('more').onclick = () => loadShop(false);
  me = await AL.requireLogin();
  if (!me) return;
  try { aliases = await AL.loadAliases(); } catch (e) { aliases = []; }
  /* 다른 화면에서 번호를 들고 온 경우(alias_number.html?dial=4829051317) */
  const q = new URLSearchParams(location.search).get('dial');
  if (q) { typed = q.replace(/\D/g, '').slice(0, 10); paintDisp(); }
  if (q && new URLSearchParams(location.search).get('msg')) { el('noteBox').classList.add('on'); }
  const h = (location.hash || '').replace('#', '');
  if (h === 'mine' || h === 'shop') tab(h);
  try { const w = await AL.sb.rpc('my_number_wallet'); if (w.data) wallet = w.data; } catch (e) {}
  if (AL.startAlerts) AL.startAlerts();
})();
</script>
