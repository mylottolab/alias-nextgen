<script>
document.addEventListener("DOMContentLoaded", function(){
  if (typeof AL === "undefined" || typeof AL.t !== "function") {
    document.body.innerHTML = '<div style="padding:26px;font-family:system-ui,sans-serif;color:#DDE5F0;background:#0E1621;min-height:100vh">' +
      '<b>alias_common.js 를 못 읽었습니다.</b></div>';
    return;
  }
  AL.bootTheme();
});

<style>
/* 🔴 2026-10-19 — 동시통보: 그룹을 미리 만들어 두고, 필요할 때 한 번에 보냅니다.
   받는 사람에게는 각자의 1:1 대화방에 보통 메시지로 들어갑니다(다른 받는 사람은 안 보임). */
.bc-intro{font-size:13.5px;line-height:1.65;opacity:.8;margin:0 0 14px;word-break:keep-all}
.bc-new{width:100%;margin:0 0 14px;padding:13px;border-radius:13px;font-size:15px;font-weight:800;cursor:pointer;
  background:rgba(143,227,176,.18);color:#8FE3B0;border:1px dashed rgba(143,227,176,.55)}
.bc-card{border:1px solid rgba(128,128,128,.3);border-radius:14px;padding:13px 14px;margin:0 0 10px;background:rgba(255,255,255,.04)}
.bc-card .nm{font-size:17px;font-weight:800;word-break:keep-all}
.bc-card .ct{font-size:12.5px;opacity:.7;margin-top:2px}
.bc-card .bc-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.bc-card button{margin:0;padding:9px 13px;border-radius:10px;font-size:13.5px;font-weight:700;cursor:pointer;
  background:rgba(255,255,255,.07);color:inherit;border:1px solid rgba(128,128,128,.35)}
.bc-card button.go{background:#8FE3B0;color:#0E1621;border-color:#8FE3B0;font-weight:800}
.bc-card button.bad{background:rgba(255,120,120,.1);color:#FFB4B4;border-color:rgba(255,120,120,.4)}
.bc-empty{text-align:center;opacity:.7;font-size:14px;padding:24px 8px;line-height:1.7;word-break:keep-all}
.bc-log{margin-top:10px}
.bc-log b{font-size:13px}
/* 대화 상자 */
.bc-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none}
.bc-dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100vw - 28px));max-height:calc(100vh - 40px);
  overflow:auto;z-index:51;display:none;border-radius:18px;padding:18px 16px;background:var(--raise,#182231);color:inherit;
  border:1px solid rgba(128,128,128,.35);box-sizing:border-box}
.bc-dlg h3{margin:0 0 10px;font-size:18px}
.bc-dlg input[type=text],.bc-dlg input[type=search],.bc-dlg textarea{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:11px;font-size:15px;
  font-family:inherit;background:rgba(255,255,255,.06);color:inherit;border:1px solid rgba(128,128,128,.35);margin:0 0 10px}
.bc-dlg textarea{min-height:110px;resize:vertical}
.bc-ppl{max-height:46vh;overflow:auto;border:1px solid rgba(128,128,128,.25);border-radius:12px;padding:4px 8px;margin:0 0 10px}
.bc-ppl label{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid rgba(128,128,128,.15);font-size:15px;cursor:pointer}
.bc-ppl label:last-child{border-bottom:none}
.bc-ppl input{width:20px;height:20px;margin:0;flex:0 0 auto}
.bc-ppl .lk{font-size:11.5px;opacity:.65;margin-left:auto;white-space:nowrap}
.bc-sel{display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.85;margin:0 0 8px}
.bc-sel button{margin:0;padding:5px 10px;border-radius:8px;font-size:12.5px;cursor:pointer;background:transparent;color:inherit;border:1px solid rgba(128,128,128,.4)}
.bc-btns{display:flex;gap:8px}
.bc-btns button{flex:1;margin:0;padding:13px;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;border:1px solid rgba(128,128,128,.35);background:rgba(255,255,255,.06);color:inherit}
.bc-btns button.go{background:#8FE3B0;color:#0E1621;border-color:#8FE3B0}
.bc-msg{font-size:13.5px;line-height:1.6;min-height:20px;margin:0 0 10px;word-break:keep-all}
.bc-note{font-size:12.5px;opacity:.7;line-height:1.6;margin:0 0 10px;word-break:keep-all}
.bc-bar{height:8px;border-radius:99px;background:rgba(128,128,128,.25);overflow:hidden;margin:4px 0 10px}
.bc-h{margin:24px 0 8px;font-size:15px;font-weight:800}
.bc-hcard{border:1px solid rgba(128,128,128,.25);border-radius:13px;padding:11px 13px;margin:0 0 9px;background:rgba(255,255,255,.03)}
.bc-hcard .t{font-size:15px;font-weight:800;word-break:keep-all}
.bc-hcard .m{font-size:12px;opacity:.7;margin-top:2px}
.bc-hcard .b{font-size:13.5px;line-height:1.55;margin-top:7px;white-space:pre-wrap;word-break:break-word;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;opacity:.92}
.bc-hcard .w{font-size:12.5px;line-height:1.6;margin-top:7px;opacity:.8;display:none}
.bc-hcard .bc-row{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.bc-hcard button{margin:0;padding:8px 11px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.07);color:inherit;border:1px solid rgba(128,128,128,.35)}
.bc-hcard button.go{background:rgba(143,227,176,.18);color:#8FE3B0;border-color:rgba(143,227,176,.55)}
.bc-hcard button.bad{background:transparent;color:#FFB4B4;border-color:rgba(255,120,120,.35)}
.bc-to{display:flex;flex-direction:column;gap:6px;margin:0 0 10px;font-size:14px}
.bc-to label{display:flex;gap:8px;align-items:center;cursor:pointer}
.bc-to input{width:18px;height:18px;margin:0}
.bc-lbl{font-size:12.5px;font-weight:700;opacity:.8;margin:0 0 4px}
.bc-bar i{display:block;height:100%;width:0;background:#8FE3B0;transition:width .2s}
</style>
</head>

<script>

const el = (id) => document.getElementById(id);
const esc = (s) => AL.esc(s == null ? '' : String(s));
const T = en ? {
  back: '‹ Contacts', h1: '📢 Broadcast', intro: 'Make groups of your contacts in advance, then send one message to a whole group. Each person gets it in their own 1:1 chat — they can\'t see who else received it.',

  noName: 'Please enter a group name.', noPpl: 'Pick at least one person.', noContacts: 'No 1:1 contacts yet. Connect with people first.',

  sPh: 'Message', sNote: 'Locked (end-to-end encrypted) chats can\'t be included — send there directly. Each person sees it as a normal message from you.',

  close: 'Close', recent: 'Recent broadcasts', nobody: 'Nobody to send to in this group (people may have disconnected).',
  titleL: 'Title (for your records)', titlePh: 'e.g. October meeting notice — blank uses the first line', txL: 'Message', txPh: 'Write the message to send here',
  hist: '🗂 Sent broadcasts (kept 1 year)', again: '🔁 Send again · edit', who: (n) => '👥 Recipients (' + n + ')', hdel: 'Delete', hdelAsk: 'Delete this record? (Messages already sent stay.)',
  toPrev: (n) => 'Same people as last time (' + n + ')', toGroup: (g, n) => 'Group "' + g + '" as it is now (' + n + ')', againH: (t) => '🔁 Send again: ' + t,
  gone: '(no longer connected)', oldRec: 'Older record — the message wasn\'t kept.', ppl2: (n) => n + ' people'
} : {
  back: '‹ 연락처', h1: '📢 동시통보', intro: '아는 사람들을 미리 그룹으로 묶어 두고, 필요할 때 메시지 한 번으로 그룹 전체에 보냅니다. 받는 사람은 각자 나와의 1:1 대화방에서 받고, 누구누구에게 함께 갔는지는 보이지 않습니다.',
  newG: '＋ 새 동시통보 그룹', empty: '아직 그룹이 없습니다.<br><b>＋ 새 동시통보 그룹</b>을 눌러 사람을 골라 주세요.',
  ppl: (n) => n + '명', send: '📝 문안작성 & 보내기', edit: '고치기', del: '삭제', delAsk: (n) => '"' + n + '" 그룹을 지울까요? (보낸 메시지는 지워지지 않습니다)',
  eNew: '새 동시통보 그룹', eEdit: '그룹 고치기', namePh: '그룹 이름 (예: 가족 · 동호회 · 고객)', q: '연락처 찾기',
  all: '모두', none: '해제', picked: (n) => n + '명 골랐습니다', cancel: '취소', save: '저장',
  noName: '그룹 이름을 적어 주세요.', noPpl: '한 명 이상 골라 주세요.', noContacts: '아직 1:1로 이어진 연락처가 없습니다. 먼저 사람을 이어 주세요.',
  tooMany: '그룹은 30개까지 만들 수 있습니다.', locked: '🔒 잠긴 방',
  sH: (n) => '📢 "' + n + '"에 보내기', sWho: (a, b) => a + '명에게 갑니다' + (b ? ' · 잠긴 방 ' + b + '곳은 빠집니다' : ''),
  sPh: '보낼 메시지', sNote: '잠긴 방(종단 암호화)은 함께 보낼 수 없어 빠집니다. 그 방에서 직접 보내 주세요. 받는 사람에게는 나에게서 온 보통 메시지로 보입니다.',
  sGo: '보내기', noTx: '메시지를 적어 주세요.', sending: (i, n) => '보내는 중… ' + i + ' / ' + n,
  done: (ok, sk, fl) => '✅ ' + ok + '명에게 보냈습니다' + (sk ? ' · 잠긴 방 ' + sk + '곳 빠짐' : '') + (fl ? ' · ' + fl + '명 실패' : ''),
  keepOpen: '보내는 중에는 부름을 켜 두세요. 화면이 꺼지거나 다른 곳으로 나가면 잠시 멈췄다가, 다시 열면 멈춘 곳부터 이어서 보냅니다(같은 사람에게 두 번 가지 않습니다).',
  resumeTx: (g, a, b) => '⏸ <b>' + esc(g) + '</b> 동시통보가 ' + a + ' / ' + b + '명에서 멈춰 있습니다.', resumeGo: (n) => '▶ 이어 보내기 (남은 ' + n + '명)', resumeNo: '그만두기', resumeAsk: '이 동시통보를 그만둘까요? 아직 못 받은 사람에게는 가지 않습니다.',
  close: '닫기', recent: '최근 보낸 동시통보', nobody: '이 그룹에 보낼 사람이 없습니다(연결이 끊겼을 수 있습니다).',
  titleL: '명칭 (보관함에 남는 이름)', titlePh: '예: 10월 정기모임 안내 — 비우면 문안 첫 줄', txL: '문안', txPh: '여기에 보낼 문안을 적으세요',
  hist: '🗂 보낸 동시통보 보관함 (1년 보관)', again: '🔁 다시 보내기 · 고치기', who: (n) => '👥 받은 사람 (' + n + '명)', hdel: '삭제', hdelAsk: '이 기록을 지울까요? (이미 보낸 메시지는 그대로입니다)',
  toPrev: (n) => '지난번 받은 사람 그대로 (' + n + '명)', toGroup: (g, n) => '"' + g + '" 그룹 지금 사람들 (' + n + '명)', againH: (t) => '🔁 다시 보내기: ' + t,
  gone: '(지금은 연결 끊김)', oldRec: '예전 기록이라 문안이 보관되지 않았습니다.', ppl2: (n) => n + '명'
};

el('back').textContent = T.back; el('h1').textContent = T.h1; el('intro').textContent = T.intro; el('newBtn').textContent = T.newG;
el('eName').placeholder = T.namePh; el('eQ').placeholder = T.q; el('eAll').textContent = T.all; el('eNone').textContent = T.none;
el('eNo').textContent = T.cancel; el('eGo').textContent = T.save; el('sTx').placeholder = T.txPh;
el('sTitleL').textContent = T.titleL; el('sTitle').placeholder = T.titlePh; el('sTxL').textContent = T.txL; el('sNote').textContent = T.sNote;
el('sNo').textContent = T.close; el('sGo').textContent = T.sGo;

let hist = [];
let groups = [], people = [], editing = null, picked = new Set(), sendingNow = false;

function show(id, on){ el('bg').style.display = on ? 'block' : 'none'; el(id).style.display = on ? 'block' : 'none'; }
el('bg').onclick = () => { if (sendingNow) return; show('eDlg', false); show('sDlg', false); };

async function loadPeople(){
  try {
    const r = await AL.sb.rpc('my_contacts');
    people = (r.data || []).filter(c => c.kind !== 'group' && c.link_id)
      .map(c => ({ id: c.link_id, name: c.peer_label || c.peer_display || '?' }))
      .sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  } catch (e) { people = []; }
}
function nameOf(id){ const p = people.find(x => x.id === id); return p ? p.name : null; }

async function load(){
  const r = await AL.sb.rpc('bc_groups');
  groups = (r && r.data) || [];
  const box = el('list');
  if (!groups.length) { box.innerHTML = '<div class="bc-empty">' + T.empty + '</div>'; }
  else box.innerHTML = groups.map((g, i) => {
    const names = (g.members || []).map(nameOf).filter(Boolean);
    const shown = names.slice(0, 5).join(', ') + (names.length > 5 ? ' …' : '');
    return '<div class="bc-card"><div class="nm">' + esc(g.name) + '</div>' +
      '<div class="ct">' + T.ppl(g.n) + (shown ? ' · ' + esc(shown) : '') + '</div>' +
      '<div class="bc-row"><button class="go" data-s="' + i + '">' + T.send + '</button>' +
      '<button data-e="' + i + '">' + T.edit + '</button><button class="bad" data-d="' + i + '">' + T.del + '</button></div></div>';
  }).join('');
  try {
    const lg = await AL.sb.rpc('bc_log_mine');
    hist = (lg && lg.data) || [];
    el('log').innerHTML = hist.length ? '<div class="bc-h">' + T.hist + '</div>' + hist.map((x, i) => {
      const when = new Date(x.at).toLocaleString(en ? 'en-US' : 'ko-KR', { year: '2-digit', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      const has = x.body != null && x.body !== '';
      return '<div class="bc-hcard"><div class="t">' + esc(x.title || (has ? x.body.split('\n')[0].slice(0, 40) : (x.group || ''))) + '</div>' +
        '<div class="m">' + when + (x.group ? ' · ' + esc(x.group) : '') + ' · ' + T.done(x.sent, x.skipped, x.failed).replace('✅ ', '') + '</div>' +
        (has ? '<div class="b">' + esc(x.body) + '</div>' : '<div class="m">' + T.oldRec + '</div>') +
        '<div class="w" id="hw' + i + '"></div>' +
        '<div class="bc-row">' + (has ? '<button class="go" data-ha="' + i + '">' + T.again + '</button>' : '') +
        (x.n ? '<button data-hw="' + i + '">' + T.who(x.n) + '</button>' : '') +
        '<button class="bad" data-hd="' + i + '">' + T.hdel + '</button></div></div>';
    }).join('') : '';
  } catch (e) {}
}

/* 🔴 2026-10-21 — 보관함: 다시 보내기 · 받은 사람 보기 · 삭제 */
el('log').onclick = async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.ha !== undefined) openSend(null, hist[+b.dataset.ha]);
  if (b.dataset.hw !== undefined) {
    const i = +b.dataset.hw, w = el('hw' + i);
    if (w.style.display === 'block') { w.style.display = 'none'; return; }
    const r = await AL.sb.rpc('bc_log_targets', { p_log: hist[i].id });
    const live = (r && r.data) || [];
    const names = live.map(t => (nameOf(t.link_id) || '?') + (t.locked ? ' 🔒' : ''));
    const goneN = hist[i].n - live.length;
    w.textContent = names.join(', ') + (goneN > 0 ? (names.length ? ' · ' : '') + goneN + (en ? ' ' : '명 ') + T.gone : '');
    w.style.display = 'block';
  }
  if (b.dataset.hd !== undefined) {
    if (!confirm(T.hdelAsk)) return;
    await AL.sb.rpc('bc_log_delete', { p_log: hist[+b.dataset.hd].id }); load();
  }
};

el('list').onclick = async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.e !== undefined) openEdit(groups[+b.dataset.e]);
  if (b.dataset.s !== undefined) openSend(groups[+b.dataset.s]);
  if (b.dataset.d !== undefined) {
    const g = groups[+b.dataset.d];
    if (!confirm(T.delAsk(g.name))) return;
    await AL.sb.rpc('bc_group_delete', { p_id: g.id }); load();
  }
};

/* ── 그룹 만들기 · 고치기 ── */
function paintPeople(){
  const q = el('eQ').value.trim().toLowerCase();
  const list = people.filter(p => !q || p.name.toLowerCase().includes(q));
  el('ePpl').innerHTML = people.length ? list.map(p =>
    '<label><input type="checkbox" data-id="' + p.id + '"' + (picked.has(p.id) ? ' checked' : '') + '><span>' + esc(p.name) + '</span></label>').join('')
    : '<div class="bc-empty">' + T.noContacts + '</div>';
  el('eCnt').textContent = T.picked(picked.size);
}
el('ePpl').onchange = (e) => { const c = e.target; if (!c.dataset.id) return; if (c.checked) picked.add(c.dataset.id); else picked.delete(c.dataset.id); el('eCnt').textContent = T.picked(picked.size); };
el('eQ').oninput = paintPeople;
el('eAll').onclick = () => { const q = el('eQ').value.trim().toLowerCase(); people.filter(p => !q || p.name.toLowerCase().includes(q)).forEach(p => picked.add(p.id)); paintPeople(); };
el('eNone').onclick = () => { picked.clear(); paintPeople(); };
function openEdit(g){
  editing = g || null;
  el('eH').textContent = g ? T.eEdit : T.eNew;
  el('eName').value = g ? g.name : '';
  /* 🔴 2026-10-19 — 새 그룹은 1:1 연락처를 모두 넣은 채로 시작합니다(손님 요청). 빼고 싶은 사람만 체크를 풉니다. */
  picked = new Set(g ? (g.members || []) : people.map(p => p.id));
  el('eQ').value = ''; el('eMsg').textContent = '';
  paintPeople(); show('eDlg', true);
}
el('newBtn').onclick = () => openEdit(null);
el('eNo').onclick = () => show('eDlg', false);
el('eGo').onclick = async () => {
  const name = el('eName').value.trim();
  if (!name) { el('eMsg').textContent = T.noName; return; }
  if (!picked.size) { el('eMsg').textContent = T.noPpl; return; }
  el('eGo').disabled = true;
  try {
    const r = await AL.sb.rpc('bc_group_save', { p_id: editing ? editing.id : null, p_name: name, p_links: Array.from(picked) });
    const d = r && r.data;
    if (!d || !d.ok) { el('eMsg').textContent = (d && d.error === 'too_many_groups') ? T.tooMany : ((r && r.error && r.error.message) || (d && d.error) || 'error'); return; }
    show('eDlg', false); load();
  } finally { el('eGo').disabled = false; }
};

/* ── 보내기 ── */
let sendGroup = null, targets = [];
function setTargets(list){
  targets = list || [];
  const open = targets.filter(t => !t.locked).length;
  el('sWho').textContent = open ? T.sWho(open, targets.length - open) : T.nobody;
  el('sGo').disabled = !open;
}
/* g: 그룹에서 새로 보내기 · h: 보관함에서 다시 보내기(문안 · 명칭 · 받은 사람을 채워 둡니다) */
async function openSend(g, h){
  el('sMsg').textContent = ''; el('sNote').textContent = T.sNote;
  el('sBarW').style.display = 'none'; el('sGo').style.display = ''; el('sGo').disabled = false; el('sTx').disabled = false; el('sTitle').disabled = false;
  el('sTo').style.display = 'none'; el('sTo').innerHTML = '';
  if (!h) {
    sendGroup = g; el('sH').textContent = T.sH(g.name); el('sTx').value = ''; el('sTitle').value = '';
    const r = await AL.sb.rpc('bc_targets', { p_id: g.id });
    setTargets(r && r.data);
    show('sDlg', true); el('sTx').focus();
    return;
  }
  const grp = h.group_id ? groups.find(x => x.id === h.group_id) : null;
  sendGroup = { id: grp ? grp.id : null, name: h.group || '' };
  el('sH').textContent = T.againH(h.title || h.group || '');
  el('sTitle').value = h.title || ''; el('sTx').value = h.body || '';
  const r = await AL.sb.rpc('bc_log_targets', { p_log: h.id });
  const prev = (r && r.data) || [];
  setTargets(prev);
  if (grp) {
    const r2 = await AL.sb.rpc('bc_targets', { p_id: grp.id });
    const now = (r2 && r2.data) || [];
    el('sTo').innerHTML = '<label><input type="radio" name="sTo" value="p" checked>' + esc(T.toPrev(prev.length)) + '</label>' +
      '<label><input type="radio" name="sTo" value="g">' + esc(T.toGroup(grp.name, now.length)) + '</label>';
    el('sTo').style.display = 'flex';
    el('sTo').onchange = (e) => setTargets(e.target.value === 'g' ? now : prev);
  }
  show('sDlg', true); el('sTx').focus();
}
el('sNo').onclick = () => { if (!sendingNow) show('sDlg', false); };
/* 🔴 2026-10-19 — 1,000명까지. 보내는 동안:
   ① 화면이 저절로 꺼지지 않게 붙잡습니다(되는 폰에서만 · Wake Lock)
   ② 그래도 화면이 꺼지거나 홈으로 나가면 그 자리에서 멈췄다가, 다시 열면 **남은 사람부터 이어서** 보냅니다
      (보낸 사람 · 남은 사람을 이 폰에 적어 둡니다 → 두 번 가지 않습니다)
   ③ 잠깐 끊겨 실패하면 한 번 더 보내 봅니다 */
const JOB_KEY = 'burum_bcast_job_v1';
function jobGet(){ try { const j = JSON.parse(localStorage.getItem(JOB_KEY) || 'null'); if (j && Date.now() - j.at < 24 * 3600e3 && j.left && j.left.length) return j; } catch (e) {} return null; }
function jobPut(j){ try { if (j) localStorage.setItem(JOB_KEY, JSON.stringify(j)); else localStorage.removeItem(JOB_KEY); } catch (e) {} }
let wake = null;
async function wakeOn(){ try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) { wake = null; } }
function wakeOff(){ try { if (wake) wake.release(); } catch (e) {} wake = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && sendingNow) wakeOn(); });

async function sendOne(linkId, text){
  for (let k = 0; k < 2; k++) {
    try { await AL.callFn('alias-message-send', { linkId: linkId, text: text, enc: null, replyTo: null, expiresInHours: null }); return true; }
    catch (e) {
      console.warn('[bcast] 실패' + (k ? '(다시)' : ''), linkId, e);
      // 화면이 꺼져 있던 사이면 켜질 때까지 기다렸다가 다시
      while (document.visibilityState !== 'visible') await new Promise(r => setTimeout(r, 1000));
      await new Promise(r => setTimeout(r, 1200));
    }
  }
  return false;
}

async function runJob(job){
  sendingNow = true; el('sGo').disabled = true; el('sTx').disabled = true; el('sNo').disabled = true;
  el('sBarW').style.display = 'block'; el('sGo').style.display = 'none';
  await wakeOn();
  const total = job.total;
  while (job.left.length) {
    const id = job.left[0];
    el('sMsg').textContent = T.sending(total - job.left.length + 1, total);
    const ok = await sendOne(id, job.text);
    if (ok) { job.ok++; (job.okIds = job.okIds || []).push(id); } else job.fail++;
    job.left.shift(); job.at = Date.now(); jobPut(job);
    el('sBar').style.width = Math.round((total - job.left.length) * 100 / total) + '%';
    await new Promise(r => setTimeout(r, 120));   // 서버를 한꺼번에 두드리지 않게
  }
  /* 🔴 2026-10-21 — 명칭 · 문안 · 받은 사람까지 보관(15_bcast_history.sql). 그 SQL 전이면 예전 방식으로 */
  try {
    const r = await AL.sb.rpc('bc_log_save', { p_group: job.gid || null, p_group_name: job.gname || '', p_title: job.title || '', p_body: job.text,
      p_links: job.okIds || [], p_sent: job.ok, p_skipped: job.skipped, p_failed: job.fail });
    if (r && r.error && job.gid) await AL.sb.rpc('bc_log_add', { p_id: job.gid, p_sent: job.ok, p_skipped: job.skipped, p_failed: job.fail });
  } catch (e) {}
  jobPut(null); wakeOff();
  sendingNow = false; el('sNo').disabled = false;
  el('sMsg').textContent = T.done(job.ok, job.skipped, job.fail);
  el('resume').style.display = 'none';
  load();
}

el('sGo').onclick = async () => {
  const text = el('sTx').value.trim();
  if (!text) { el('sMsg').textContent = T.noTx; return; }
  if (!await AL.requirePlan()) return;
  const list = targets.filter(t => !t.locked).map(t => t.link_id);
  const title = el('sTitle').value.trim() || text.split('\n')[0].slice(0, 40);
  el('sTitle').disabled = true; el('sTo').style.display = 'none';
  const job = { gid: sendGroup.id, gname: sendGroup.name, title: title, okIds: [], text: text, left: list, total: list.length,
                ok: 0, fail: 0, skipped: targets.length - list.length, at: Date.now() };
  jobPut(job);
  el('sNote').textContent = T.keepOpen;
  await runJob(job);
};

/* 보내다 멈춘 것이 있으면 맨 위에 [이어 보내기] */
function paintResume(){
  const j = jobGet(), box = el('resume');
  if (!j || sendingNow) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  box.innerHTML = T.resumeTx(j.gname, j.total - j.left.length, j.total) +
    '<div class="bc-row" style="display:flex;gap:8px;margin-top:9px"><button class="go" id="rGo">' + T.resumeGo(j.left.length) + '</button><button id="rNo">' + T.resumeNo + '</button></div>';
  el('rGo').onclick = async () => {
    if (!await AL.requirePlan()) return;
    sendGroup = { id: j.gid, name: j.gname };
    el('sH').textContent = T.sH(j.gname); el('sWho').textContent = ''; el('sTx').value = j.text; el('sTitle').value = j.title || ''; el('sTo').style.display = 'none'; el('sNote').textContent = T.keepOpen;
    el('sBar').style.width = Math.round((j.total - j.left.length) * 100 / j.total) + '%';
    show('sDlg', true); box.style.display = 'none';
    await runJob(j);
  };
  el('rNo').onclick = () => { if (confirm(T.resumeAsk)) { jobPut(null); paintResume(); } };
}

const me = await AL.requireLogin();
if (!me) return;
await loadPeople();
await load();
paintResume();
if (AL.startAlerts) AL.startAlerts();
})();
</script>
