<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 별칭 — Alias</title>
<link rel="stylesheet" href="alias_common.css?v=20260903b">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="alias_common.js?v=20260903b"></script>
</head>
<body>
<div class="wrap">

  <div class="top">
    <h1 class="h2" data-t="aliasTitle"></h1>
    <button class="linkish" id="out" data-t="signOut"></button>
  </div>
  <p class="lede" data-t="aliasIntro"></p>

  <nav class="nav">
    <a href="alias_aliases.html" class="on" data-t="navAliases"></a>
    <a href="alias_invite.html" data-t="navInvite"></a>
    <a href="alias_join.html" data-t="navJoin"></a>
    <a href="alias_contacts.html" data-t="navContacts"></a>
  </nav>

  <ul class="list" id="list"></ul>

  <div class="sect" data-t="aliasNew"></div>
  <div class="field">
    <label for="name" data-t="aliasNameLbl"></label>
    <input id="name" type="text" maxlength="20" autocomplete="off">
    <p class="hint" data-t="aliasNameHint"></p>
  </div>
  <button class="btn" id="make" data-t="aliasNew"></button>

  <div id="err" class="err"></div>
  <div id="ok" class="ok"></div>

</div>

<script>
/* =====================================================================
   내 별칭 — personas 표
   상대마다 다른 얼굴을 보여주기 위한 것입니다.
   ⚠ 로그인 닉네임과 다릅니다. 닉네임은 아무에게도 안 보입니다.
   ===================================================================== */

let me = null;
let aliases = [];

function showErr(msg){
  const el = document.getElementById('err');
  el.textContent = msg; el.classList.add('show');
  document.getElementById('ok').classList.remove('show');
}
function showOk(msg){
  const el = document.getElementById('ok');
  el.textContent = msg; el.classList.add('show');
  document.getElementById('err').classList.remove('show');
}
function clearMsg(){
  document.getElementById('err').classList.remove('show');
  document.getElementById('ok').classList.remove('show');
}

function paintList(){
  const ul = document.getElementById('list');
  if (!aliases.length) {
    ul.innerHTML = '<li class="empty">' + AL.esc(AL.t('aliasEmpty')) + '</li>';
    return;
  }
  ul.innerHTML = aliases.map(function(a){
    return '<li class="row">' +
      '<div class="row-main">' +
        '<span class="row-name">' + AL.esc(a.display_name) + '</span>' +
        (a.is_default ? '<span class="badge">' + AL.esc(AL.t('aliasDefault')) + '</span>' : '') +
      '</div>' +
      (a.is_default ? '' :
        '<div class="row-acts">' +
          '<button data-def="' + AL.esc(a.id) + '">' + AL.esc(AL.t('aliasMakeDef')) + '</button>' +
        '</div>') +
    '</li>';
  }).join('');

  ul.querySelectorAll('[data-def]').forEach(function(btn){
    btn.addEventListener('click', function(){ makeDefault(btn.getAttribute('data-def')); });
  });
}

async function reload(){
  try {
    aliases = await AL.loadAliases();
    paintList();
  } catch (e) {
    console.error(e);
    showErr(AL.t('errGeneric', { msg: e.message || String(e) }));
  }
}

async function makeAlias(){
  clearMsg();
  const name = document.getElementById('name').value.trim();
  if (name.length < 1 || name.length > 20) { showErr(AL.t('errAliasName')); return; }

  // 같은 이름이 있으면 막습니다. 초대를 보낼 때 어느 것인지 헷갈립니다.
  const dup = aliases.some(function(a){ return a.display_name === name; });
  if (dup) { showErr(AL.t('errAliasDup')); return; }

  const btn = document.getElementById('make');
  btn.disabled = true;
  try {
    const res = await AL.sb.from('personas').insert({
      account_id: me.id,
      display_name: name,
      is_default: aliases.length === 0,   // 첫 별칭은 자동으로 기본이 됩니다
    });
    if (res.error) throw res.error;
    document.getElementById('name').value = '';
    showOk(AL.t('aliasCreated'));
    await reload();
  } catch (e) {
    console.error(e);
    showErr(AL.t('errGeneric', { msg: e.message || String(e) }));
  } finally {
    btn.disabled = false;
  }
}

async function makeDefault(id){
  clearMsg();
  try {
    // ⚠ personas 에 "계정당 기본은 하나"라는 부분 유니크 인덱스가 걸려 있습니다.
    //   그래서 먼저 다 내리고 나서 하나를 올려야 합니다. 순서를 바꾸면 충돌합니다.
    const down = await AL.sb.from('personas')
      .update({ is_default: false })
      .eq('account_id', me.id).eq('is_default', true);
    if (down.error) throw down.error;

    const up = await AL.sb.from('personas').update({ is_default: true }).eq('id', id);
    if (up.error) throw up.error;

    await reload();
  } catch (e) {
    console.error(e);
    showErr(AL.t('errGeneric', { msg: e.message || String(e) }));
  }
}

document.getElementById('make').addEventListener('click', makeAlias);
document.getElementById('name').addEventListener('keydown', function(e){
  if (e.key === 'Enter') makeAlias();
});
document.getElementById('out').addEventListener('click', AL.signOut);

(async function(){
  AL.paintText();
  me = await AL.requireLogin();
  if (!me) return;
  await reload();
})();
</script>
</body>
</html>
