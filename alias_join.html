<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alias</title>
<link rel="stylesheet" href="alias_common.css?v=20260906m">
<link rel="stylesheet" href="alias_theme.css?v=20260906m">
<script src="alias_config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="alias_common.js?v=20260906m"></script>
<script src="alias_qr.js?v=20260906m"></script>
<script>
/* ⚠ alias_common.js 를 못 읽으면 화면이 텅 빕니다. 글씨를 채우는 것이
   그 파일이기 때문입니다. 빈 화면만 보면 원인을 알 수가 없어서,
   여기서 잡아 사람 말로 알려줍니다.
   가장 흔한 원인은 anon 열쇠 줄이 두 줄로 나뉜 것입니다. */
document.addEventListener("DOMContentLoaded", function(){
  if (typeof AL === "undefined" || typeof AL.t !== "function") {
    document.body.innerHTML =
      '<div style="padding:26px;font-family:system-ui,sans-serif;line-height:1.8;' +
      'color:#DDE5F0;background:#0E1621;min-height:100vh">' +
      '<b style="font-size:17px">alias_common.js 를 못 읽었습니다.</b><br><br>' +
      '가장 흔한 원인은 anon 열쇠 줄이 두 줄로 나뉜 것입니다.<br>' +
      'alias_common.js 20번 줄이 한 줄인지 확인하세요.<br><br>' +
      '<span style="color:#7E8FA6">F12 → Console 에 진짜 원인이 찍힙니다.</span></div>';
    return;
  }
  AL.bootTheme();
});
</script>
</head>
<body data-t-title="ttJoin">
<div class="wrap">

  <div class="tophead" style="margin-bottom:10px"><a class="backlink" href="alias_contacts.html" data-t="dtlBack"></a><span class="gohome"><a href="alias_contacts.html" data-t="goHome"></a><a href="alias_me.html" data-t="goMe"></a></span></div>
  <div class="top">
    <h1 class="h2" data-t="joinTitle"></h1>
  </div>
  <p class="lede" data-t="joinIntro"></p>

  <div id="formPart">
    <!-- 마주 보고 있으면 찍는 것이 가장 쉽고 안전합니다 -->
    <button class="btn" id="scanBtn" data-t="qrScan"></button>
    <p class="qr-note" data-t="qrNote"></p>

    <div class="field">
      <label for="code" data-t="qrOrCode"></label>
      <input id="code" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>

    <div class="field">
      <label for="face" id="faceLab" data-t="joinFaceLbl"></label>
      <button type="button" class="btn ghost" id="face" style="margin-top:0;text-align:left"></button>
      <input type="hidden" id="faceId">
    </div>

    <div class="field" id="labelRow">
      <label for="label" data-t="joinLabelLbl"></label>
      <input id="label" type="text" maxlength="40" autocomplete="off">
      <p class="hint" data-t="joinLabelHint"></p>
    </div>

    <button class="btn" id="go" data-t="joinBtn"></button>
    <div id="err" class="err"></div>
  </div>

  <div id="donePart" class="step">
    <h2 class="h2" data-t="joinOkTtl"></h2>
    <p class="lede" data-t="joinOkSub"></p>
    <a class="btn" href="alias_contacts.html" style="display:block;text-align:center;text-decoration:none;line-height:1.2;" data-t="joinGoList"></a>
  </div>

</div>

<script>
/* =====================================================================
   초대 받기 — use_invite() 를 부릅니다.
   ⚠ 링크 한 개와 양쪽 두 줄이 한 번에 만들어집니다.
     화면에서 links/link_sides 에 직접 넣을 수 없습니다(정책이 막습니다).
     아직 링크가 없는 사이라 RLS로는 풀 수 없어서, 함수가 대신 합니다.
   ===================================================================== */

let me = null;
let aliases = [];
let joining = false;   // 중복 클릭 자물쇠

/* use_invite 가 돌려주는 error 코드를 사람 말로 바꿉니다. */
const ERR_MAP = {
  not_logged_in: 'errNotLoggedIn',
  not_found:     'errNotFound',
  revoked:       'errRevoked',
  expired:       'errExpired',
  used_up:       'errUsedUp',
  already_used:  'errAlreadyUsed',
  own_invite:    'errOwnInvite',
  bad_persona:   'errBadPersona',
};

function showErr(msg){
  const el = document.getElementById('err');
  el.textContent = msg; el.classList.add('show');
}
function clearErr(){ document.getElementById('err').classList.remove('show'); }

let chosen = null;

function paintFaces(){
  if (!chosen) chosen = aliases.filter(function(a){ return a.is_default; })[0] || aliases[0] || null;
  document.getElementById('face').textContent = chosen ? chosen.display_name : AL.t('pkNew');
  document.getElementById('faceId').value = chosen ? chosen.id : '';
}

document.getElementById('face').addEventListener('click', async function(){
  const picked = await AL.pickAlias({ currentId: chosen ? chosen.id : null });
  if (!picked) return;
  chosen = picked;
  if (!aliases.some(function(a){ return a.id === picked.id; })) aliases.push(picked);
  document.getElementById('go').disabled = false;
  clearErr();
  paintFaces();
});

/* 방 초대인지 먼저 알아봅니다.
   ⚠ 방 초대에는 "이 사람을 뭐라고 부를까요" 가 필요 없습니다.
     상대가 여럿이라 부를 이름이 하나가 아닙니다. */
let intoRoom = null;

async function peekInvite(code){
  if (!code) return null;
  try {
    const res = await AL.sb.from('invites')
      .select('into_link_id').eq('code', code).maybeSingle();
    return res.data ? res.data.into_link_id : null;
  } catch (e) { return null; }
}

function paintForRoom(isRoom){
  intoRoom = isRoom;
  // 방 초대면 별명 칸을 감추고 문구를 바꿉니다.
  const labelRow = document.getElementById('labelRow');
  if (labelRow) labelRow.style.display = isRoom ? 'none' : '';
  document.getElementById('go').textContent =
    AL.t(isRoom ? 'grJoinRoom' : 'joinBtn');
  const faceLab = document.getElementById('faceLab');
  if (faceLab) faceLab.textContent = AL.t(isRoom ? 'grJoinAs' : 'joinFaceLbl');
}

async function join(){
  // ⚠ 버튼을 빠르게 두 번 누르면 두 번째가 첫 번째의 disabled 보다 먼저
  //   들어올 수 있습니다. 그러면 링크가 두 개 생깁니다. 자물쇠를 하나 둡니다.
  //   (서버의 use_invite 에도 같은 검사가 있습니다. 두 겹입니다.)
  if (joining) return;
  joining = true;

  clearErr();
  const code = document.getElementById('code').value.trim();
  if (!code) { showErr(AL.t('errJoinCode')); joining = false; return; }
  if (!aliases.length) { showErr(AL.t('errNoAlias')); joining = false; return; }

  const btn = document.getElementById('go');
  btn.disabled = true;
  try {
    // 방 초대인지 먼저 봅니다. into_link_id 가 있으면 그 방에 들어갑니다.
    const peek = await AL.sb.from('invites')
      .select('into_link_id').eq('code', code).maybeSingle();

    if (peek.data && peek.data.into_link_id) {
      const r = await AL.sb.rpc('join_room', {
        p_code: code, p_persona_id: chosen.id,
      });
      if (r.error) throw r.error;
      location.href = 'alias_chat.html?link=' + encodeURIComponent(r.data);
      return;
    }

    const res = await AL.sb.rpc('use_invite', {
      p_code: code,
      p_my_persona_id: document.getElementById('faceId').value,
      p_peer_label: document.getElementById('label').value.trim() || null,
    });
    if (res.error) throw res.error;

    const out = res.data || {};
    if (!out.ok) {
      const key = ERR_MAP[out.error];
      showErr(key ? AL.t(key) : AL.t('errGeneric', { msg: out.error || '?' }));
      btn.disabled = false; joining = false;
      return;
    }

    document.getElementById('formPart').style.display = 'none';
    document.getElementById('donePart').classList.add('on');

  } catch (e) {
    console.error(e);
    showErr(AL.t('errGeneric', { msg: e.message || String(e) }));
    btn.disabled = false; joining = false;
  }
}

document.getElementById('scanBtn').addEventListener('click', async function(){
  const raw = await AL.openScanner();
  if (!raw) return;
  const code = AL.codeFromScan(raw);
  if (!code) { showErr(AL.t('errNotFound')); return; }
  document.getElementById('code').value = code;
  clearErr();
  paintForRoom(!!await peekInvite(code));
  join();
});

document.getElementById('code').addEventListener('input', async function(){
  const v = this.value.trim();
  if (v.length >= 6) paintForRoom(!!await peekInvite(v));
});

document.getElementById('go').addEventListener('click', join);
document.getElementById('label').addEventListener('keydown', function(e){
  if (e.key === 'Enter') join();
});

(async function(){
  AL.paintText();

  // 🔴 앱이 없는 사람이 QR 을 찍으면 여기로 옵니다. 로그인이 안 되어 있으면
  //   코드를 들고 가입 화면으로 보냅니다. 안 그러면 가입한 뒤 초대가
  //   사라져서 QR 을 다시 찍어달라고 해야 합니다.
  const sess = await AL.sb.auth.getSession();
  if (!sess.data.session) {
    location.replace('alias_auth.html?next=' +
      encodeURIComponent('alias_join.html' + location.search));
    return;
  }

  me = await AL.requireLogin();
  if (!me) return;

  // 초대 주소로 들어오면 코드가 미리 채워집니다: alias_join.html?c=XXXX
  const fromUrl = new URLSearchParams(location.search).get('c');
  if (fromUrl) paintForRoom(!!await peekInvite(fromUrl));
  if (fromUrl) document.getElementById('code').value = fromUrl;

  try {
    aliases = await AL.loadAliases();
  } catch (e) { console.error(e); }

  if (!aliases.length) {
    // ⚠ 가입 직후에는 별칭이 없습니다. 고르개가 바로 만들기부터 띄웁니다.
    const made = await AL.pickAlias({ note: AL.t('errNoAlias') });
    if (made) {
      aliases.push(made);
      chosen = made;
      clearErr();
    } else {
      showErr(AL.t('errNoAlias'));
      document.getElementById('go').disabled = true;
    }
  }
  if (!AL.canScanQr()) document.getElementById('scanBtn').style.display = 'none';
  paintFaces();
  AL.startAlerts();      // 어느 화면에 있든 새 메시지를 알려줍니다
})();
</script>
</body>
</html>
