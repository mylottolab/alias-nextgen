<script>
/* ⚠ alias_common.js 를 못 읽으면 화면이 텅 빕니다. 글씨를 채우는 것이
   그 파일이기 때문입니다. 빈 화면만 보면 원인을 알 수가 없어서,
   여기서 잡아 사람 말로 알려줍니다.
   가장 흔한 원인은 anon 열쇠 줄이 두 줄로 나뉜 것입니다. */
document.addEventListener("DOMContentLoaded", function(){
  if (typeof AL === "undefined" || typeof AL.t !== "function") {
    document.body.innerHTML =
      '<div style="padding:26px;font-family:system-ui,sans-serif;line-height:1.8;' +
      'color:#DDE5F0;background:#0E1621;min-height:100vh">' +
      '<b style="font-size:17px">alias_common.js 를 못 읽었습니다.</b><br><br>' +
      '가장 흔한 원인은 anon 열쇠 줄이 두 줄로 나뉜 것입니다.<br>' +
      'alias_common.js 20번 줄이 한 줄인지 확인하세요.<br><br>' +
      '<span style="color:#7E8FA6">F12 → Console 에 진짜 원인이 찍힙니다.</span></div>';
    return;
  }
  AL.bootTheme();
});
</script>

<!-- 🔴 2026-09-19 — 녹음 듣기 (화면 위에 겹쳐서)
     ⚠ 전에는 화면 맨 아래에 두었는데 탭에 가려 안 보였습니다.

<script>
/* =====================================================================
   통화기록
   ⚠ 어떤 얼굴로 한 통화였는지가 함께 남습니다.
     나중에 기록을 되짚을 때 "무슨 얘길 했더라" 보다
     "내가 그때 누구였더라" 가 안 풀리면 곤란합니다.
   ⚠ 별칭별로 묶으면 일과 사생활이 목록에서 갈립니다.
     다른 전화기가 못 하는 정리입니다.
   ===================================================================== */

let rows = [];
let grouped = false;
let myFaces = {};   // 🔴 2026-09-13 — 내 별칭 이름 → 사진 경로
let recs = {};      // 🔴 2026-09-19 — call_id → 녹음 한 줄
let peerPics = {};  // 🔴 2026-09-19 — link_id → 상대 사진 경로

function showErr(msg){
  const el = document.getElementById('err');
  el.textContent = msg; el.classList.add('show');
}

/* ⚠ 2026-09-19 — 이 도우미가 없으면 아래 줄들이 그 자리에서 멈추고
   화면이 통째로 빕니다. 반드시 **스크립트 안**에 있어야 합니다.
   한 번 <style> 안에 잘못 넣어 통화기록이 먹통이 됐습니다. */
function el(id){ return document.getElementById(id); }

/* 🔴 2026-09-19 — 녹음 듣기 창

   ⚠ 화면 위에 겹쳐 띄웁니다. 아래에 두면 탭에 가려 안 보이고,
     소리만 나면서 멈출 수도 없습니다.
   ⚠ 지우기 전에 **내려받을 기회**를 드립니다. 90일이 지나면 사라지니,
     정말 필요한 것은 폰에 챙겨두셔야 합니다. */
let rpUrl = null, rpName = 'alias-record.webm';

function openPlayer(url, rec){
  rpUrl = url;
  var vid = (rec.kind === 'video');
  var ext = (rec.path || '').split('.').pop() || 'webm';
  rpName = 'Alias_' + (vid ? '녹화_' : '녹음_') +
           (rec.purge_on || '').slice(0, 10) + '.' + ext;

  el('rpTitle').textContent = AL.t('rcLeft', { n: daysLeft(rec) });
  el('rpSave').textContent = AL.t('rcDownload');
  el('rpClose').textContent = AL.t('close');

  /* 🔴 2026-09-19 — 영상이면 영상 자리로, 소리면 소리 자리로 */
  el('rpBox').classList.toggle('vid', vid);
  var pl = el(vid ? 'recPlayV' : 'recPlay');
  pl.src = url;

  el('rpBg').classList.add('on');
  el('rpBox').classList.add('on');
  pl.play().catch(function(){});
}

function closePlayer(){
  ['recPlay', 'recPlayV'].forEach(function(id){
    var p = el(id);
    if (!p) return;
    try { p.pause(); p.removeAttribute('src'); p.load(); } catch (e) {}
  });
  el('rpBg').classList.remove('on');
  el('rpBox').classList.remove('on');
}

el('rpBg').addEventListener('click', closePlayer);
el('rpClose').addEventListener('click', closePlayer);
/* 🔴🔴 2026-09-19 — 앱에서는 자바 창구로 내려받습니다.

   앱 화면(웹뷰)은 <a download> 를 눌러도 **아무 일도 안 일어납니다.**
   오류도 안 납니다. 인쇄와 같은 자리입니다(함정 98).

   ⚠ 옛 APK 에는 창구가 없습니다. 있는지부터 보고, 없으면 브라우저로
     열라고 알려드립니다. */
function appCanDownload(){
  try {
    return !!(window.AliasNative &&
              typeof AliasNative.download === 'function' &&
              (typeof AliasNative.canDownload !== 'function' || AliasNative.canDownload()));
  } catch (e) { return false; }
}

el('rpSave').addEventListener('click', function(){
  if (!rpUrl) return;

  if (appCanDownload()) {
    try {
      AliasNative.download(rpUrl, rpName);
      alert(AL.t('rcDownStarted'));
      return;
    } catch (e) { console.error('[rec] 자바 창구 실패', e); }
  }

  var inApp = !!(window.AliasNative ||
    (window.Capacitor && window.Capacitor.isNativePlatform &&
     window.Capacitor.isNativePlatform()));
  if (inApp) { alert(AL.t('rcDownNoApp')); return; }

  var a = document.createElement('a');
  a.href = rpUrl; a.download = rpName; a.target = '_blank';
  document.body.appendChild(a); a.click(); a.remove();
});

/* 🔴 2026-09-19 — 며칠 남았나 */
function daysLeft(rec){
  if (!rec || !rec.purge_on) return 0;
  var ms = new Date(rec.purge_on).getTime() - Date.now();
  return Math.max(0, Math.ceil(ms / 86400000));
}

function dirLabel(r){
  /* 🔴 2026-09-12 — 거절과 부재중을 갈라 적습니다.
     전에는 둘 다 "부재중" 이었습니다. 손님에게는 아주 다른 일입니다.
       부재중 — 상대가 못 봤습니다. 다시 걸어볼 만합니다.
       거절   — 상대가 지금은 안 받겠다고 했습니다. */
  if (r.ended_reason === 'declined') return AL.t('clRejected');
  if (r.ended_reason === 'no_answer') return AL.t('clMissed');
  return AL.t(r.outgoing ? 'clOut' : 'clIn');
}

function rowHtml(r){
  const shown = r.peer_label || r.peer_display || AL.t('cntUnnamed');
  const missed = (r.ended_reason === 'no_answer' || r.ended_reason === 'declined');
  const dur = r.duration_seconds
    ? Math.floor(r.duration_seconds / 60) + ':' + String(r.duration_seconds % 60).padStart(2, '0')
    : '';
  return '<div class="crow callrow" data-go="' + AL.esc(r.link_id) + '">' +
    /* 🔴🔴 2026-09-16 — **큰 쪽이 상대**로 통일했습니다.

       사진도 글자도 큰 쪽이 상대를 가리킵니다. 연락처·부름 화면과
       같은 규칙입니다. 규칙이 하나여야 손님이 안 헷갈립니다.

       전에는 큰 동그라미가 **내 얼굴**이었습니다. "내가 그때 누구였더라"
       를 중히 본 것인데, 정작 통화기록에서 제일 흔한 일은
       **"이 사람에게 다시 걸자"** 입니다. 그러려면 상대가 보여야 합니다.

       "내가 그때 누구였나" 는 이름 옆 작은 얼굴표로 남습니다.

       ⚠ my_calls() 가 상대 사진을 안 줄 수도 있습니다. 그때는 상대
         이름의 첫 글자와 색이 나옵니다. 그것만으로도 줄마다 갈립니다. */
    '<div class="cav"' + AL.faceAttr(shown || '') +
      /* 함수가 준 것이 먼저, 없으면 연락처에서 빌린 것 */
      ((r.peer_avatar || peerPics[r.link_id])
        ? ' data-face="' + AL.esc(r.peer_avatar || peerPics[r.link_id]) + '"' : '') + '>' +
      AL.esc(AL.initial(shown)) + '</div>' +
    '<div class="cmid">' +
      '<div class="cname">' + AL.esc(shown) +
        /* 이 통화에서 내가 쓴 얼굴 */
        '<span class="mymark"' + AL.faceAttr(r.my_face || '') +
          (myFaces[r.my_face] ? ' data-face="' + AL.esc(myFaces[r.my_face]) + '"' : '') +
          ' title="' + AL.esc(r.my_face || '') + '">' +
          AL.esc(AL.initial(r.my_face)) + '</span>' +
      '</div>' +
      '<div class="csub"><span class="dir' + (missed ? ' missed' : '') + '">' +
        AL.esc(dirLabel(r)) + '</span>' +
        (dur ? ' · ' + AL.esc(dur) : '') +
        ' · ' + AL.esc(r.my_face || '') + '</div>' +
      /* 🔴 2026-09-19 — 녹음이 있으면 듣는 자리를 냅니다.
         ⚠ 언제 지워지는지 함께 적습니다. 모르고 있다 잃으면 안 됩니다. */
      (recs[r.call_id]
        ? '<div class="crec">' +
            '<button data-play="' + AL.esc(r.call_id) + '">' +
              AL.esc(AL.t(recs[r.call_id].kind === 'video' ? 'rcPlayVid' : 'rcPlay')) +
              '</button>' +
            '<span>' + AL.esc(AL.t('rcLeft', { n: daysLeft(recs[r.call_id]) })) + '</span>' +
            '<button data-rdel="' + AL.esc(recs[r.call_id].id) + '" ' +
              'data-rpath="' + AL.esc(recs[r.call_id].path) + '">✕</button>' +
          '</div>'
        : '') +
    '</div>' +
    '<div class="ctime">' + AL.esc(AL.fmtShort(r.created_at)) + '</div>' +
  '</div>';
}

function paint(){
  const box = document.getElementById('list');
  if (!rows.length) {
    box.innerHTML = '<div class="empty">' + AL.esc(AL.t('callsEmpty')) + '</div>';
    return;
  }

  if (!grouped) {
    box.innerHTML = rows.map(rowHtml).join('');
  } else {
    const order = [], bag = {};
    rows.forEach(function(r){
      const k = r.my_face || '';
      if (!bag[k]) { bag[k] = []; order.push(k); }
      bag[k].push(r);
    });
    box.innerHTML = order.map(function(k){
      return '<div class="grp">' +
          '<span class="gav"' + AL.faceAttr(k) +
            (myFaces[k] ? ' data-face="' + AL.esc(myFaces[k]) + '"' : '') + '>' +
            AL.esc(AL.initial(k)) + '</span>' +
          '<span class="gname">' + AL.esc(k) + '</span>' +
          '<span class="gcount">' + AL.esc(AL.t('cntCount', { n: bag[k].length })) + '</span>' +
        '</div>' + bag[k].map(rowHtml).join('');
    }).join('');
  }

  /* 🔴 2026-09-19 — 녹음 듣기·지우기 */
  /* ⚠ 줄 전체에 "대화로 가기" 가 걸려 있습니다. 단추 누름이 줄까지
     번지면 소리를 듣기도 전에 대화창으로 넘어갑니다.
     stopPropagation 으로 여기서 끊습니다. */
  box.querySelectorAll('[data-play]').forEach(function(b){
    b.addEventListener('click', async function(ev){
      ev.preventDefault();
      ev.stopPropagation();
      var rec = recs[b.getAttribute('data-play')];
      if (!rec) return;
      var url = await AL.recordUrl(rec.path);
      if (!url) { alert(AL.t('rcFailed')); return; }
      openPlayer(url, rec);
    });
  });
  box.querySelectorAll('[data-rdel]').forEach(function(b){
    b.addEventListener('click', async function(ev){
      ev.preventDefault();
      ev.stopPropagation();
      if (!confirm(AL.t('rcDelAsk'))) return;
      var id = b.getAttribute('data-rdel');
      var path = b.getAttribute('data-rpath');
      try {
        await AL.sb.storage.from('alias-records').remove([path]);
      } catch (e) {}
      var res = await AL.sb.from('call_records').delete().eq('id', id);
      if (res.error) { alert(AL.t('rcFailed')); return; }
      await reload();
    });
  });

  AL.paintFaces(box);   // 🔴 2026-09-13 — 사진은 오는 대로 덮어씁니다

  box.querySelectorAll('[data-go]').forEach(function(el){
    el.addEventListener('click', function(){
      location.href = 'alias_chat.html?link=' + encodeURIComponent(el.getAttribute('data-go'));
    });
  });
}

async function reload(){
  try {
    const res = await AL.sb.rpc('my_calls', { p_limit: 100 });
    if (res.error) throw res.error;
    rows = res.data || [];
    myFaces = await AL.myFaceMap();   // 🔴 2026-09-13

    /* 🔴 2026-09-19 — 이 통화들에 녹음이 있는지 한 번에 읽습니다.
       ⚠ 줄마다 따로 물으면 스무 통이면 스무 번입니다. */
    /* 🔴 2026-09-19 — 상대 사진.

       my_calls() 가 peer_avatar 를 돌려줍니다(alias_mycalls_v2.sql).
       ⚠ 옛 함수를 쓰는 동안에는 그 칸이 비어 옵니다. 그때는 예전처럼
         연락처에서 빌려 씁니다. 함수를 고치기 전에도 화면이 멀쩡하게
         돌아야 하니까요.
       ⚠ 연락처에서 빌리는 길은 **끊긴 관계의 통화**에서는 안 통합니다.
         연락처에 그 줄이 없으니까요. 함수를 고치면 그것도 나옵니다. */
    peerPics = {};
    var needBorrow = rows.some(function(r){ return r.peer_avatar === undefined; });
    if (needBorrow) {
      try {
        var cs = await AL.sb.rpc('my_contacts');
        (cs.data || []).forEach(function(c){
          if (c.peer_avatar) peerPics[c.link_id] = c.peer_avatar;
        });
      } catch (e) { console.warn('[calls] 상대 사진을 못 읽었습니다', e); }
    }

    recs = {};
    try {
      var ids = rows.map(function(r){ return r.call_id; }).filter(Boolean);
      if (ids.length) {
        var rr = await AL.sb.from('call_records')
          .select('id, call_id, kind, path, duration_ms, keep_days, purge_on')
          .in('call_id', ids);
        (rr.data || []).forEach(function(x){ recs[x.call_id] = x; });
      }
    } catch (e) { console.warn('[rec] 녹음 목록을 못 읽었습니다', e); }

    paint();
  } catch (e) {
    console.error(e);
    showErr(AL.t('errGeneric', { msg: e.message || String(e) }));
  }
}

document.getElementById('grpBtn').addEventListener('click', function(){
  grouped = !grouped;
  this.classList.toggle('on', grouped);
  paint();
});

(async function(){
  AL.paintText();
  if (!await AL.requireLogin()) return;
  await reload();
  AL.showPlanBar();   // 🔴 2026-09-14
  AL.showPushBar();   // 🔴 2026-09-15 — 전화를 못 받는 상태면 알립니다
  AL.showExpiringBar();   // 🔴 2026-09-19 — 곧 지워질 녹음
  AL.startAlerts();

  // 여기서도 걸려온 전화를 받습니다.
  AL.watchIncoming(function(c){
    AL.alertNew();
    location.href = 'alias_call.html?call=' + encodeURIComponent(c.call_id) +
      '&token=' + encodeURIComponent(c.session_token) +
      '&link=' + encodeURIComponent(c.link_id) +
      '&type=' + encodeURIComponent(c.call_type) +
      '&once=' + encodeURIComponent(c.call_id);
  });
})();
</script>
