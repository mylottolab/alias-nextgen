<style>
/* 🔴 2026-09-19 — 배경 사진과 어둠막 */
/* 배경 미리보기와 진하기 고르개 */
.cvprev{width:100%;height:120px;border-radius:14px;margin:0 0 12px;
  background-size:cover;background-position:center;
  border:1px solid rgba(255,255,255,.14)}
.cvdims{display:flex;gap:8px}
.cvdims button{flex:1;padding:12px 0;border-radius:12px;cursor:pointer;
  font-size:14px;font-weight:700;background:rgba(255,255,255,.07);color:inherit;
  border:1.5px solid rgba(255,255,255,.14)}
.cvdims button.on{background:rgba(143,227,176,.18);color:#8FE3B0;
  border-color:rgba(143,227,176,.55)}

#cvBg{position:fixed;inset:0;z-index:0;display:none;
  background-size:cover;background-position:center;background-repeat:no-repeat}
#cvDim{position:fixed;inset:0;z-index:0;display:none;background:#000}
#cvBg.on, #cvDim.on{display:block}
/* ⚠ 내용이 배경 위에 와야 합니다. 안 그러면 배경에 덮여 안 보입니다. */
body > .gwrap, body > nav.tabbar{position:relative;z-index:1}

/* =====================================================================
   🔴 2026-09-18 신설 — 갤러리

   ⚠ 공용 CSS 를 안 건드리려고 여기에 다 적습니다.
   ⚠ 보는 화면과 꾸미는 화면이 **같은 화면**입니다. 꾸미면서 손님에게
     어떻게 보이는지 바로 알 수 있어야 합니다. 따로 두면 오가며
     확인해야 합니다.
   ===================================================================== */
.gwrap{padding:16px 16px 96px;max-width:560px;margin:0 auto}

.ghead{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
.ghead .gav{width:58px;height:58px;flex:0 0 58px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:800;
  background-repeat:no-repeat;background-size:cover;background-position:center}
.ghead .gnm{flex:1;min-width:0}
.ghead .gnm b{display:block;font-size:19px;font-weight:800}
.ghead .gnm span{display:block;font-size:12.5px;opacity:.6;margin-top:3px}
.ghead .gbtn{flex:0 0 auto;padding:9px 15px;border-radius:999px;cursor:pointer;
  font-size:13.5px;font-weight:700;background:rgba(255,255,255,.08);color:inherit;
  border:1px solid rgba(255,255,255,.18)}

.gline{margin:0 0 18px;padding:14px 16px;border-radius:14px;font-size:16px;
  line-height:1.7;word-break:keep-all;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1)}
.gline.empty{opacity:.45;font-size:14px}

.gmusic{display:flex;align-items:center;gap:10px;margin:0 0 18px;
  padding:11px 14px;border-radius:12px;font-size:13.5px;
  background:rgba(143,227,176,.12);color:#8FE3B0;
  border:1px solid rgba(143,227,176,.3)}
.gmusic span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.gmusic button{flex:0 0 auto;padding:7px 13px;border-radius:999px;cursor:pointer;
  font-size:12.5px;font-weight:700;background:rgba(255,255,255,.12);
  color:inherit;border:1px solid currentColor}

/* 사진·영상 — 두 칸씩 */
.ggrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 20px}
.gcell{position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;
  background:rgba(255,255,255,.06);cursor:pointer}
.gcell img, .gcell video{width:100%;height:100%;object-fit:cover;display:block}
.gcell .vmark{position:absolute;left:8px;bottom:8px;padding:3px 8px;
  border-radius:999px;font-size:11px;font-weight:700;
  background:rgba(0,0,0,.6);color:#fff}
.gcell .gdel{position:absolute;right:6px;top:6px;width:28px;height:28px;
  border-radius:50%;cursor:pointer;font-size:14px;line-height:1;
  background:rgba(0,0,0,.6);color:#fff;border:0}

/* 🔴 2026-09-19 — 순서 바꾸는 화살표
   ⚠ 끌어다 놓기는 폰에서 스크롤과 헷갈립니다. 화살표가 확실합니다. */
/* ⚠ 칸을 눌렀을 때 번쩍이는 효과를 화살표 위에서는 끕니다. */
.gcell .gmove button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.gcell .gmove{position:absolute;left:0;right:0;bottom:0;
  display:flex;justify-content:space-between;padding:6px;
  background:linear-gradient(transparent, rgba(0,0,0,.55))}
.gcell .gmove button{width:32px;height:32px;border-radius:50%;cursor:pointer;
  font-size:13px;line-height:1;background:rgba(0,0,0,.62);color:#fff;border:0}
.gcell .gmove button:disabled{opacity:.4}
.gcell .gmove span{width:32px}

.gempty{padding:40px 20px;text-align:center;border-radius:16px;
  border:1px dashed rgba(255,255,255,.18);opacity:.6;font-size:14px;
  line-height:1.8;word-break:keep-all}

/* 🔴 유튜브는 **맨 아래**에 둡니다 (사장님 요청).
   ⚠ 작게 숨기지 않습니다. 유튜브 약관이 금지합니다. 영상과 광고가
     제대로 보여야 저작권자에게 수익이 갑니다. */
.gyt{margin:22px 0 0}
.gyt .gytt{font-size:13px;font-weight:700;opacity:.65;margin:0 2px 8px}
.gyt .box{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;
  overflow:hidden;background:#000}
.gyt iframe{width:100%;height:100%;border:0;display:block}

/* 꾸미기 */
.gsect{font-size:13px;font-weight:700;opacity:.65;margin:22px 2px 9px}
.gfield{margin:0 0 14px}
.gfield input, .gfield textarea, .gfield select{width:100%;box-sizing:border-box;
  padding:13px 14px;border-radius:12px;font-size:15px;font-family:inherit;
  background:rgba(255,255,255,.06);color:inherit;
  border:1px solid rgba(255,255,255,.14)}
.gfield textarea{min-height:76px;resize:vertical;line-height:1.7}
.gbig{width:100%;margin:0 0 12px;padding:16px 0;border-radius:14px;cursor:pointer;
  font-size:15.5px;font-weight:800;background:rgba(255,255,255,.08);color:inherit;
  border:1px dashed rgba(255,255,255,.24)}
.gsave{width:100%;padding:16px 0;border-radius:14px;cursor:pointer;
  font-size:16px;font-weight:800;background:rgba(143,227,176,.2);color:#8FE3B0;
  border:1px solid rgba(143,227,176,.45)}
.gused{margin:10px 2px 0;font-size:12.5px;opacity:.6}
.gnote{margin:8px 2px 0;font-size:12.5px;line-height:1.7;opacity:.6;
  word-break:keep-all}

.err{display:none;margin:14px 0 0;padding:12px 14px;border-radius:11px;
  background:rgba(255,90,90,.14);color:#FFB4B4;font-size:13.5px;line-height:1.6}
.err.show{display:block}
.ok{display:none;margin:14px 0 0;padding:12px 14px;border-radius:11px;
  background:rgba(143,227,176,.15);color:#8FE3B0;font-size:13.5px}
.ok.show{display:block}
.back{display:inline-block;margin:0 0 10px;font-size:14px;color:#94A3B8;
  text-decoration:none}

/* 크게 보기 */
#gvBg{display:none;position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.92)}
#gvBox{display:none;position:fixed;inset:0;z-index:91;
  align-items:center;justify-content:center;padding:16px}
#gvBox.on{display:flex}
#gvBox img, #gvBox video{max-width:100%;max-height:82vh;border-radius:12px}
#gvClose{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top,0px));
  z-index:92;width:42px;height:42px;border-radius:50%;cursor:pointer;
  font-size:19px;background:rgba(255,255,255,.16);color:#fff;border:0;display:none}
#gvClose.on{display:block}
</style>
</head>

<nav class="tabbar">

<div id="gvBg"></div>
<div id="gvBox"></div>
<button id="gvClose">✕</button>
<audio id="bgm" loop></audio>

<script>
/* =====================================================================
   갤러리
   2026-09-18

     alias_gallery.html?p={별칭번호}          남의 갤러리 보기
     alias_gallery.html?p={별칭번호}&edit=1   내 갤러리 꾸미기

   ⚠ 보는 화면과 꾸미는 화면이 하나입니다. 꾸미면서 "손님에게 어떻게
     보이나" 를 바로 볼 수 있어야 합니다.

   ⚠ 누가 볼 수 있는지는 **정책이 막습니다.** 화면이 아니라 서버가
     판단합니다. 주소를 알아도 이어진 사이가 아니면 아무것도 안 옵니다.
   ===================================================================== */
const P = new URLSearchParams(location.search);
const personaId = P.get('p');
let mine = false;
let data = null;
let music = [];
let editing = (P.get('edit') === '1');

function el(id){ return document.getElementById(id); }
function showErr(m){ const e = el('err'); e.textContent = m; e.classList.add('show');
  el('ok').classList.remove('show'); }
function showOk(m){ const e = el('ok'); e.textContent = m; e.classList.add('show');
  el('err').classList.remove('show'); }
function clearMsg(){ el('err').classList.remove('show'); el('ok').classList.remove('show'); }

/* ── 크게 보기 ───────────────────────────────────────────────── */
function openViewer(url, kind){
  const box = el('gvBox');
  box.innerHTML = (kind === 'video')
    ? '<video src="' + url + '" controls autoplay playsinline></video>'
    : '<img src="' + url + '" alt="">';
  el('gvBg').style.display = 'block';
  box.classList.add('on');
  el('gvClose').classList.add('on');
}
function closeViewer(){
  el('gvBox').classList.remove('on');
  el('gvBox').innerHTML = '';
  el('gvBg').style.display = 'none';
  el('gvClose').classList.remove('on');
}
el('gvBg').addEventListener('click', closeViewer);
el('gvClose').addEventListener('click', closeViewer);

/* ── 보는 화면 그리기 ────────────────────────────────────────── */
async function paintView(){
  el('vline').textContent = data.headline || AL.t('glEmpty');
  el('vline').classList.toggle('empty', !data.headline);

  /* 배경음 — 손님이 눌러야 납니다.
     ⚠ 들어가자마자 소리가 나면 놀랍니다. 그리고 브라우저가 막습니다. */
  const m = music.filter(function(x){ return x.id === data.music_id; })[0];
  if (m) {
    el('vmusic').style.display = '';
    el('vmname').textContent = m.title + (m.artist ? ' · ' + m.artist : '');
    el('bgm').src = AL.musicUrl(m.path) || '';
    el('vmbtn').textContent = AL.t('glPlay');
  } else {
    el('vmusic').style.display = 'none';
  }

  /* 사진·영상 */
  const grid = el('vgrid');
  grid.innerHTML = '';
  if (!data.items.length) {
    el('vempty').style.display = '';
    el('vempty').textContent = mine ? AL.t('glEmptyMine') : AL.t('glEmpty');
  } else {
    el('vempty').style.display = 'none';
    for (const it of data.items) {
      const url = await AL.galleryUrl(it.path);
      if (!url) continue;
      const c = document.createElement('div');
      c.className = 'gcell';
      c.innerHTML = (it.kind === 'video')
        ? '<video src="' + url + '" muted playsinline preload="metadata"></video>' +
          '<span class="vmark">▶</span>'
        : '<img src="' + url + '" alt="" loading="lazy">';
      c.addEventListener('click', function(){ openViewer(url, it.kind); });
      grid.appendChild(c);
    }
  }

  /* 🔴 유튜브는 맨 아래.
     ⚠ 작게 숨기지 않습니다. 유튜브 약관이 금지합니다. */
  if (data.youtube_id) {
    el('vyt').style.display = '';
    el('vytbox').innerHTML =
      '<iframe src="https://www.youtube.com/embed/' + AL.esc(data.youtube_id) + '" ' +
      'title="YouTube" allowfullscreen ' +
      'allow="accelerometer; clipboard-write; encrypted-media; picture-in-picture"></iframe>';
  } else {
    el('vyt').style.display = 'none';
    el('vytbox').innerHTML = '';
  }
}

el('vmbtn').addEventListener('click', function(){
  const a = el('bgm');
  if (a.paused) { a.play().catch(function(){}); this.textContent = AL.t('glStop'); }
  else { a.pause(); this.textContent = AL.t('glPlay'); }
});

/* =====================================================================
   🔴🔴 2026-09-19 신설 — 배경 사진

   ⚠ 이 갤러리에서만 깔립니다. 다른 화면은 설정한 색 그대로입니다.
   ⚠ 어둠막이 반드시 함께 갑니다. 밝은 사진 위에 글씨를 얹으면
     안 읽힙니다. 막이 없으면 "예쁜데 아무것도 안 보이는 화면" 이
     됩니다.
   ===================================================================== */
const DIMS = [[0, 'cvDim0'], [35, 'cvDim35'], [55, 'cvDim55'], [75, 'cvDim75']];

async function paintCover(){
  const bg = el('cvBg'), dm = el('cvDim');
  if (!data.cover_path) {
    bg.classList.remove('on');
    dm.classList.remove('on');
    return;
  }
  const url = await AL.galleryUrl(data.cover_path);
  if (!url) { bg.classList.remove('on'); dm.classList.remove('on'); return; }

  bg.style.backgroundImage = 'url("' + url + '")';
  bg.classList.add('on');
  /* 진하기는 0~85 입니다. 그 이상이면 사진이 안 보여 뜻이 없습니다. */
  dm.style.opacity = String((data.cover_dim == null ? 55 : data.cover_dim) / 100);
  dm.classList.add('on');
}

async function paintCoverEdit(){
  const pv = el('cvPreview');
  if (data.cover_path) {
    const url = await AL.galleryUrl(data.cover_path);
    if (url) { pv.style.backgroundImage = 'url("' + url + '")'; pv.style.display = ''; }
    el('cvPick').textContent = AL.t('cvChange');
    el('cvDel').style.display = '';
    el('cvDel').textContent = AL.t('cvRemove');
  } else {
    pv.style.display = 'none';
    el('cvPick').textContent = AL.t('cvAdd');
    el('cvDel').style.display = 'none';
  }

  const now = (data.cover_dim == null ? 55 : data.cover_dim);
  el('cvDims').innerHTML = DIMS.map(function(d){
    return '<button data-dim="' + d[0] + '"' + (d[0] === now ? ' class="on"' : '') + '>' +
      AL.esc(AL.t(d[1])) + '</button>';
  }).join('');
  el('cvDims').querySelectorAll('[data-dim]').forEach(function(b){
    b.addEventListener('click', async function(){
      const v = Number(b.getAttribute('data-dim'));
      data.cover_dim = v;
      await paintCoverEdit();
      await paintCover();          // 바로 보이게
      const ok = await AL.saveGallery(personaId, { cover_dim: v });
      if (ok !== true) showErr(String(ok));
    });
  });
}

el('cvPick').addEventListener('click', function(){ el('cvFile').click(); });

el('cvFile').addEventListener('change', async function(){
  const f = (this.files || [])[0];
  this.value = '';
  if (!f) return;
  clearMsg();
  const btn = el('cvPick');
  btn.disabled = true;
  btn.textContent = AL.t('glUploading');
  try {
    await AL.uploadCover(personaId, f, data.cover_path);
    data = await AL.loadGallery(personaId);
    await paintCoverEdit();
    await paintCover();
    await paintUsed();
    showOk(AL.t('glSaved'));
  } catch (e) {
    console.error('[cover] 실패', e);
    showErr(e.message || String(e));
  } finally {
    btn.disabled = false;
    await paintCoverEdit();
  }
});

el('cvDel').addEventListener('click', async function(){
  if (!confirm(AL.t('cvRemoveAsk'))) return;
  try {
    await AL.removeCover(personaId, data.cover_path);
    data = await AL.loadGallery(personaId);
    await paintCoverEdit();
    await paintCover();
    await paintUsed();
  } catch (e) {
    showErr(e.message || String(e));
  }
});

/* ── 꾸미는 화면 ─────────────────────────────────────────────── */
async function paintEdit(){
  el('eline').value = data.headline || '';
  el('eyt').value = data.youtube_id
    ? ('https://youtu.be/' + data.youtube_id) : '';

  el('emusic').innerHTML =
    '<option value="">' + AL.esc(AL.t('glMusicNo')) + '</option>' +
    music.map(function(m){
      return '<option value="' + AL.esc(m.id) + '"' +
        (m.id === data.music_id ? ' selected' : '') + '>' +
        AL.esc(m.title + (m.artist ? ' · ' + m.artist : '')) + '</option>';
    }).join('');

  const grid = el('egrid');
  grid.innerHTML = '';
  for (const it of data.items) {
    const url = await AL.galleryUrl(it.path);
    const c = document.createElement('div');
    c.className = 'gcell';
    /* 🔴 2026-09-19 — 화살표로 순서를 바꿉니다.
       ⚠ 맨 앞엣것에는 ◀ 를, 맨 뒤엣것에는 ▶ 를 안 보여줍니다.
         눌러도 아무 일이 없으면 고장인 줄 압니다. */
    const idx = data.items.indexOf(it);
    c.innerHTML =
      (it.kind === 'video'
        ? '<video src="' + (url || '') + '" muted playsinline preload="metadata"></video>' +
          '<span class="vmark">▶</span>'
        : '<img src="' + (url || '') + '" alt="">') +
      '<button class="gdel" data-del="' + AL.esc(it.id) + '">✕</button>' +
      '<div class="gmove">' +
        (idx > 0
          ? '<button data-mv="' + idx + '" data-dir="-1" title="' +
            AL.esc(AL.t('glLeft')) + '">◀</button>' : '<span></span>') +
        (idx < data.items.length - 1
          ? '<button data-mv="' + idx + '" data-dir="1" title="' +
            AL.esc(AL.t('glRight')) + '">▶</button>' : '<span></span>') +
      '</div>';
    grid.appendChild(c);
  }

  /* 순서 바꾸기 */
  grid.querySelectorAll('[data-mv]').forEach(function(b){
    b.addEventListener('click', async function(ev){
      /* ⚠ 칸 전체가 눌린 것처럼 번쩍이는 것을 막습니다. */
      ev.preventDefault();
      ev.stopPropagation();
      const i = Number(b.getAttribute('data-mv'));
      const j = i + Number(b.getAttribute('data-dir'));
      if (j < 0 || j >= data.items.length) return;
      b.disabled = true;
      try {
        /* ⚠ 값이 겹쳐 있으면 맞바꿔도 순서가 안 바뀝니다.
           먼저 0,1,2… 로 고르게 해둡니다. */
        await AL.renumberGallery(personaId);
        data = await AL.loadGallery(personaId);
        await AL.swapGalleryOrder(data.items[i], data.items[j]);
        data = await AL.loadGallery(personaId);
        await paintEdit();
      } catch (e) {
        console.error('[gallery] 순서 바꾸기 실패', e);
        showErr(e.message || String(e));
      } finally {
        b.disabled = false;
      }
    });
  });
  grid.querySelectorAll('[data-del]').forEach(function(b){
    b.addEventListener('click', async function(ev){
      ev.stopPropagation();
      if (!confirm(AL.t('glDelAsk'))) return;
      const id = b.getAttribute('data-del');
      const it = data.items.filter(function(x){ return x.id === id; })[0];
      try {
        await AL.deleteGalleryItem(id, it ? it.path : null);
        data = await AL.loadGallery(personaId);
        await paintEdit();
        await paintUsed();
      } catch (e) {
        showErr(AL.t('errGeneric', { msg: e.message || String(e) }));
      }
    });
  });
}

async function paintUsed(){
  const used = await AL.storageUsed();
  const cap = await AL.storageCap();
  el('eused').textContent = AL.t('glUsed', {
    used: AL.fmtBytes(used), cap: AL.fmtBytes(cap),
  });
}

el('eadd').addEventListener('click', function(){ el('epick').click(); });

el('epick').addEventListener('change', async function(){
  const files = Array.from(this.files || []);
  this.value = '';
  if (!files.length) return;
  clearMsg();
  const btn = el('eadd');
  btn.disabled = true;
  try {
    for (const f of files) {
      btn.textContent = AL.t('glUploading');
      await AL.uploadGalleryItem(personaId, f, function(step){
        btn.textContent = AL.t(step === 'compress' ? 'glSquashing' : 'glUploading');
      });
    }
    data = await AL.loadGallery(personaId);
    await paintEdit();
    await paintUsed();
    showOk(AL.t('glSaved'));
  } catch (e) {
    console.error(e);
    showErr(e.message || String(e));
  } finally {
    btn.disabled = false;
    btn.textContent = AL.t('glAdd');
  }
});

el('esave').addEventListener('click', async function(){
  clearMsg();
  const raw = el('eyt').value.trim();
  let yt = null;
  if (raw) {
    yt = AL.youtubeId(raw);
    if (!yt) { showErr(AL.t('glYtBad')); return; }
  }
  this.disabled = true;
  try {
    /* 🔴 2026-09-18 — 왜 못 저장했는지 그대로 보여줍니다.
       "저장하지 못했습니다" 만으로는 권한인지 칸 이름인지 알 수가
       없습니다(함정 76). */
    const out = await AL.saveGallery(personaId, {
      headline: el('eline').value.trim() || null,
      music_id: el('emusic').value || null,
      youtube_id: yt,
    });
    if (out !== true) throw new Error(String(out || '저장하지 못했습니다'));
    data = await AL.loadGallery(personaId);
    editing = false;
    await paintAll();
    /* 🔴 2026-09-18 — 저장하면 보기 화면으로 돌아갑니다.
       손님에게 어떻게 보이는지 바로 확인하실 수 있게요.
       다른 곳으로 가시려면 아래 탭을 쓰시면 됩니다. */
    showOk(AL.t('glSavedGo'));
    window.scrollTo(0, 0);
  } catch (e) {
    showErr(e.message || String(e));
  } finally {
    this.disabled = false;
  }
});

el('gedit').addEventListener('click', async function(){
  editing = !editing;
  clearMsg();
  await paintAll();
  window.scrollTo(0, 0);
});

/* ── 그리기 ──────────────────────────────────────────────────── */
async function paintAll(){
  el('view').style.display = editing ? 'none' : '';
  el('edit').style.display = editing ? '' : 'none';
  el('gedit').textContent = AL.t(editing ? 'glDone' : 'glEdit');
  /* ⚠ 꾸미는 중에 이 단추를 누르면 **저장 없이** 돌아갑니다.
     아래 [저장하기] 와 다릅니다. 글씨로 갈라 두었습니다. */
  await paintCover();          // 🔴 보기·꾸미기 둘 다 배경이 깔립니다
  if (editing) { await paintEdit(); await paintCoverEdit(); await paintUsed(); }
  else { await paintView(); el('bgm').pause(); }
}

/* =====================================================================
   🔴🔴 2026-09-18 신설 — 뒤로 가기

   무슨 일이 났나
     갤러리에서 안드로이드 뒤로 가기(◁)를 누르면 **앱이 통째로 나가**
     바탕화면으로 갔습니다.

   왜 그런가
     앱은 화면을 옮길 때 대개 location.replace 를 씁니다. 뒤로 갈
     기록을 안 남기는 방식입니다. 통화화면에서는 그게 맞았습니다 —
     끊은 전화가 뒤로 가기로 되살아나면 안 되니까요.
     그런데 갤러리는 **되돌아갈 수 있어야** 합니다.

   ⚠ 손님들은 화면 아래 ◁ 로 돌아가는 데 익숙합니다. 그 버릇을
     거스르면 안 됩니다. 화면 안에 뒤로 단추를 두는 것만으로는
     부족합니다.

   어떻게
     화면이 열릴 때 기록을 하나 심어둡니다(pushState). 뒤로 가기를
     누르면 그 기록이 빠지면서 popstate 가 불리고, 그때 우리가
     원하는 곳으로 보냅니다.

   ⚠ 꾸미는 중이면 먼저 보기 화면으로 돌아갑니다. 한 번에 나가면
     쓰던 것이 날아갑니다.
   ===================================================================== */
/* 🔴 2026-09-18 — 폰의 ◁ 로 한 걸음씩 물러납니다.
   ⚠ 한 번에 나가면 꾸미던 것이 날아갑니다. */
AL.setBack('alias_contacts.html', function(){
  /* 크게 보기가 열려 있으면 그것부터 */
  if (document.getElementById('gvBox').classList.contains('on')) {
    closeViewer();
    return true;
  }
  /* 꾸미는 중이면 보기 화면으로 */
  if (editing) {
    editing = false;
    paintAll();
    window.scrollTo(0, 0);
    return true;
  }
  /* 내 갤러리는 "나" 로 돌아갑니다 */
  if (mine) { location.replace('alias_me.html'); return true; }
  return false;
});

/* ── 시작 ────────────────────────────────────────────────────── */
(async function(){
  AL.paintText();
  /* 🔴 2026-09-18 — 어디서 왔는지에 맞춰 돌아갑니다.
     내 갤러리는 "나" 에서, 남의 갤러리는 연락처에서 옵니다. */
  if (!await AL.requireLogin()) return;
  if (!personaId) { showErr(AL.t('dtlNotFound')); return; }

  /* 이 별칭이 내 것인가.
     ⚠ 내 것이 아니면 personas 정책이 막아 아무것도 안 옵니다.
       그것만으로 "남의 것" 임을 알 수 있습니다. */
  let face = '';
  try {
    const me = await AL.sb.from('personas')
      .select('display_name, avatar_url').eq('id', personaId).maybeSingle();
    if (me.data) { mine = true; face = me.data.display_name || ''; }
  } catch (e) {}

  /* 남의 갤러리면 이름을 연락처에서 찾습니다. */
  if (!mine) {
    try {
      const cs = await AL.sb.rpc('my_contacts');
      const hit = (cs.data || []).filter(function(r){
        return r.peer_display && r.peer_avatar !== undefined;
      });
      const nm = P.get('n');
      face = nm ? decodeURIComponent(nm) : AL.t('glTitle');
    } catch (e) { face = AL.t('glTitle'); }
  }

  el('back').textContent = '‹ ' + AL.t(mine ? 'navMe' : 'navContacts');
  el('back').setAttribute('href', mine ? 'alias_me.html' : 'alias_contacts.html');

  el('gname').textContent = face;
  el('gav').textContent = AL.initial(face);
  AL.paintFace(el('gav'), face);
  el('gwho').textContent = mine ? AL.t('glWhoSees') : '';
  el('gedit').style.display = mine ? '' : 'none';

  music = await AL.loadMusicList();
  data = await AL.loadGallery(personaId);

  /* 남의 갤러리인데 아무것도 못 읽었으면 볼 수 없는 것입니다. */
  if (!mine && !data.headline && !data.items.length && !data.youtube_id) {
    el('view').innerHTML = '<div class="gempty">' + AL.esc(AL.t('glNoSee')) + '</div>';
    return;
  }

  await paintAll();
})();
</script>
