<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alias</title>
<link rel="stylesheet" href="alias_common.css?v=20260905i">
<link rel="stylesheet" href="alias_theme.css?v=20260905i">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="alias_common.js?v=20260905i"></script>
<script src="alias_media.js?v=20260905i"></script>
<script src="alias_extras.js?v=20260905i"></script>
<script>document.addEventListener("DOMContentLoaded",function(){AL.bootTheme();});</script>
</head>
<body class="chat" data-t-title="ttChat">
<div class="chat-wrap">

  <div class="chat-top">
    <button class="back" id="back" data-t-aria="ariaBack">‹</button>
    <div class="chat-who" id="who">
      <div class="n" id="whoName"></div>
      <div class="f" id="whoFace"></div>
    </div>
    <button class="icon" id="find" data-t-aria="fdTitle">⌕</button>
    <button class="icon" id="call" data-t-aria="ariaCall">☏</button>
  </div>

  <div class="findbar" id="findbar">
    <input id="q" type="search" autocomplete="off" data-t-ph="fdPlace">
    <button id="qStar" data-t="fdStars"></button>
    <button id="qX">✕</button>
  </div>

  <div class="chat-body" id="body"></div>
  <div class="typing" id="typing"></div>
  <div class="chat-err" id="err" style="display:none"></div>

  <div class="replybar" id="replybar">
    <div class="rb-txt"><b data-t="msgReplyTo"></b><span id="rbText"></span></div>
    <button class="rb-x" id="rbX">✕</button>
  </div>

  <div class="voicebar" id="voicebar">
    <span class="vdot"></span>
    <span class="vtime" id="vTime">0:00</span>
    <button id="vCancel" data-t="vcCancel"></button>
    <button class="go" id="vStop" data-t="vcStop"></button>
  </div>

  <div class="tempbar" id="tempbar">
    <span id="tempTxt"></span>
    <button id="tempOff" data-t="exOff"></button>
  </div>

  <div class="uploading" id="upBar" style="display:none"></div>

  <div class="chat-foot">
    <button class="clip" id="clip" data-t-aria="mdAttach">＋</button>
    <input type="file" id="pick" style="display:none"
           accept="image/*,video/*" multiple>
    <input type="file" id="pickAny" style="display:none" multiple>
    <textarea id="input" rows="1" data-t-ph="chatPlace"></textarea>
    <button class="send" id="send" data-t-aria="ariaSend" disabled>↑</button>
  </div>

  <div class="empanel" id="empanel"></div>

</div>

<div class="sheet-bg" id="atBg"></div>
<div class="sheet" id="atSheet" style="display:none">
  <div class="grip"></div>
  <button id="atPhoto" data-t="mdPhoto"></button>
  <button id="atFile" data-t="mdFile"></button>
  <button id="atVoice" data-t="vcRecord"></button>
  <button id="atEmoji" data-t="emPopular"></button>
  <button id="atTimer" data-t="exSetTimer"></button>
</div>

<script>
/* =====================================================================
   대화 화면 (4-1)
   글자 · 실시간 · 읽음 · 입력 중 까지입니다.
   사진·이모지·음성메시지·답장은 4-2, 4-3에서 붙입니다.

   ⚠ 보내기와 열기는 Edge Function이 합니다.
       alias-message-send · alias-thread-open
     3단계에서 푸시를, 8단계에서 AI 부재중 비서를 그 안에 붙일 자리입니다.

   ⚠ 이름 셋을 여기서도 헷갈리면 안 됩니다.
       머리 큰 글씨  = 내가 상대를 부르는 이름(없으면 상대 별칭)
       머리 작은 글씨 = 내가 이 사람에게 보여주는 별칭
     상대의 peer_label 은 서버가 아예 안 내려줍니다.
   ===================================================================== */

const linkId = new URLSearchParams(location.search).get('link');

let me = null;          // { sideId, myFace, peerLabel }
let peer = null;        // { sideId, display, lastReadAt }
let msgs = [];
let channel = null;
let closed = false;
let typingTimer = null;
let lastTypingSent = 0;
let firstUnreadId = null;   // "여기부터 새 메시지" 구분선을 그릴 자리

function showErr(msg){
  const el = document.getElementById('err');
  el.textContent = msg; el.style.display = '';
}
function clearErr(){ document.getElementById('err').style.display = 'none'; }

/* ── 그리기 ─────────────────────────────────────────────────────── */
function atBottom(){
  const b = document.getElementById('body');
  return b.scrollHeight - b.scrollTop - b.clientHeight < 60;
}
function toBottom(){
  const b = document.getElementById('body');
  b.scrollTop = b.scrollHeight;
}

/* 말풍선 하나. 파일이면 사진·영상·문서로 갈립니다.
   ⚠ 사진 주소는 시한부라 여기서 바로 못 넣습니다. 자리만 잡아두고
     그린 뒤에 채웁니다(fillMedia). 그래야 화면이 안 튑니다. */
/* 언제 사라지는지 말풍선 안에 적습니다. */
function tempTag(m){
  return '<span class="temp-tag">⏱ ' +
    AL.esc(AL.t('exWillGo', { when: AL.fmtClock(m.expires_at) })) + '</span>';
}

function quoteHtml(m){
  if (!m.reply_to_message_id) return '';
  const t = msgs.filter(function(x){ return x.id === m.reply_to_message_id; })[0];
  const txt = !t ? AL.t('msgGone')
    : (t.deleted_at ? AL.t('msgGone')
      : (t.content || AL.t({ photo:'mdPhoto', video:'mdVideo', audio:'vcRecord' }[t.message_type] || 'mdFile')));
  return '<span class="quote" data-jump="' + AL.esc(m.reply_to_message_id) + '">' +
         AL.esc(txt) + '</span>';
}

function bubbleHtml(m, gone, temp){
  if (gone) return '<div class="bub gone">' + AL.esc(AL.t('chatDeleted')) + '</div>';

  const q = (temp ? tempTag(m) : '') + quoteHtml(m);

  // 이모지 1~3개뿐이면 큰 그림으로. 카톡 이모티콘처럼요.
  if (!m.media_path && m.content) {
    const only = AL.emojiOnly(m.content);
    if (only) {
      return '<div class="bub stickers" data-id="' + AL.esc(m.id) + '">' +
        only.map(function(e){
          return '<img src="' + AL.esc(e.url) + '" alt="' + AL.esc(e.char) + '">';
        }).join('') + '</div>';
    }
  }

  if (m.message_type === 'audio' && m.media_path) {
    return '<div class="bub media" data-id="' + AL.esc(m.id) + '">' + q +
      '<audio controls preload="metadata" data-mv="' + AL.esc(m.media_path) + '"></audio>' +
      (m.content ? '<div class="cap">' + AL.esc(m.content) + '</div>' : '') +
    '</div>';
  }

  if (m.message_type === 'photo' && m.media_path) {
    // 미리 잡아둔 비율로 자리를 만들어 둡니다.
    const ratio = (m.media_w && m.media_h) ? (m.media_h / m.media_w * 100) : 66;
    return '<div class="bub media" data-id="' + AL.esc(m.id) + '">' + q +
      '<img class="ph" data-mp="' + AL.esc(m.media_path) + '" alt="" ' +
        'style="aspect-ratio:' + (m.media_w && m.media_h ? m.media_w + '/' + m.media_h : '3/2') +
        ';min-height:1px">' +
      (m.content ? '<div class="cap">' + AL.esc(m.content) + '</div>' : '') +
    '</div>';
  }

  if (m.message_type === 'video' && m.media_path) {
    return '<div class="bub media" data-id="' + AL.esc(m.id) + '">' + q +
      '<video controls preload="metadata" data-mv="' + AL.esc(m.media_path) + '"></video>' +
      (m.content ? '<div class="cap">' + AL.esc(m.content) + '</div>' : '') +
    '</div>';
  }

  if (m.media_path) {
    return '<div class="bub media" data-id="' + AL.esc(m.id) + '">' + q +
      '<a class="filecard" data-mf="' + AL.esc(m.media_path) + '" ' +
         'download="' + AL.esc(m.media_name || '') + '">' +
        '<span class="fi">▤</span>' +
        '<span class="fn"><b>' + AL.esc(m.media_name || AL.t('mdOpenFile')) + '</b>' +
        '<span>' + AL.esc(AL.fmtBytes(m.media_bytes)) + '</span></span>' +
      '</a>' +
      (m.content ? '<div class="cap">' + AL.esc(m.content) + '</div>' : '') +
    '</div>';
  }

  // 주소가 들어 있으면 미리보기를 붙입니다.
  const u = AL.firstUrl(m.content);
  let lp = '';
  if (u && previews[u] && !previews[u].failed) {
    const p = previews[u];
    lp = '<a class="lp" href="' + AL.esc(u) + '" target="_blank" rel="noopener noreferrer">' +
      (p.image_url ? '<img src="' + AL.esc(p.image_url) + '" alt="" loading="lazy">' : '') +
      (p.title ? '<div class="lp-t">' + AL.esc(p.title) + '</div>' : '') +
      (p.description ? '<div class="lp-d">' + AL.esc(p.description) + '</div>' : '') +
      '<div class="lp-s">' + AL.esc(p.site_name || new URL(u).hostname) + '</div>' +
    '</a>';
  }

  return '<div class="bub" data-id="' + AL.esc(m.id) + '">' + q +
         hilite(m.content || '') + lp + '</div>';
}

/* 주소가 든 메시지의 미리보기를 가져옵니다. 한 번 가져온 것은 다시 안 갑니다. */
async function loadPreviews(){
  const urls = [];
  msgs.forEach(function(m){
    if (m.deleted_at || m.media_path) return;
    const u = AL.firstUrl(m.content);
    if (u && !previews[u]) urls.push(u);
  });
  if (!urls.length) return;
  urls.forEach(function(u){ previews[u] = { pending: true }; });

  for (const u of urls.slice(0, 8)) {          // 한 번에 여덟 개까지
    try {
      const out = await AL.callFn('alias-link-preview', { url: u });
      previews[u] = out.preview || { failed: true };
    } catch (e) {
      previews[u] = { failed: true };
    }
  }
  paint(true);
}

/* 검색어를 노랗게 칠합니다. 나머지는 그대로 안전하게 씁니다. */
function hilite(text){
  if (!findQ) return AL.esc(text);
  const i = text.toLowerCase().indexOf(findQ.toLowerCase());
  if (i < 0) return AL.esc(text);
  return AL.esc(text.slice(0, i)) +
         '<span class="hit">' + AL.esc(text.slice(i, i + findQ.length)) + '</span>' +
         AL.esc(text.slice(i + findQ.length));
}

/* 시한부 주소를 받아 채웁니다. 실패해도 대화는 계속 보입니다. */
async function fillMedia(){
  const jobs = [];
  document.querySelectorAll('[data-mp],[data-mv],[data-mf]').forEach(function(el){
    const path = el.getAttribute('data-mp') || el.getAttribute('data-mv') || el.getAttribute('data-mf');
    if (!path || el.dataset.done) return;
    el.dataset.done = '1';
    jobs.push(AL.mediaUrl(path).then(function(url){
      if (el.tagName === 'A') el.href = url; else el.src = url;
    }).catch(function(e){
      console.warn('[media]', path, e);
      if (el.tagName === 'A') el.querySelector('b').textContent = AL.t('mdGone');
    }));
  });
  await Promise.all(jobs);
}

function paint(keepPos){
  const b = document.getElementById('body');
  const stick = keepPos ? false : atBottom();

  if (!msgs.length) {
    b.innerHTML = '<div class="sysline">' + AL.esc(AL.t('chatEmpty')) + '</div>';
    return;
  }

  // 상대가 마지막으로 읽은 시각. 그보다 앞선 내 메시지에 "읽음"을 붙입니다.
  const readMs = peer && peer.lastReadAt ? new Date(peer.lastReadAt).getTime() : 0;

  // 검색어나 즐겨찾기로 걸러냅니다. 비어 있으면 전부 보입니다.
  const nowMs = Date.now();
  const show = msgs.filter(function(m){
    // 이미 사라진 것은 검색 결과에도 안 나옵니다.
    if ((findQ || starOnly) && m.expires_at && new Date(m.expires_at).getTime() <= nowMs) return false;
    if (starOnly && !stars[m.id]) return false;
    if (findQ && !(m.content || '').toLowerCase().includes(findQ.toLowerCase())) return false;
    return true;
  });

  if ((findQ || starOnly) && !show.length) {
    b.innerHTML = '<div class="sysline">' +
      AL.esc(AL.t(starOnly && !findQ ? 'fdStarNone' : 'fdNone')) + '</div>';
    return;
  }

  let html = '';
  let prevDay = null;
  show.forEach(function(m){
    const when = m.sent_at || m.created_at;
    if (!prevDay || !AL.sameDay(prevDay, when)) {
      html += '<div class="daysep">' + AL.esc(AL.fmtDaySep(when)) + '</div>';
      prevDay = when;
    }
    // 알림줄은 말풍선이 아니라 가운데 한 줄로 그립니다.
    if (m.message_type === 'system') {
      html += '<div class="sysline notice">' +
        AL.esc(AL.systemText(m.content)) + '</div>';
      return;
    }

    const out = m.sender_side_id === me.sideId;

    // 🔴 서버가 치울 때까지 기다리지 않습니다.
    //   "5분 뒤 사라진다" 고 해놓고 서버 사정에 맡기면 약속을 어기는 것입니다.
    //   시각이 지나면 화면이 먼저 가립니다. 실제 삭제는 sweep 이 뒤따릅니다.
    const expired = !!m.expires_at && new Date(m.expires_at) <= new Date();
    const gone = !!m.deleted_at || expired;
    const read = out && readMs && new Date(when).getTime() <= readMs;

    if (firstUnreadId && m.id === firstUnreadId) {
      html += '<div class="newline"><span>' + AL.esc(AL.t('newHere')) + '</span></div>';
    }

    // ⚠ 사라지는 메시지는 매 건마다, 양쪽 다 보이게 표시합니다.
    //   받는 사람이 모르는 채로 사라지는 일은 없어야 합니다.
    const temp = !!m.expires_at && !gone;

    html += '<div class="msg ' + (out ? 'out' : 'in') +
      (m._fresh ? ' fresh' : '') + (m._failed ? ' failed' : '') +
      (temp ? ' temp' : '') + '">' +
      bubbleHtml(m, gone, temp) +
      '<div class="meta">' +
        (m._failed
          ? '<button class="retry" data-retry="' + AL.esc(m.id) + '">' +
              AL.esc(AL.t('chatRetry')) + '</button>'
          : (read ? '<span class="rd">' + AL.esc(AL.t('chatRead')) + '</span>' : '')) +
        (stars[m.id] ? '<span class="star">★</span> ' : '') +
        AL.esc(AL.fmtClock(when)) +
        (m.edited_at ? '<br>' + AL.esc(AL.t('msgEdited')) : '') +

      '</div>' +
    '</div>';
  });
  b.innerHTML = html;

  fillMedia();

  b.querySelectorAll('.bub[data-id]').forEach(function(el){
    el.addEventListener('click', function(e){
      // 사진·영상·문서·링크를 누른 것은 그쪽 동작이 먼저입니다.
      if (e.target.closest('img.ph, video, audio, a, button, .quote')) return;
      openMsgMenu(el.getAttribute('data-id'));
    });
  });

  b.querySelectorAll('[data-jump]').forEach(function(el){
    el.addEventListener('click', function(e){
      e.stopPropagation();
      const t = b.querySelector('.bub[data-id="' + el.getAttribute('data-jump') + '"]');
      if (!t) return;
      t.scrollIntoView({ block: 'center', behavior: 'smooth' });
      t.closest('.msg').classList.add('found');
      setTimeout(function(){ t.closest('.msg').classList.remove('found'); }, 1800);
    });
  });

  // 사진을 누르면 크게 봅니다. 이 방의 사진 전부를 넘겨볼 수 있게 모아 줍니다.
  b.querySelectorAll('[data-mp]').forEach(function(el){
    el.addEventListener('click', async function(){
      const photos = msgs.filter(function(m){
        return m.message_type === 'photo' && m.media_path && !m.deleted_at;
      });
      const here = el.getAttribute('data-mp');
      const items = [];
      for (const m of photos) {
        try { items.push({ url: await AL.mediaUrl(m.media_path), name: m.media_name }); }
        catch (e) { /* 못 여는 것은 건너뜁니다 */ }
      }
      const at = photos.findIndex(function(m){ return m.media_path === here; });
      if (items.length) AL.openViewer(items, at < 0 ? 0 : at);
    });
  });

  b.querySelectorAll('[data-retry]').forEach(function(el){
    el.addEventListener('click', function(){
      const id = el.getAttribute('data-retry');
      const i = msgs.findIndex(function(m){ return m.id === id; });
      if (i < 0) return;
      const text = msgs[i]._text || msgs[i].content;
      msgs.splice(i, 1);
      document.getElementById('input').value = text;
      send();
    });
  });

  if (stick || keepPos === false) toBottom();
}

/* ── 열기 ───────────────────────────────────────────────────────── */
async function open_(){
  const out = await AL.callFn('alias-thread-open', { linkId: linkId });
  me = out.me;
  peer = out.peer;
  msgs = out.messages || [];
  closed = out.link.status !== 'active';

  // 이 방만의 모양이 있으면 그것으로, 없으면 내 기본으로 칠합니다.
  AL.applyLinkTheme({
    theme_mode: out.link.themeMode, theme_color: out.link.themeColor,
    bubble_style: out.link.bubbleStyle, scene: out.link.scene,
  });

  // 내가 마지막으로 읽은 시각보다 나중에 온 상대 메시지 중 첫 번째.
  // 서버가 열면서 읽음을 갱신하므로, 갱신 전 값을 쓰려면 여기서 미리 찾습니다.
  const myRead = out.me.lastReadAt ? new Date(out.me.lastReadAt).getTime() : 0;
  const firstNew = msgs.filter(function(m){
    return m.sender_side_id !== out.me.sideId && m.sent_at &&
           (!myRead || new Date(m.sent_at).getTime() > myRead);
  })[0];
  firstUnreadId = firstNew ? firstNew.id : null;

  document.getElementById('whoName').textContent =
    me.peerLabel || (peer && peer.display) || AL.t('cntUnnamed');
  document.getElementById('whoFace').textContent =
    AL.t('chatMyFace', { face: me.myFace || '' });

  if (closed) {
    showErr(AL.t('chatClosed'));
    document.getElementById('input').disabled = true;
    document.getElementById('send').disabled = true;
  }
  roomHours = out.link.autoDeleteHours || null;

  paint(false);
  loadPreviews();
}

/* ── 실시간 ─────────────────────────────────────────────────────
   서버가 link-{id} 채널로 방송합니다. 입력 중 표시도 같은 채널을 씁니다. */
let listenTries = 0;

async function listen(){
  await AL.syncRealtimeAuth();
  if (channel) { try { AL.sb.removeChannel(channel); } catch (e) {} }
  // ⚠ 이름이 서버와 정확히 같아야 합니다. Edge Function 이 'link-{id}' 로
  //   방송합니다. 재접속하려고 뒤에 시각을 붙였다가 방송이 통째로 사라졌습니다.
  //   새로 붙는 것은 위에서 removeChannel 로 해결합니다.
  channel = AL.sb.channel('link-' + linkId,
                          { config: { broadcast: { self: false } } });

  channel.on('broadcast', { event: 'new-message' }, function(e){
    const m = e.payload;
    if (!m || m.link_id !== linkId) return;
    if (msgs.some(function(x){ return x.id === m.id; })) return;  // 이미 있음

    // ⚠ 내가 보낸 것도 방송으로 돌아옵니다. 그런데 응답보다 방송이 먼저 올 수
    //   있어서, 그때는 임시 말풍선(tmp-…)이 아직 진짜 id 로 안 바뀐 상태입니다.
    //   id 로만 견주면 같은 글이 두 번 찍힙니다. 내용으로 찾아 갈아끼웁니다.
    if (m.sender_side_id === me.sideId) {
      const t = msgs.findIndex(function(x){
        return String(x.id).indexOf('tmp-') === 0 && x.content === m.content;
      });
      if (t >= 0) { msgs[t] = m; paint(); return; }
    }

    if (m.sender_side_id !== me.sideId) {
      m._fresh = true;                 // 잠깐 배경을 밝혀 눈에 띄게
      setTimeout(function(){ delete m._fresh; paint(true); }, 2600);
      if (document.visibilityState === 'visible') markRead();
      else AL.alertNew();              // 다른 탭에 있으면 소리·진동
    }
    msgs.push(m);
    paint();
  });

  channel.on('broadcast', { event: 'message-changed' }, function(e){
    const p = e.payload;
    if (!p || p.link_id !== linkId) return;
    const m = msgs.filter(function(x){ return x.id === p.id; })[0];
    if (!m) return;
    if (p.action === 'delete') { m.deleted_at = p.deleted_at; m.content = null; }
    else { m.content = p.content; m.edited_at = p.edited_at; }
    paint(true);
  });

  channel.on('broadcast', { event: 'read' }, function(e){
    if (!e.payload || e.payload.sideId === me.sideId) return;
    if (!peer) return;
    peer.lastReadAt = e.payload.at;
    paint(true);
  });

  channel.on('broadcast', { event: 'typing' }, function(e){
    if (!e.payload || e.payload.sideId === me.sideId) return;
    const t = document.getElementById('typing');
    t.textContent = AL.t('chatTyping');
    clearTimeout(typingTimer);
    typingTimer = setTimeout(function(){ t.textContent = ''; }, 2500);
  });

  channel.subscribe(function(status){
    if (status === 'SUBSCRIBED') {
      listenTries = 0;
      refresh();               // 붙는 순간 그 사이 놓친 것을 메웁니다
      return;
    }
    if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
      listenTries++;
      setTimeout(listen, Math.min(30000, 2000 * listenTries));
    }
  });
}

/* ── 🔴 놓친 것 메우기 ──────────────────────────────────────────
   실시간은 빠르라고 있는 것이지, 그것만 믿으면 안 됩니다.
   토큰이 만료되거나 폰이 잠들면 조용히 끊깁니다. 그때 겉으로는
   "내가 보낸 것만 보이는" 멀쩡한 화면이 됩니다.
   그래서 주기적으로, 그리고 화면에 돌아올 때마다 다시 맞춥니다. */
let refreshing = false;
let refreshFails = 0;
let replyTo = null;      // 답장 대상
let stars = {};          // 즐겨찾기한 메시지 id
let findQ = '';          // 검색어
let starOnly = false;
let msgExpiry = 0;        // 다음에 보낼 메시지가 사라지는 시간(시간 단위)
let roomHours = null;     // 이 방 전체 자동삭제
let previews = {};        // 주소 → 미리보기

async function refresh(){
  if (refreshing || !me) return;
  refreshing = true;
  try {
    const out = await AL.callFn('alias-thread-open', {
      linkId: linkId,
      markRead: document.visibilityState === 'visible',
    });
    peer = out.peer;
    closed = out.link.status !== 'active';

  // 이 방만의 모양이 있으면 그것으로, 없으면 내 기본으로 칠합니다.
  AL.applyLinkTheme({
    theme_mode: out.link.themeMode, theme_color: out.link.themeColor,
    bubble_style: out.link.bubbleStyle, scene: out.link.scene,
  });

    roomHours = out.link.autoDeleteHours || null;
    const server = out.messages || [];
    const have = {};
    server.forEach(function(m){ have[m.id] = 1; });

    // 아직 응답을 못 받은 임시 말풍선은 살려둡니다.
    // ⚠ 서버가 모르는 내 글은 살려둡니다. 지우면 무슨 일이 있었는지 못 봅니다.
    const temps = msgs.filter(function(m){
      if (!m._failed && String(m.id).indexOf('tmp-') !== 0) {
        // 보냈다고 응답까지 받았는데 서버 목록에 없는 것 — 이상한 상황입니다.
        if (m.sender_side_id === me.sideId && !have[m.id]) {
          m._failed = true;
          console.warn('[refresh] 보냈는데 서버에 없습니다', m.id, m.content);
          return true;
        }
        return false;
      }
      return !server.some(function(x){
        return x.sender_side_id === me.sideId && x.content === m.content;
      });
    });

    refreshFails = 0;
    clearErr();
    const before = msgs.length;
    msgs = server.concat(temps);
    paint(msgs.length === before);   // 새 게 있으면 아래로 붙습니다
    loadPreviews();
  } catch (e) {
    // 조용히 지나가면 "왜 안 오는지" 를 영영 못 찾습니다.
    console.warn('[refresh] 실패', e);
    refreshFails++;
    if (refreshFails >= 3) showErr(AL.t('chatFailed', { msg: e.message || String(e) }));
  } finally {
    refreshing = false;
  }
}

function sendTyping(){
  // 2초에 한 번만 보냅니다. 글자마다 보내면 채널이 시끄러워집니다.
  const now = Date.now();
  if (now - lastTypingSent < 2000) return;
  lastTypingSent = now;
  if (channel) channel.send({ type: 'broadcast', event: 'typing', payload: { sideId: me.sideId } });
}

/* ⚠ 화면을 실제로 보고 있을 때만 읽음 처리합니다.
   다른 탭에 가 있는데 읽었다고 하면 상대를 속이는 셈입니다. */
async function markRead(){
  if (document.visibilityState !== 'visible') return;
  const at = new Date().toISOString();
  try {
    await AL.sb.from('link_sides').update({ last_read_at: at }).eq('id', me.sideId);
    // 🔴 방송해야 보낸 쪽이 압니다. 전에는 이게 없어서 새로고침해야 "읽음"이 떴습니다.
    if (channel) channel.send({ type: 'broadcast', event: 'read',
                                payload: { sideId: me.sideId, at: at } });
  } catch (e) { /* 읽음 표시가 늦어도 대화에는 지장 없습니다 */ }
}

/* ── 보내기 ─────────────────────────────────────────────────────── */
async function send(){
  const box = document.getElementById('input');
  const text = box.value.trim();
  if (!text || closed) return;

  const btn = document.getElementById('send');
  btn.disabled = true;
  clearErr();

  // 화면에 먼저 띄웁니다. 실패하면 지웁니다.
  const tempId = 'tmp-' + Date.now();
  msgs.push({
    id: tempId, sender_side_id: me.sideId, message_type: 'text',
    content: text, reply_to_message_id: replyTo ? replyTo.id : null,
    sent_at: new Date().toISOString(), created_at: new Date().toISOString(),
  });
  clearReply();
  box.value = '';
  box.style.height = 'auto';
  paint(false);

  try {
    const out = await AL.callFn('alias-message-send', {
      linkId: linkId, text: text,
      replyTo: replyTo ? replyTo.id : null,
      expiresInHours: msgExpiry || null,
    });
    const i = msgs.findIndex(function(m){ return m.id === tempId; });
    if (i >= 0) {
      // 방송이 먼저 와서 이미 갈아끼워졌으면 여기 안 들어옵니다.
      if (msgs.some(function(m){ return m.id === out.messageId; })) msgs.splice(i, 1);
      else { msgs[i].id = out.messageId; msgs[i].sent_at = out.sentAt; }
      paint();
    }
  } catch (e) {
    console.error('[send] 실패', e);
    // ⚠ 지우면 안 됩니다. 소리 없이 사라지면 무슨 일이 있었는지 아무도 모릅니다.
    //   실패 표시를 달아 남겨두고, 눌러서 다시 보낼 수 있게 합니다.
    const i = msgs.findIndex(function(m){ return m.id === tempId; });
    if (i >= 0) { msgs[i]._failed = true; msgs[i]._text = text; }
    showErr(AL.t('chatFailed', { msg: e.message || String(e) }));
    paint(false);
  } finally {
    btn.disabled = !document.getElementById('input').value.trim();
  }
}

/* ── 메시지를 누르면 나오는 메뉴 ────────────────────────────────
   답장 · 수정 · 삭제 · 복사 · 즐겨찾기 · 신고
   ⚠ 내가 보낸 것만 수정·삭제할 수 있습니다. 신고는 상대 것만 됩니다.
------------------------------------------------------------------- */
function openMsgMenu(id){
  const m = msgs.filter(function(x){ return x.id === id; })[0];
  if (!m || m.deleted_at || String(m.id).indexOf('tmp-') === 0) return;
  const mine = m.sender_side_id === me.sideId;

  const bg = document.createElement('div'); bg.className = 'pk-bg';
  const sheet = document.createElement('div'); sheet.className = 'pk';
  document.body.appendChild(bg); document.body.appendChild(sheet);

  function close(){ bg.remove(); sheet.remove(); }
  bg.addEventListener('click', close);

  const items = [];
  items.push(['msgReply', function(){ setReply(m); }]);
  if (m.content) items.push(['msgCopy', function(){ AL.copyText(m.content); }]);
  items.push([stars[m.id] ? 'msgUnstar' : 'msgStar', function(){ toggleStar(m); }]);
  if (m.content) items.push(['kpSave', function(){ toKeep(m); }]);
  if (mine && !m.media_path) items.push(['msgEdit', function(){ editMsg(m); }]);
  if (mine) items.push(['msgDelete', function(){ delMsg(m); }]);
  if (!mine) items.push(['msgReport', function(){ reportMsg(m); }]);

  sheet.innerHTML = '<div class="grip"></div>';
  items.forEach(function(it){
    const b = document.createElement('button');
    b.textContent = AL.t(it[0]);
    b.addEventListener('click', function(){ close(); it[1](); });
    sheet.appendChild(b);
  });
}

/* ── 답장 ─────────────────────────────────────────────────────── */
function setReply(m){
  replyTo = m;
  document.getElementById('rbText').textContent =
    m.content || AL.t({ photo:'mdPhoto', video:'mdVideo', audio:'vcRecord' }[m.message_type] || 'mdFile');
  document.getElementById('replybar').classList.add('on');
  document.getElementById('input').focus();
}
function clearReply(){
  replyTo = null;
  document.getElementById('replybar').classList.remove('on');
}
document.getElementById('rbX').addEventListener('click', clearReply);

/* ── 수정 · 삭제 ──────────────────────────────────────────────── */
async function editMsg(m){
  const next = prompt(AL.t('msgEditAsk'), m.content || '');
  if (next === null || !next.trim() || next === m.content) return;
  try {
    await AL.callFn('alias-message-edit', { messageId: m.id, action: 'edit', text: next.trim() });
    m.content = next.trim();
    m.edited_at = new Date().toISOString();
    paint(true);
  } catch (e) {
    console.error(e);
    showErr(AL.t('chatFailed', { msg: e.message || String(e) }));
  }
}

async function delMsg(m){
  if (!confirm(AL.t('msgDelAsk'))) return;
  try {
    await AL.callFn('alias-message-edit', { messageId: m.id, action: 'delete' });
    m.deleted_at = new Date().toISOString();
    m.content = null;
    paint(true);
  } catch (e) {
    console.error(e);
    showErr(AL.t('chatFailed', { msg: e.message || String(e) }));
  }
}

/* ── 즐겨찾기 ────────────────────────────────────────────────── */
async function toggleStar(m){
  try {
    if (stars[m.id]) {
      await AL.sb.from('message_favorites')
        .delete().eq('message_id', m.id).eq('side_id', me.sideId);
      delete stars[m.id];
    } else {
      const res = await AL.sb.from('message_favorites')
        .insert({ message_id: m.id, side_id: me.sideId });
      if (res.error) throw res.error;
      stars[m.id] = 1;
    }
    paint(true);
  } catch (e) {
    console.error(e);
    showErr(AL.t('chatFailed', { msg: e.message || String(e) }));
  }
}

async function loadStars(){
  try {
    const res = await AL.sb.from('message_favorites')
      .select('message_id').eq('side_id', me.sideId);
    stars = {};
    (res.data || []).forEach(function(r){ stars[r.message_id] = 1; });
  } catch (e) { /* 즐겨찾기가 없어도 대화는 됩니다 */ }
}

/* ── 메모함에 담기 ────────────────────────────────────────────── */
async function toKeep(m){
  try {
    const sess = await AL.sb.auth.getSession();
    const res = await AL.sb.from('keeps').insert({
      account_id: sess.data.session.user.id,
      content: m.content,
      from_link_id: linkId,
    });
    if (res.error) throw res.error;
    alert(AL.t('kpSaved'));
  } catch (e) {
    console.error(e);
    showErr(AL.t('errGeneric', { msg: e.message || String(e) }));
  }
}

/* ── 신고 ────────────────────────────────────────────────────── */
async function reportMsg(m){
  const out = await AL.openReport({ sideId: me.sideId, linkId: linkId, messageId: m.id });
  if (out && out.ok) { clearErr(); alert(AL.t('rpDone')); }
}

/* ── 음성메시지 ──────────────────────────────────────────────── */
async function startVoice(){
  try {
    await AL.startRecording(function(ms){
      document.getElementById('vTime').textContent = AL.fmtDuration(ms);
    });
    document.getElementById('vTime').textContent = '0:00';
    document.getElementById('voicebar').classList.add('on');
  } catch (e) {
    console.error(e);
    showErr(AL.t('vcDenied'));
  }
}
document.getElementById('vCancel').addEventListener('click', function(){
  if (AL.recorder) AL.recorder.cancel();
  document.getElementById('voicebar').classList.remove('on');
});
document.getElementById('vStop').addEventListener('click', async function(){
  if (!AL.recorder) return;
  const out = await AL.recorder.stop();
  document.getElementById('voicebar').classList.remove('on');
  sendFiles([out.file], out.durationMs);
});

/* ── 이모지 ──────────────────────────────────────────────────── */
let emReady = false;
function toggleEmoji(){
  const box = document.getElementById('empanel');
  const on = !box.classList.contains('on');
  box.classList.toggle('on', on);
  if (on && !emReady) {
    AL.paintEmojiPanel(box, function(ch){
      const inp = document.getElementById('input');
      inp.value += ch;
      inp.dispatchEvent(new Event('input'));
      inp.focus();
    });
    emReady = true;
  }
}

/* ── 검색 ────────────────────────────────────────────────────── */
function toggleFind(){
  const bar = document.getElementById('findbar');
  const on = !bar.classList.contains('on');
  bar.classList.toggle('on', on);
  if (on) document.getElementById('q').focus();
  else { findQ = ''; starOnly = false; document.getElementById('q').value = ''; paint(true); }
}
document.getElementById('find').addEventListener('click', toggleFind);
document.getElementById('qX').addEventListener('click', toggleFind);
document.getElementById('q').addEventListener('input', function(){
  findQ = this.value.trim();
  paint(true);
});
document.getElementById('qStar').addEventListener('click', function(){
  starOnly = !starOnly;
  this.classList.toggle('on', starOnly);
  paint(true);
});

/* ── 사라지는 메시지 ────────────────────────────────────────────
   보내는 사람이 정합니다. 정하면 다음에 보내는 것부터 적용됩니다.
------------------------------------------------------------------- */
document.getElementById('atTimer').addEventListener('click', async function(){
  showAttach(false);
  const h = await AL.pickExpiry(msgExpiry, false);
  if (h === null) return;
  setExpiry(h);
});

/* 켜져 있다는 것을 세 군데에 띄웁니다. 글을 쓰는 중에도 보여야 합니다. */
function setExpiry(h){
  msgExpiry = h;
  const bar = document.getElementById('tempbar');
  bar.classList.toggle('on', !!h);
  if (h) document.getElementById('tempTxt').textContent =
    AL.t('exOnNow', { label: AL.expiryLabel(h) });
  document.getElementById('clip').classList.toggle('temp', !!h);
}
document.getElementById('tempOff').addEventListener('click', function(){ setExpiry(0); });

/* ── 파일 보내기 ──────────────────────────────────────────────────
   ① 화면이 Storage 에 먼저 올립니다 (경로가 곧 권한 — 블록 23)
   ② 그 경로만 Edge Function 에 넘깁니다
   ③ 서버가 messages 에 넣고 방송합니다

   ⚠ 여러 장이면 한 장씩 차례로 보냅니다. 한꺼번에 올리면 순서가 뒤섞입니다.
------------------------------------------------------------------- */
function showAttach(on){
  document.getElementById('atBg').classList.toggle('show', on);
  document.getElementById('atSheet').style.display = on ? '' : 'none';
}

function setUpBar(text){
  const el = document.getElementById('upBar');
  el.textContent = text || '';
  el.style.display = text ? '' : 'none';
}

async function sendFiles(files, durationMs){
  if (!files || !files.length || closed) return;
  clearErr();
  const caption = document.getElementById('input').value.trim();
  document.getElementById('input').value = '';
  document.getElementById('input').style.height = 'auto';

  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    const label = files.length > 1 ? ' (' + (i + 1) + '/' + files.length + ')' : '';
    try {
      const media = await AL.uploadMedia(linkId, me.sideId, f, function(stage){
        setUpBar(AL.t(stage === 'compress' ? 'mdCompress' : 'mdUploading') + label);
      });

      // 설명글은 첫 장에만 붙입니다.
      if (durationMs) media.durationMs = durationMs;
      const out = await AL.callFn('alias-message-send', {
        linkId: linkId,
        text: (i === 0 && caption) ? caption : null,
        media: media,
        replyTo: (i === 0 && replyTo) ? replyTo.id : null,
        expiresInHours: msgExpiry || null,
      });

      msgs.push({
        id: out.messageId, sender_side_id: me.sideId,
        message_type: media.kind, content: (i === 0 && caption) ? caption : null,
        media_path: media.path, media_name: media.name, media_mime: media.mime,
        media_bytes: media.bytes, media_w: media.w, media_h: media.h,
        reply_to_message_id: (i === 0 && replyTo) ? replyTo.id : null,
        sent_at: out.sentAt, created_at: out.sentAt,
      });
      if (i === 0) clearReply();
      paint(false);

    } catch (e) {
      console.error('[media] 실패', e);
      showErr(AL.t('mdFailed', { msg: e.message || String(e) }));
      break;
    }
  }
  setUpBar('');
}

document.getElementById('clip').addEventListener('click', function(){ showAttach(true); });
document.getElementById('atBg').addEventListener('click', function(){ showAttach(false); });
document.getElementById('atPhoto').addEventListener('click', function(){
  showAttach(false); document.getElementById('pick').click();
});
document.getElementById('atFile').addEventListener('click', function(){
  showAttach(false); document.getElementById('pickAny').click();
});
document.getElementById('atVoice').addEventListener('click', function(){
  showAttach(false); startVoice();
});
document.getElementById('atEmoji').addEventListener('click', function(){
  showAttach(false); toggleEmoji();
});
['pick', 'pickAny'].forEach(function(id){
  document.getElementById(id).addEventListener('change', function(){
    const files = Array.from(this.files || []);
    this.value = '';                    // 같은 파일을 다시 고를 수 있게 비웁니다
    sendFiles(files);
  });
});

/* ── 붙이기 ─────────────────────────────────────────────────────── */
const input = document.getElementById('input');
input.addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  document.getElementById('send').disabled = !this.value.trim() || closed;
  if (this.value.trim()) sendTyping();
});
input.addEventListener('keydown', function(e){
  // Enter 는 보내기, Shift+Enter 는 줄바꿈. 모바일에서는 항상 줄바꿈입니다.
  const mobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
  if (e.key === 'Enter' && !e.shiftKey && !mobile) { e.preventDefault(); send(); }
});
document.getElementById('send').addEventListener('click', send);
document.getElementById('back').addEventListener('click', function(){
  location.href = 'alias_contacts.html';
});
document.getElementById('who').addEventListener('click', function(){
  location.href = 'alias_link.html?link=' + encodeURIComponent(linkId);
});
document.getElementById('call').addEventListener('click', function(){
  alert(AL.t('chatCallSoon'));
});

/* ── 시작 ───────────────────────────────────────────────────────── */
(async function(){
  AL.paintText();
  if (!await AL.requireLogin()) return;
  if (!linkId) { showErr(AL.t('dtlNotFound')); return; }
  try {
    await open_();
    await loadStars();
    listen();
    watchOthers();
  } catch (e) {
    console.error(e);
    showErr(AL.t('errGeneric', { msg: e.message || String(e) }));
  }
})();

// 다른 탭에 갔다가 돌아오면 그때 읽음 처리합니다.
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState !== 'visible' || !me) return;
  listen();      // 그 사이 끊겼을 수 있습니다
  refresh();     // 놓친 메시지를 메웁니다
  markRead();
});

// 실시간이 막히는 환경도 있어 20초에 한 번 조용히 맞춥니다.
setInterval(function(){
  if (document.visibilityState === 'visible') refresh();
}, 20000);

// 사라질 시각이 되면 저절로 가려지도록 10초마다 다시 그립니다.
// ⚠ 가릴 것이 있을 때만 그립니다. 없으면 화면을 건드리지 않습니다.
setInterval(function(){
  if (document.visibilityState !== 'visible') return;
  const now = new Date();
  const due = msgs.some(function(m){
    return m.expires_at && !m.deleted_at && new Date(m.expires_at) <= now;
  });
  if (due) paint(true);
}, 10000);

// 다른 링크로 온 메시지는 공용 알림이 맡습니다.
// 이 방 것은 아래에서 가로채 직접 처리합니다.
function watchOthers(){
  AL.startAlerts({
    onMessage: function(m){
      if (m.link_id !== linkId) return false;      // 다른 방 — 공용이 소리를 냅니다
      if (!msgs.some(function(x){ return x.id === m.id; })) refresh();
      return true;                                  // 이 방 것은 내가 처리했습니다
    },
  });
}

window.addEventListener('beforeunload', function(){
  if (channel) { try { AL.sb.removeChannel(channel); } catch (e) {} }
  if (AL._alertWatcher && AL._alertWatcher.stop) AL._alertWatcher.stop();
});
</script>
